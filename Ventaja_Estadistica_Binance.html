<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Calculadora de ventaja estadística para BTC/USDT en Binance: costos, punto de equilibrio, riesgo de ruina, Monte Carlo y validación de historial.">
<title>Ventaja Estadística Binance</title>
<style>
/* Concepto: mesa de riesgo — barra superior fija con el veredicto, pestañas desplazables,
   secciones plegables con casilla, cifras tabulares; el acento tinta azul marca la navegación
   y el verde/rojo/ámbar solo significa estado (ventaja positiva, negativa, alerta). */
:root {
  --bg: #f2f4f8;
  --surface: #ffffff;
  --surface-2: #f7f9fc;
  --sunken: #e9edf3;
  --ink: #0f1a2c;
  --ink-2: #3c4960;
  --muted: #667288;
  --line: #dce2eb;
  --line-strong: #c2cbd8;
  --accent: #1f3a68;
  --accent-ink: #ffffff;
  --accent-soft: #e1e8f4;
  --focus: #2a78d6;
  --good: #0a6e2e;
  --good-bg: #e2f2e6;
  --bad: #b3261e;
  --bad-bg: #fbe6e4;
  --warn: #7f5200;
  --warn-bg: #fff1cf;
  --c1: #2a78d6;
  --c2: #eb6834;
  --c1-wash: rgba(42, 120, 214, .10);
  --c1-wash-2: rgba(42, 120, 214, .20);
  --mark-good: #0ca30c;
  --mark-bad: #d03b3b;
  --grid: #e4e8ef;
  --axis: #b9c2d0;
  --pos-pole: #86b6ef;
  --neg-pole: #f0a19d;
  --heat-mid: #f5f6f8;
  --shadow: 0 1px 2px rgba(15, 26, 44, .06);
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --r: 10px;
  --r-sm: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1019; --surface: #121927; --surface-2: #161e2d; --sunken: #0e1420;
    --ink: #e7ecf4; --ink-2: #b5c0d2; --muted: #8a95a9; --line: #232f45; --line-strong: #34425d;
    --accent: #a8c0ea; --accent-ink: #0b1019; --accent-soft: #1b2a45; --focus: #6aa6ef;
    --good: #4cd07d; --good-bg: #10301d; --bad: #ff8a80; --bad-bg: #3a1a1a; --warn: #f2bb4f; --warn-bg: #33280e;
    --c1: #3987e5; --c2: #d95926; --c1-wash: rgba(57, 135, 229, .14); --c1-wash-2: rgba(57, 135, 229, .26);
    --grid: #1e283b; --axis: #3a4861; --pos-pole: #1c5cab; --neg-pole: #8a2e2b; --heat-mid: #182131;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1019; --surface: #121927; --surface-2: #161e2d; --sunken: #0e1420;
  --ink: #e7ecf4; --ink-2: #b5c0d2; --muted: #8a95a9; --line: #232f45; --line-strong: #34425d;
  --accent: #a8c0ea; --accent-ink: #0b1019; --accent-soft: #1b2a45; --focus: #6aa6ef;
  --good: #4cd07d; --good-bg: #10301d; --bad: #ff8a80; --bad-bg: #3a1a1a; --warn: #f2bb4f; --warn-bg: #33280e;
  --c1: #3987e5; --c2: #d95926; --c1-wash: rgba(57, 135, 229, .14); --c1-wash-2: rgba(57, 135, 229, .26);
  --grid: #1e283b; --axis: #3a4861; --pos-pole: #1c5cab; --neg-pole: #8a2e2b; --heat-mid: #182131;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 var(--font-ui);
  margin: 0;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num, table.data td.n, table.kv td.v { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--font-mono); font-size: 13px; }
.pos { color: var(--good); }
.neg { color: var(--bad); }

/* ---------- Barra superior y pestañas ---------- */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.top-row {
  max-width: 1280px;
  margin: 0 auto;
  padding: 10px 16px 6px;
  display: flex;
  align-items: center;
  gap: 10px 16px;
  flex-wrap: wrap;
}
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font-size: 16px; letter-spacing: -.01em; }
.brand span { font-size: 12px; color: var(--muted); }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
  border: 1px solid transparent; white-space: nowrap;
}
.chip.pos { background: var(--good-bg); color: var(--good); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
.chip.neg { background: var(--bad-bg); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.chip.eq, .chip.warn { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.top-kpi { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-left: auto; }
.top-kpi b { color: var(--ink); font-variant-numeric: tabular-nums; }
.tabs {
  max-width: 1280px; margin: 0 auto; padding: 0 8px;
  display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin;
}
.tab {
  appearance: none; background: none; border: 0; cursor: pointer;
  padding: 9px 10px 10px; font-size: 14px; color: var(--muted); white-space: nowrap;
  border-bottom: 2px solid transparent;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.tab .tag { font-size: 11px; font-weight: 600; margin-left: 4px; color: var(--muted); }
@media (max-width: 700px) {
  .top-kpi { display: none; }
  .top-row { flex-wrap: nowrap; justify-content: space-between; padding-block: 8px 4px; }
  .brand span { display: none; }
  .brand b { font-size: 15px; white-space: nowrap; }
  .chip { font-size: 12px; padding: 3px 9px; }
}

/* ---------- Contenido ---------- */
main.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 48px; }
.panel { display: grid; gap: 14px; }
.panel[hidden] { display: none; }
.panel-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.panel-head h1 { font-size: 22px; letter-spacing: -.015em; }
.panel-head p { color: var(--ink-2); max-width: 70ch; margin-top: 4px; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.cols { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 960px) {
  .cols.c-calc { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
  .cols.c-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}
.stack { display: grid; gap: 14px; min-width: 0; }
/* Ningún hijo de rejilla puede ensanchar la página: las tablas anchas se desplazan dentro de .tbl */
.panel > *, .panel-body, .sec-b > *, .stack > *, .cols > * { min-width: 0; }

/* ---------- Secciones plegables ---------- */
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.sec-h {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid var(--line);
}
.sec.collapsed .sec-h { border-bottom-color: transparent; }
.sec.collapsed > .sec-b { display: none; }
.sec-t { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; font-size: 15px; min-width: 0; }
.sec-t input { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); flex: none; cursor: pointer; }
.sec-aside { font-size: 12.5px; color: var(--muted); text-align: right; }
.sec-b { padding: 14px; display: grid; gap: 12px; min-width: 0; }
.sec.flush > .sec-b { padding: 0; }
.sec-note { font-size: 13px; color: var(--muted); }

/* ---------- Botones ---------- */
.btn {
  appearance: none; cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface);
  color: var(--ink); border-radius: var(--r-sm); padding: 6px 11px; font-size: 13.5px; line-height: 1.3;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.sm { padding: 3px 8px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- Campos ---------- */
.fields { display: grid; gap: 10px; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) 10.5rem; gap: 2px 12px; align-items: center; }
.field > label { font-size: 14px; color: var(--ink); }
.field .unit { color: var(--muted); font-size: 12px; }
.field .help { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.field .err { grid-column: 1 / -1; font-size: 12.5px; color: var(--bad); }
.field.invalid input { border-color: var(--bad); }
.field.off { opacity: .55; }
.inp { position: relative; display: flex; align-items: center; }
.inp input, .inp select, select.sel, input.txt, textarea {
  width: 100%; border: 1px solid var(--line-strong); background: var(--surface-2); border-radius: var(--r-sm);
  padding: 6px 8px; font-size: 14px; font-variant-numeric: tabular-nums; min-width: 0;
}
.inp input { text-align: right; }
.inp.suffix input { padding-right: 26px; }
.inp .sfx { position: absolute; right: 8px; color: var(--muted); font-size: 13px; pointer-events: none; }
.inp select { text-align: left; }
.link-badge { font-size: 11px; color: var(--muted); }
textarea { font-family: var(--font-mono); font-size: 12.5px; min-height: 130px; resize: vertical; }
@media (max-width: 520px) {
  .field { grid-template-columns: minmax(0, 1fr) 8.8rem; }
}

/* ---------- Veredicto, tiles, alertas ---------- */
.verdict {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r);
  font-weight: 600; border: 1px solid transparent;
}
.verdict .ic { font-size: 18px; line-height: 1.2; }
.verdict.pos { background: var(--good-bg); color: var(--good); }
.verdict.neg { background: var(--bad-bg); color: var(--bad); }
.verdict.eq, .verdict.warn { background: var(--warn-bg); color: var(--warn); }
.verdict.none { background: var(--sunken); color: var(--ink-2); }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 700px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1180px) { .tiles.six-wide { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; min-width: 0; }
.tile .l { font-size: 12.5px; color: var(--muted); }
.tile .v { font-size: clamp(16px, 4.4vw, 21px); font-weight: 650; letter-spacing: -.01em; margin-top: 2px; overflow-wrap: anywhere; }
.tile .s { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.alerts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.alerts li { display: flex; gap: 8px; align-items: flex-start; padding: 7px 10px; border-radius: var(--r-sm); font-size: 13.5px; }
.alerts li.ok { background: var(--good-bg); color: var(--good); }
.alerts li.no { background: var(--warn-bg); color: var(--warn); }
.alerts li .ic { font-weight: 700; flex: none; width: 1.1em; text-align: center; }
.desk { margin: 0; padding-left: 18px; display: grid; gap: 7px; color: var(--ink-2); }
.desk b { color: var(--ink); }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* ---------- Tablas ---------- */
.tbl { overflow-x: auto; min-width: 0; -webkit-overflow-scrolling: touch; }
table.data, table.kv { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.data th, table.data td { padding: 6px 9px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.data thead th { font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--surface-2); position: sticky; top: 0; white-space: normal; vertical-align: bottom; min-width: 64px; }
table.data td.n, table.data th.n { text-align: right; }
table.data tr.tot td { font-weight: 650; background: var(--surface-2); }
table.data td.wrap { white-space: normal; min-width: 220px; }
table.data tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
table.kv td { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.kv tr:last-child td { border-bottom: 0; }
table.kv td.k { color: var(--ink-2); padding-right: 12px; }
table.kv td.v { text-align: right; white-space: nowrap; font-weight: 600; }
table.kv td.v .bps { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); }
table.kv td.nt { display: none; }
@media (min-width: 1180px) {
  table.kv td.nt { display: table-cell; color: var(--muted); font-size: 12px; padding-left: 14px; width: 42%; }
}
table.kv tr.em td.k { color: var(--ink); font-weight: 600; }
.heat td.h { text-align: right; font-variant-numeric: tabular-nums; }
.heat td.h.p { background: color-mix(in srgb, var(--pos-pole) calc(var(--t) * 100%), var(--heat-mid)); }
.heat td.h.q { background: color-mix(in srgb, var(--neg-pole) calc(var(--t) * 100%), var(--heat-mid)); }
.heat td.h.z { background: var(--heat-mid); }
.heat td.cur { outline: 2px solid var(--ink); outline-offset: -2px; }
th input.hin, td input.hin {
  width: 5.2em; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 4px;
  padding: 2px 4px; text-align: right; font-size: 12.5px; font-variant-numeric: tabular-nums;
}
.scale { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.scale .bar { width: 160px; max-width: 40vw; height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--neg-pole), var(--heat-mid), var(--pos-pole)); border: 1px solid var(--line); }
.scale .bar.risk { background: linear-gradient(90deg, var(--pos-pole), var(--heat-mid), var(--neg-pole)); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.pill.pos { background: var(--good-bg); color: var(--good); }
.pill.neg { background: var(--bad-bg); color: var(--bad); }
.pill.eq, .pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.none { background: var(--sunken); color: var(--ink-2); }

/* ---------- Gráficos ---------- */
.chart-host { min-width: 0; }
.chart { position: relative; }
.chart svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart .tick, .chart .cat, .chart .val, .chart .axis-label, .chart .hline-label, .chart .pt-label { fill: var(--muted); font-size: 11.5px; font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
.chart .cat { fill: var(--ink-2); font-size: 12px; }
.chart .val { fill: var(--ink); font-size: 12px; font-weight: 600; }
.chart .axis-label { fill: var(--ink-2); }
.chart .pt-label { fill: var(--ink); font-weight: 600; }
.chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ln.c1 { stroke: var(--c1); }
.chart .ln.c2 { stroke: var(--c2); }
.chart .ln.ink { stroke: var(--ink); }
.chart .ln.dash { stroke-dasharray: 6 5; }
.chart .thin { fill: none; stroke-width: 1; stroke-linejoin: round; }
.chart .thin.c1 { stroke: var(--c1); stroke-opacity: .28; }
.chart .band.b1 { fill: var(--c1-wash); stroke: none; }
.chart .band.b2 { fill: var(--c1-wash-2); stroke: none; }
.chart .hline { stroke-width: 1.5; }
.chart .hline.bad { stroke: var(--mark-bad); }
.chart .hline.ink { stroke: var(--ink-2); stroke-dasharray: 4 4; }
.chart .pt { stroke: var(--surface); stroke-width: 2; }
.chart .pt.c1 { fill: var(--c1); }
.chart .pt.ink { fill: var(--ink); }
.chart .bar { stroke: var(--surface); stroke-width: 1; cursor: default; }
.chart .bar.c1 { fill: var(--c1); }
.chart .bar.good { fill: var(--mark-good); }
.chart .bar.bad { fill: var(--mark-bad); }
.chart .bar.on, .chart .bar:focus { filter: brightness(1.15); outline: none; }
.chart .cross { stroke: var(--line-strong); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .hit:focus { outline: none; }
.tt {
  position: absolute; z-index: 5; pointer-events: none; min-width: 120px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong);
  border-radius: var(--r-sm); padding: 7px 9px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
}
.tt-h { color: var(--muted); font-size: 11.5px; margin-bottom: 3px; }
.tt-row { display: flex; align-items: center; gap: 7px; }
.tt-v { font-variant-numeric: tabular-nums; }
.tt-n { color: var(--ink-2); }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
.lg-item { display: inline-flex; align-items: center; gap: 6px; }
.lg-key { display: inline-block; flex: none; }
.lg-key.line { width: 16px; height: 0; border-top: 2px solid var(--c1); }
.lg-key.line.c2 { border-top-color: var(--c2); }
.lg-key.line.ink { border-top-color: var(--ink); }
.lg-key.line.dash { border-top-style: dashed; }
.lg-key.line.bad { border-top-color: var(--mark-bad); }
.lg-key.rect { width: 12px; height: 12px; border-radius: 2px; background: var(--c1-wash-2); }
.lg-key.rect.b1 { background: var(--c1-wash); border: 1px solid var(--c1-wash-2); }
.lg-key.thin { width: 16px; height: 0; border-top: 1px solid var(--c1); opacity: .5; }

/* ---------- Varios ---------- */
.kvs { display: grid; gap: 4px 16px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.note-box { background: var(--sunken); border-radius: var(--r-sm); padding: 10px 12px; font-size: 13.5px; color: var(--ink-2); }
.prose { max-width: 78ch; display: grid; gap: 10px; color: var(--ink-2); }
.prose h3 { font-size: 15px; color: var(--ink); margin-top: 4px; }
.prose ul, .prose ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.prose code, code.inl { font-family: var(--font-mono); font-size: 12.5px; background: var(--sunken); padding: 1px 5px; border-radius: 4px; }
pre.code { margin: 0; font-family: var(--font-mono); font-size: 12.5px; background: var(--sunken); padding: 10px 12px; border-radius: var(--r-sm); overflow-x: auto; }
.pager { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.msg { font-size: 13px; padding: 7px 10px; border-radius: var(--r-sm); }
.msg.ok { background: var(--good-bg); color: var(--good); }
.msg.err { background: var(--bad-bg); color: var(--bad); }
.msg.info { background: var(--accent-soft); color: var(--accent); }
.status-ok { color: var(--good); font-weight: 600; }
.status-ko { color: var(--bad); font-weight: 600; }
details.fails summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
details.fails pre { white-space: pre-wrap; margin: 6px 0 0; font-size: 12px; }
.row-ex td { color: var(--muted); }
.foot { max-width: 1280px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 12.5px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><b>Ventaja Estadística</b><span>BTC/USDT · Binance spot y futuros</span></div>
    <span id="verdict-chip" class="chip info" role="status">Calculando…</span>

    const sp = J.filter(v => v > 0).reduce((s, v) => s + v, 0), sn = J.filter(v => v < 0).reduce((s, v) => s + v, 0);
    h.PF = sn < 0 ? sp / -sn : 0;
    h.DD = h.N > 0 ? maxDD : 0;
    h.SD = h.N > 1 ? stdevS(J) : 0;
    h.SE = h.N > 1 ? h.SD / Math.sqrt(h.N) : 0;
    h.T = h.SE > 0 ? h.EV / h.SE : 0;
    h.P = h.N > 1 ? (h.T >= 0 ? tdistRight(h.T, h.N - 1) : 1 - tdistRight(Math.abs(h.T), h.N - 1)) : 1;
    const tq = h.N > 1 ? tinv(1 - conf, h.N - 1) : 0;
    h.ICl = h.N > 1 ? h.EV - tq * h.SE : 0;
    h.ICu = h.N > 1 ? h.EV + tq * h.SE : 0;
    h.WReq = h.Win + h.Loss > 0 ? (h.Loss + cost) / (h.Win + h.Loss) : 0;
    const z2 = normInv(1 - (1 - conf) / 2);
    h.WRl = h.N > 0 ? Math.max(0, h.WR - z2 * Math.sqrt(h.WR * (1 - h.WR) / h.N)) : 0;
    h.WRu = h.N > 0 ? Math.min(1, h.WR + z2 * Math.sqrt(h.WR * (1 - h.WR) / h.N)) : 0;
    h.Need = (h.EV > 0 && h.SD > 0) ? roundUp(Math.pow(normInv(conf) * h.SD / h.EV, 2)) : 0;
    if (h.N === 0) h.verdict = { kind: 'none', text: 'Sin datos: carga tus operaciones en la tabla o importa un CSV' };
    else if (h.N < 30) h.verdict = { kind: 'warn', text: `Muestra insuficiente (${h.N} ops): necesitas al menos 30, idealmente cientos` };
    else if (h.EV > 0 && h.P < 1 - conf) h.verdict = { kind: 'good', text: `Ventaja neta estadísticamente significativa al ${fmtNum(conf * 100, 0)}%` };
    else if (h.EV > 0) h.verdict = { kind: 'warn', text: `EV neto positivo pero no significativo: necesitas ≈ ${fmtNum(h.Need, 0)} operaciones` };
    else h.verdict = { kind: 'bad', text: 'Sin ventaja neta: el EV después de costos es ≤ 0' };
    return h;
  }

  /* ---------- Cálculo principal (hoja Calculadora y tablas derivadas) ---------- */
  function calc(S, B, trades) {
    B = B || BINANCE;
    const r = {};
    const mmr = (S.mmr === null || S.mmr === undefined) ? B.mmr : S.mmr;
    r.MMR = mmr;
    // Parámetros efectivos
    r.LevEf = S.mercado === 'SPOT' ? 1 : S.lev;
    r.Notional = S.margen * r.LevEf;
    r.K = S.capital > 0 ? r.Notional / S.capital : 0;
    const vi = B.vip.findIndex(v => v.nivel === S.vip);
    const row = B.vip[vi >= 0 ? vi : 0];
    const dS = S.bnb === 'SÍ' ? B.descSpot : 0, dF = S.bnb === 'SÍ' ? B.descFut : 0;
    if (S.fuenteCom === 'MANUAL') { r.Maker = S.makerMan; r.Taker = S.takerMan; }
    else if (S.mercado === 'SPOT') { r.Maker = row.spotMk * (1 - dS); r.Taker = row.spotTk * (1 - dS); }
    else { r.Maker = row.futMk * (1 - dF); r.Taker = row.futTk * (1 - dF); }
    r.FeeIn = S.tipoIn === 'MAKER' ? r.Maker : r.Taker;
    r.FeeOut = S.tipoOut === 'MAKER' ? r.Maker : r.Taker;
    r.DirSign = S.dir === 'SHORT' ? -1 : 1;
    r.FundPctFut = (S.fundTrat === 'COSTO SIEMPRE' ? Math.abs(S.fundRate) : S.fundRate * r.DirSign) * S.fundPer;
    r.FundPct = S.mercado === 'SPOT' ? 0 : r.FundPctFut;
    r.CostPctVar = r.FeeIn + r.FeeOut + S.spread + S.slipIn + S.slipOut + r.FundPct;
    r.CostPct = r.CostPctVar + (r.Notional > 0 ? S.otros / r.Notional : 0);

    const h = histStats(trades, r.CostPct, r.Notional, S.capital, S.conf);
    r.h = h;
    r.usaHist = S.fuenteEst === 'HISTORIAL' && h.N > 0;
    r.WR = r.usaHist ? h.WR : S.wrIn;
    r.Win = r.usaHist ? h.Win : S.winIn;
    r.Loss = r.usaHist ? h.Loss : S.lossIn;
    r.WN = r.Win - r.CostPct;
    r.LN = r.Loss + r.CostPct;
    r.RuinLvl = S.capital * (1 - S.ruinPct);
    r.Fijo = S.modo === 'FIJO';

    // Operación concreta
    r.Qty = S.pxIn > 0 ? r.Notional / S.pxIn : 0;
    r.Move = S.pxIn > 0 ? (S.pxOut / S.pxIn - 1) * r.DirSign : 0;
    r.PnLBruto = r.Qty * (S.pxOut - S.pxIn) * r.DirSign;
    r.ComIn = r.Notional * r.FeeIn;
    r.ComOut = r.Qty * S.pxOut * r.FeeOut;
    r.SpreadUSD = r.Notional * S.spread;
    r.SlipInUSD = r.Notional * S.slipIn;
    r.SlipOutUSD = r.Qty * S.pxOut * S.slipOut;
    r.FundUSD = r.Notional * r.FundPct;
    r.OtrosUSD = S.otros;
    r.CostOp = r.ComIn + r.ComOut + r.SpreadUSD + r.SlipInUSD + r.SlipOutUSD + r.FundUSD + r.OtrosUSD;
    r.CostOpPctN = r.Notional > 0 ? r.CostOp / r.Notional : 0;
    r.CostOpPctM = S.margen > 0 ? r.CostOp / S.margen : 0;
    r.PnLNeto = r.PnLBruto - r.CostOp;
    r.ROE = S.margen > 0 ? r.PnLNeto / S.margen : 0;
    r.PxBE = S.pxIn * (1 + r.DirSign * r.CostPct);
    r.PxLiq = S.mercado === 'SPOT' ? 0 : (S.dir === 'LONG' ? S.pxIn * (1 - 1 / r.LevEf) / (1 - mmr) : S.pxIn * (1 + 1 / r.LevEf) / (1 + mmr));
    r.DistLiq = (S.mercado === 'SPOT' || S.pxIn === 0) ? 1 : Math.abs(r.PxLiq / S.pxIn - 1);

    // Estrategia — valor esperado
    r.GanUSD = r.Win * r.Notional;
    r.PerUSD = r.Loss * r.Notional;
    r.RR = r.Loss > 0 ? r.Win / r.Loss : 0;
    r.EVbruto = r.WR * r.GanUSD - (1 - r.WR) * r.PerUSD;
    r.EVbrutoPct = r.WR * r.Win - (1 - r.WR) * r.Loss;
    r.CostUSD = r.CostPct * r.Notional;
    r.EVnet = round(r.EVbruto - r.CostUSD, 8);
    r.EVnetPct = round(r.EVbrutoPct - r.CostPct, 12);
    r.EVnetCap = S.capital > 0 ? r.EVnet / S.capital : 0;
    r.EVR = r.LN > 0 ? r.EVnetPct / r.LN : 0;
    r.TotalN = S.numOps * r.EVnet;
    r.WReq = r.Win + r.Loss > 0 ? (r.Loss + r.CostPct) / (r.Win + r.Loss) : 1;
    r.WRmargin = round(r.WR - r.WReq, 12);
    r.MinEdge = r.CostPct;
    r.Colchon = r.CostPct > 0 ? r.EVbrutoPct / r.CostPct : 0;
    r.PF = (1 - r.WR) * r.LN > 0 ? Math.max(0, r.WR * r.WN) / ((1 - r.WR) * r.LN) : 0;
    r.RiesgoOp = S.capital > 0 ? r.LN * r.Notional / S.capital : 0;
    r.Kelly = (r.WN > 0 && r.LN > 0) ? Math.max(0, r.WR - (1 - r.WR) / (r.WN / r.LN)) : 0;

    // Riesgo
    r.Sigma = Math.sqrt(Math.max(0, r.WR * (1 - r.WR))) * (r.Win + r.Loss) * r.Notional;
    r.Sharpe = r.Sigma > 0 ? r.EVnet / r.Sigma : 0;
    r.PLossN = r.Sigma > 0 ? normCdf(-r.EVnet * Math.sqrt(S.numOps) / r.Sigma) : (r.EVnet < 0 ? 1 : 0);
    r.RoR = r.EVnet <= 0 ? 1 : (r.Sigma > 0 ? Math.exp(-2 * r.EVnet * S.capital * S.ruinPct / (r.Sigma * r.Sigma)) : 0);
    r.OpsRuina = r.EVnet < 0 ? S.capital * S.ruinPct / -r.EVnet : 0;
    r.Racha = (r.WR > 0 && r.WR < 1 && S.numOps * r.WR > 0) ? round(Math.log(S.numOps * r.WR) / Math.log(1 / (1 - r.WR)), 0) : 0;
    r.RachaPct = S.capital > 0 ? r.Racha * r.LN * r.Notional / S.capital : 0;
    r.OpsValid = r.EVnet > 0 ? roundUp(Math.pow(normInv(S.conf) * r.Sigma / r.EVnet, 2)) : 0;
    r.CapFijo = S.capital + r.TotalN;
    const g = (1 - r.K * r.LN <= 0 || 1 + r.K * r.WN <= 0) ? null
      : r.WR * Math.log(1 + r.K * r.WN) + (1 - r.WR) * Math.log(1 - r.K * r.LN);
    r.LogG = g;
    r.CapComp = g === null ? 0 : S.capital * Math.exp(S.numOps * g);

    // Alertas y veredicto
    const ok = t => ({ ok: true, text: t }), warn = t => ({ ok: false, text: t });
    r.alerts = [
      (S.mercado === 'SPOT' && S.dir === 'SHORT') ? warn('En SPOT no puedes abrir cortos sin margen') : ok('Dirección válida para el mercado'),
      S.margen > S.capital ? warn('El margen por operación supera tu capital') : ok('Margen dentro del capital'),
      r.LevEf > B.maxLev ? warn('Supera el apalancamiento máximo de BTCUSDT') : ok('Apalancamiento dentro del límite'),
      S.mercado === 'SPOT' ? ok('Spot: sin riesgo de liquidación')
        : (r.Loss >= r.DistLiq ? warn('La pérdida media alcanza la liquidación: el stop no llegaría a ejecutarse') : ok('El stop medio queda antes de la liquidación')),
      (-r.TotalN > S.capital) ? warn(`Perderías más que tu capital: la ruina llega en ≈ ${fmtNum(r.OpsRuina, 0)} operaciones`) : ok('El resultado esperado no supera tu capital'),
      r.Kelly === 0 ? warn('Kelly = 0%: con esta estadística no hay tamaño óptimo positivo')
        : (r.RiesgoOp > r.Kelly ? warn(`Arriesgas más que Kelly (${fmtNum(r.RiesgoOp * 100, 2)}% vs ${fmtNum(r.Kelly * 100, 2)}%)`) : ok('Riesgo por operación ≤ Kelly')),
      (S.fuenteEst === 'HISTORIAL' && h.N === 0) ? warn('Historial vacío: se usan las estadísticas manuales')
        : (S.fuenteEst === 'HISTORIAL' ? ok(`Estadísticas tomadas del Historial (${h.N} ops)`) : ok('Estadísticas manuales'))
    ];
    r.verdict = r.EVnet > 0 ? { kind: 'pos', text: `Ventaja neta positiva: la estrategia supera sus costos (${fmtNum(r.EVnet, 2)} USDT por operación)` }
      : r.EVnet === 0 ? { kind: 'eq', text: 'Punto de equilibrio: la ventaja bruta solo paga los costos' }
        : { kind: 'neg', text: `Ventaja neta negativa: los costos se comen la ventaja (${fmtNum(r.EVnet, 2)} USDT por operación)` };

    // Extras solo web (dimensionamiento de desk)
    r.x = {
      costBps: r.CostPct * 1e4, edgeBps: r.EVbrutoPct * 1e4, netBps: r.EVnetPct * 1e4,
      halfKelly: r.Kelly / 2,
      notionalKelly: r.LN > 0 ? S.capital * r.Kelly / r.LN : 0,
      notionalHalfKelly: r.LN > 0 ? S.capital * r.Kelly / 2 / r.LN : 0,
      notionalRiesgo: r.LN > 0 ? S.capital * S.riesgoObj / r.LN : 0,
      levRiesgo: (S.margen > 0 && r.LN > 0) ? (S.capital * S.riesgoObj / r.LN) / S.margen : 0,
      evDia: r.EVnet * S.opsDia, evMes: r.EVnet * S.opsDia * 30, evAnio: r.EVnet * S.opsDia * 365,
      sharpeAnual: r.Sharpe * Math.sqrt(Math.max(0, S.opsDia) * 365),
      diasValid: S.opsDia > 0 ? r.OpsValid / S.opsDia : 0
    };

    // ---- Escenarios ----
    const L = r.Loss, C = r.CostPct, N = S.numOps;
    const ev = (p, rr) => p * L * rr - (1 - p) * L - C;
    r.esc = {
      m1: S.escWR.map(p => S.escRR.map(rr => ev(p, rr))),
      m2: S.escWR.map(p => S.escRR.map(rr => ev(p, rr) * r.Notional * N)),
      m3: S.escWR.map(p => S.escRR.map(rr => {
        const e = ev(p, rr), sd = Math.sqrt(p * (1 - p)) * L * (rr + 1);
        const z = -e * Math.sqrt(N) / sd;
        return (sd > 0 && isFinite(z)) ? normCdf(z) : (e < 0 ? 1 : 0);
      })),
      be: {
        sin: S.escRR.map(rr => 1 / (1 + rr)),
        con: S.escRR.map(rr => L > 0 ? (L + C) / (L * (1 + rr)) : 1)
      },
      detalle: S.detalle.map(([w, rr]) => {
        const gan = L * rr, perd = L, evb = w * gan - (1 - w) * perd, evn = evb - C;
        return { w, rr, gan, perd, evb, cost: C, evn, resOp: evn * r.Notional, resN: evn * r.Notional * N };
      })
    };
    r.esc.be.diff = r.esc.be.con.map((v, i) => v - r.esc.be.sin[i]);

    // ---- Supervivencia ----
    r.sup = {
      rows: S.edges.map(e => {
        const vUSD = e * r.Notional, neto = round(vUSD - r.CostUSD, 6);
        return {
          e, vUSD, cost: r.CostUSD, neto, t100: neto * 100, t1000: neto * 1000, t10000: neto * 10000,
          capN: S.capital + neto * N, opsRuina: neto < 0 ? S.capital * S.ruinPct / -neto : 0,
          estado: neto > 0 ? 'Gana' : (neto === 0 ? 'Equilibrio' : 'Pierde')
        };
      }),
      actual: r.EVbrutoPct, min: r.MinEdge, diff: r.EVbrutoPct - r.MinEdge,
      curva: S.rrs2.map(rr => ({ rr, sin: 1 / (1 + rr), con: L > 0 ? (L + C) / (L * (1 + rr)) : 1, gan: L * rr, perd: L }))
    };
    r.sup.curva.forEach(c => { c.diff = c.con - c.sin; });

    // ---- Sensibilidad ----
    const other = r.Notional > 0 ? S.otros / r.Notional : 0;
    const comps = [['Comisión entrada', r.FeeIn], ['Comisión salida', r.FeeOut], ['Spread', S.spread],
      ['Slippage entrada', S.slipIn], ['Slippage salida', S.slipOut], ['Funding', r.FundPct]];
    const des = comps.map(([n, p]) => ({ n, usd: p * r.Notional, pctN: p }));
    des.push({ n: 'Otros costes fijos', usd: S.otros, pctN: other });
    des.forEach(d => { d.pctCost = r.CostUSD !== 0 ? d.usd / r.CostUSD : 0; d.pctCap = S.capital > 0 ? d.usd / S.capital : 0; });
    const tot = { n: 'TOTAL', usd: 0, pctN: 0, pctCost: 0, pctCap: 0 };
    des.forEach(d => { tot.usd += d.usd; tot.pctN += d.pctN; tot.pctCost += d.pctCost; tot.pctCap += d.pctCap; });
    const wrEqOf = cost => (r.Win + r.Loss > 0) ? (r.Loss + cost) / (r.Win + r.Loss) : 1;
    const orden = [['MAKER', 'MAKER'], ['MAKER', 'TAKER'], ['TAKER', 'MAKER'], ['TAKER', 'TAKER']].map(([a, b]) => {
      const fi = a === 'MAKER' ? r.Maker : r.Taker, fo = b === 'MAKER' ? r.Maker : r.Taker;
      const cons = fi + fo + (r.CostPct - r.FeeIn - r.FeeOut);
      const opt = cons - (a === 'MAKER' ? S.slipIn + S.spread / 2 : 0) - (b === 'MAKER' ? S.slipOut + S.spread / 2 : 0);
      const evCons = (r.EVbrutoPct - cons) * r.Notional;
      return { n: `${a} / ${b}`, fi, fo, cons, opt, evCons, evOpt: (r.EVbrutoPct - opt) * r.Notional, wrEq: wrEqOf(cons), resN: evCons * N };
    });
    const mercado = [['SPOT sin BNB', 'spot', 0], ['SPOT con BNB', 'spot', 1], ['FUTURES sin BNB', 'fut', 0], ['FUTURES con BNB', 'fut', 1]].map(([n, m, bnb]) => {
      const mk = m === 'spot' ? row.spotMk : row.futMk, tk = m === 'spot' ? row.spotTk : row.futTk;
      const disc = bnb ? (m === 'spot' ? B.descSpot : B.descFut) : 0;
      const fi = (S.tipoIn === 'MAKER' ? mk : tk) * (1 - disc), fo = (S.tipoOut === 'MAKER' ? mk : tk) * (1 - disc);
      const fund = m === 'fut' ? r.FundPctFut : 0;
      const cost = fi + fo + fund + S.spread + S.slipIn + S.slipOut + other;
      return { n, fi, fo, fund, cost, evPct: r.EVbrutoPct - cost, wrEq: wrEqOf(cost), lev: m === 'spot' ? 1 : S.lev };
    });
    const levRows = S.levs.map(Lv => {
      const notional = S.margen * Lv, costUSD = r.CostPctVar * notional + S.otros;
      const e = r.EVbrutoPct * notional - costUSD;
      const pxLiq = S.dir === 'LONG' ? S.pxIn * (1 - 1 / Lv) / (1 - mmr) : S.pxIn * (1 + 1 / Lv) / (1 + mmr);
      const dist = S.pxIn > 0 ? Math.abs(pxLiq / S.pxIn - 1) : 0;
      const sig = Math.sqrt(Math.max(0, r.WR * (1 - r.WR))) * (r.Win + r.Loss) * notional;
      return {
        lev: Lv, notional, costUSD, costCap: S.capital > 0 ? costUSD / S.capital : 0, ev: e, evCap: S.capital > 0 ? e / S.capital : 0,
        lossCap: S.capital > 0 ? (r.Loss * notional + costUSD) / S.capital : 0, pxLiq, dist,
        stop: r.Loss < dist ? 'Sí' : 'NO — liquida',
        ror: e <= 0 ? 1 : (sig > 0 ? Math.exp(-2 * e * S.capital * S.ruinPct / (sig * sig)) : 0),
        ploss: sig > 0 ? normCdf(-e * Math.sqrt(N) / sig) : (e < 0 ? 1 : 0)
      };
    });
    const vipRows = B.vip.map(v => {
      const disc = S.bnb === 'SÍ' ? (S.mercado === 'SPOT' ? B.descSpot : B.descFut) : 0;
      const mk = (S.mercado === 'SPOT' ? v.spotMk : v.futMk) * (1 - disc), tk = (S.mercado === 'SPOT' ? v.spotTk : v.futTk) * (1 - disc);
      const cost = (S.tipoIn === 'MAKER' ? mk : tk) + (S.tipoOut === 'MAKER' ? mk : tk) + S.spread + S.slipIn + S.slipOut + r.FundPct + other;
      const e = (r.EVbrutoPct - cost) * r.Notional;
      return { nivel: v.nivel, mk, tk, cost, ev: e, wrEq: wrEqOf(cost), resN: e * N, vol: v.vol };
    });
    r.sens = { des, tot, orden, mercado, lev: levRows, vip: vipRows };

    // ---- Riesgo ----
    const zc = normInv(1 - (1 - S.conf) / 2);
    const capCompAt = n => g === null ? 0 : S.capital * Math.exp(n * g);
    r.riesgo = {
      z: zc,
      horiz: S.hs.map(n => {
        const res = n * r.EVnet, sd = r.Sigma * Math.sqrt(n), capF = S.capital + res;
        return {
          n, res, sd, lo: res - zc * sd, hi: res + zc * sd, ploss: sd > 0 ? normCdf(-res / sd) : (res < 0 ? 1 : 0),
          capF, ruina: capF <= r.RuinLvl ? 'Sí' : 'No', capComp: capCompAt(n)
        };
      }),
      ruina: S.umbrales.map(u => {
        const nl = r.LN * r.Notional > 0 ? roundUp(S.capital * u / (r.LN * r.Notional)) : 0;
        return {
          u, capR: S.capital * (1 - u),
          ror: r.EVnet <= 0 ? 1 : (r.Sigma > 0 ? Math.exp(-2 * r.EVnet * S.capital * u / (r.Sigma * r.Sigma)) : 0),
          nl, pr: Math.pow(1 - r.WR, nl)
        };
      }),
      rachas: S.rachasK.map(k => {
        const q = Math.pow(1 - r.WR, k), lossCap = S.capital > 0 ? k * r.LN * r.Notional / S.capital : 0;
        return {
          k, pk: q, pAt: 1 - Math.exp(-(q + Math.max(N - k, 0) * r.WR * q)), lossCap,
          alcanza: lossCap >= S.ruinPct ? 'Sí' : 'No', capTras: Math.max(0, S.capital * (1 - lossCap))
        };
      })
    };
    return r;
  }

  /* ---------- Monte Carlo (hoja MonteCarlo) ---------- */
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function quantile(sorted, q) {
    if (!sorted.length) return 0;
    const pos = (sorted.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
  }
  function monteCarlo(r, S, opt) {
    const paths = Math.max(1, Math.floor(opt.paths)), trades = Math.max(1, Math.floor(opt.trades));
    const rng = mulberry32(opt.seed >>> 0);
    const step = Math.max(1, Math.ceil(trades / 250));
    const idx = [];
    for (let t = 0; t < trades; t += step) idx.push(t);
    idx.push(trades);
    const show = Math.min(paths, opt.show || 25);
    const samples = Array.from({ length: idx.length }, () => new Float64Array(paths));
    const shown = [];
    const final = new Float64Array(paths), minEq = new Float64Array(paths), maxDD = new Float64Array(paths);
    let wins = 0, draws = 0;
    for (let p = 0; p < paths; p++) {
      let eq = S.capital, peak = S.capital, dd = 0, mn = S.capital, si = 0;
      const series = p < show ? [] : null;
      for (let t = 0; t <= trades; t++) {
        if (t > 0 && eq > r.RuinLvl) {           // SI(prev <= ruina; prev; prev + tamaño·resultado)
          const size = r.Fijo ? r.Notional : eq * r.K;
          const u = rng();
          const win = u < r.WR;
          if (win) wins++;
          draws++;
          eq += size * (win ? r.WN : -r.LN);
        }
        if (eq > peak) peak = eq;
        const d = peak > 0 ? (peak - eq) / peak : 0;
        if (d > dd) dd = d;
        if (eq < mn) mn = eq;
        if (t === idx[si]) { samples[si][p] = eq; if (series) series.push(eq); si++; }
      }
      final[p] = eq; minEq[p] = mn; maxDD[p] = dd;
      if (series) shown.push(series);
    }
    const qs = [0.05, 0.25, 0.5, 0.75, 0.95];
    const bands = qs.map(() => []);

        if (typeof o === 'number') { if (!isFinite(o) && !(o === Infinity && /capComp$/i.test(p))) { finite = false; bad = p; } return; }
        if (o && typeof o === 'object') for (const [k, v] of Object.entries(o)) walk(v, p + '.' + k);
      })(r, 'r');

    }
    for (const [k, v] of Object.entries(inv)) add('Invariantes financieros', k, !v.fails.length, { checked: v.n, maxDiff: 0, fails: v.fails });

    /* ===== 4 · Robustez: entradas extremas ===== */

      ['150x', { lev: 150 }], ['confianza 50%', { conf: 0.5 }], ['confianza 99,99%', { conf: 0.9999 }], ['costos enormes (spread 50%)', { spread: 0.5 }],
      ['exposición 100x capital en compuesto', { lev: 100, modo: 'COMPUESTO' }], ['VIP inexistente', { vip: 'VIP 99' }]
    ];

      const c = E.monteCarlo(r, S, { paths: 50, trades: 1000, seed: 8 });

      const worstOver = a.final.map((v, i) => a.ruined[i] ? v : null).filter(v => v !== null)

      add('Monte Carlo', 'La ruina es absorbente: la trayectoria se detiene al cruzar el umbral', worstOver, { checked: a.ruined.reduce((s, v) => s + v, 0) });
      const bandsOK = a.idx.every((_, i) => a.bands[0][i] <= a.bands[1][i] && a.bands[1][i] <= a.bands[2][i] && a.bands[2][i] <= a.bands[3][i] && a.bands[3][i] <= a.bands[4][i]);
      add('Monte Carlo', 'Percentiles ordenados P5 ≤ P25 ≤ P50 ≤ P75 ≤ P95 en cada punto', bandsOK, { checked: a.idx.length });
      // Sin ruina (capital enorme): frecuencia de aciertos y media vs. analítica
      const S2 = Object.assign(E.clone(E.DEFAULTS), { capital: 1e9, ruinPct: 1, wrIn: 0.6, winIn: 0.02, lossIn: 0.01 });
      const r2 = E.calc(S2, E.BINANCE, []);

      const f = m2.wins / m2.draws, se = Math.sqrt(r2.WR * (1 - r2.WR) / m2.draws);
      add('Monte Carlo', `Frecuencia de aciertos ≈ win rate (±4σ): ${(f * 100).toFixed(2)}% vs ${(r2.WR * 100).toFixed(2)}%`, Math.abs(f - r2.WR) <= 4 * se, { checked: m2.draws, maxDiff: Math.abs(f - r2.WR) });
      const meanF = m2.summary.mean, expF = S2.capital + 1000 * r2.EVnet, seM = r2.Sigma * Math.sqrt(1000) / Math.sqrt(400);
      add('Monte Carlo', 'Media final (tamaño fijo) ≈ capital + N·EV (±4 errores estándar)', Math.abs(meanF - expF) <= 4 * seM, { checked: 400, maxDiff: Math.abs(meanF - expF) });
      // Compuesto: mediana ≈ capital·exp(N·g)
      const S3 = Object.assign(E.clone(E.DEFAULTS), { wrIn: 0.6, winIn: 0.02, lossIn: 0.01, lev: 2, modo: 'COMPUESTO', ruinPct: 1 });
      const r3 = E.calc(S3, E.BINANCE, []);

        r => r.delim === ',' && r.trades.length === 2 && r.trades[1].dir === 'SHORT' && r.trades[0].pin === 100000.5);
      csvT('BOM, CRLF, comillas y líneas vacías',
        '﻿"fecha","side","entry","exit","nota"\r\n"2026-09-01","long","100000","101000","con, coma"\r\n\r\n"2026-09-02","short","101200","100150",""\r\n',
        r => r.trades.length === 2 && r.trades[0].nota === 'con, coma' && r.trades[1].dir === 'SHORT');
      csvT('Solo retornos con signo % (modo automático)',

      csvT('Retornos en fracción (0,012) → se leen como fracción',
        'retorno\n0.012\n-0.008', r => !r.pctAuto && r.trades[0].manual === 0.012);
      csvT('Modo forzado "porcentaje"', 'retorno\n0.5\n-0.25', r => Math.abs(r.trades[0].manual - 0.005) < 1e-15, { retorno: 'pct' });
      csvT('Precio con separador de miles ("101.000" y "101,000")',
        'entrada;salida\n101.000;102.500,5\n"99,800";"100,900"', r => r.trades[0].pin === 101000 && r.trades[0].pout === 102500.5 && r.trades[1].pin === 99800);
      csvT('Fila con precio no numérico → se informa con su número de línea',
        'entrada;salida\n100000;101000\nabc;101000\n100000;99000', r => r.trades.length === 2 && r.errors.length === 1 && r.errors[0].line === 3);
      csvT('Dirección desconocida → se informa',

      csvT('Encabezado sin columnas reconocibles → error claro',

      csvT('Retorno manual con prioridad sobre los precios',

      // ida y vuelta
      const trades = E.EXAMPLE_TRADES.concat([{ fecha: '2026-09-15', dir: 'SHORT', pin: null, pout: null, manual: -0.0123, nota: 'backtest; "prueba"' }]);
      const back = E.parseCSV(E.toCSV(trades));

      add('Persistencia', 'Exportar configuración JSON → importar → mismos resultados', ok, { checked: 4 });

    }

    const ms = Date.now() - t0;
    return { results: out, ms, total: out.length, passed: out.filter(x => x.pass).length, checks: out.reduce((s, x) => s + (x.checked || 1), 0) };
  }

  root.TestSuite = { runTests, closeNum };

    const shown = f.t === 'pct' ? v * 100 : v;
    let msg = '';

  function buildSaveBox(box) {
    const msg = h('div', null, takeFlash('cfg'));
    const persist = h('input', { type: 'checkbox', id: 'persist-chk' });
    persist.checked = App.persist;
    persist.addEventListener('change', () => { setPersist(persist.checked); msg.replaceChildren(h('div', { class: 'msg info' }, persist.checked ? 'Se guardará en este navegador.' : 'Borrado de este navegador; los cambios no se recordarán.')); });
    const area = h('textarea', { id: 'cfg-area', 'aria-label': 'Configuración en JSON', placeholder: 'Pulsa «Exportar» para ver aquí tu configuración, o pega una para importarla.' });
    const file = h('input', { type: 'file', id: 'cfg-file', accept: '.json,application/json' });
    file.addEventListener('change', () => { const f = file.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { area.value = rd.result; doImport(); }; rd.readAsText(f); });
    const doImport = () => {
      try {
        const o = E.deserialize(area.value);
        App.S = o.S; App.B = o.B; App.trades = o.trades; App.histPage = 0;
        flash('cfg', h('div', { class: 'msg ok' }, `Configuración importada: ${o.trades.length} operaciones en el historial.`));
        recalc(); syncInputs();
      } catch (e) { msg.replaceChildren(h('div', { class: 'msg err' }, 'No se pudo importar: ' + (e instanceof SyntaxError ? 'el texto no es un JSON válido.' : e.message))); }
    };
    box.append(
      h('label', { class: 'sec-t', style: 'font-weight:500' }, persist, 'Recordar parámetros, tarifas e historial en este navegador'),
      h('p', { class: 'sec-note' }, 'El guardado local es una comodidad: se borra si limpias los datos del navegador. Para una copia segura exporta la configuración y guárdala donde quieras.'),
      h('div', { class: 'btn-row' },
        h('button', { class: 'btn primary', type: 'button', text: 'Exportar configuración', on: { click: () => { area.value = E.serialize(App.S, App.B, App.trades); msg.replaceChildren(h('div', { class: 'msg ok' }, 'Configuración lista para copiar.')); } } }),

      h('div', { class: 'btn-row' }, confirmBtn('Restablecer todo', '¿Volver a los valores del Excel y a las operaciones de ejemplo?', () => {

        recalc(); syncInputs();

  }

  function rEscenarios(body) {
    const r = App.r, S = App.S;
    const hdrInputs = (pref) => S.escRR.map((v, j) => ({ h: editableNum(`${pref}-rr-${j}`, v, 2, x => { S.escRR[j] = x; }, { min: 0.01, max: 100, label: 'R:R columna ' + (j + 1) }), n: true }));

    const isCur = (i, j) => Math.abs(S.escWR[i] - r.WR) < 1e-9 && Math.abs(S.escRR[j] - r.RR) < 1e-9;
    const matrix = (id, title, aside, M, fmt, kind) => {
      const s = sec(id, title, aside);
      const flat = M.flat().filter(Number.isFinite);
      const maxAbs = Math.max(...flat.map(Math.abs), 1e-12);
      s.body.append(scaleLegend(kind), table([{ h: 'Win rate ↓ · R:R →' }].concat(hdrInputs(id)),
        M.map((row, i) => [wrIn(id, i, S.escWR[i])].concat(row.map((v, j) => {
          const extra = isCur(i, j) ? 'cur' : '';
          return kind === 'risk' ? risk(v, fmt(v), extra) : heat(v, fmt(v), maxAbs, extra);
        }))), { heat: true }));
      return s.el;
    };
    body.append(
      h('p', { class: 'note-box' }, 'Pérdida media ', h('b', null, F.pct2(r.Loss)), ' · costo ', h('b', null, F.pct3(r.CostPct)), ' · notional ', h('b', null, F.usd0(r.Notional) + ' USDT'), ' · ',

      }, 30);
    };
    s1.body.append(h('div', { class: 'btn-row' }, h('button', { class: 'btn primary', type: 'button', text: 'Ejecutar los tests otra vez', on: { click: run } }),
      h('span', { class: 'small muted' }, 'La misma suite que se ejecutó en Node antes de publicar la página.')), out);
    const s2 = sec('tst-met', 'Cómo se construyeron las pruebas');
    const nScen = G ? Object.keys(G.scenarios).length : 0;
    s2.body.append(h('div', { class: 'prose' },
      h('p', null, 'El objetivo es demostrar tres cosas: que la web calcula exactamente lo mismo que el Excel, que los cálculos son financieramente coherentes en cualquier combinación de entradas, y que la interfaz funciona en un navegador real.'),
      h('ol', null,
        h('li', null, h('b', null, 'Paridad con el Excel (valores dorados). '), `Recalculé el Excel v2 con LibreOffice en ${nScen} escenarios distintos (por defecto; SHORT con VIP 3, BNB y entrada maker; SPOT; historial de ejemplo con tamaño compuesto; comisiones manuales con EV positivo; SHORT a 50x con funding negativo, VIP 9 y otros costes; y un historial de 40 operaciones con retornos manuales). Exporté cada valor con nombre y cada tabla, y la web debe reproducirlos celda a celda con una tolerancia de 10⁻⁹ absoluta o relativa.`),
        h('li', null, h('b', null, 'Funciones estadísticas. '), 'NORMSDIST, NORMSINV, TDIST y TINV se implementaron desde cero (Hart/West, Acklam con refinamiento de Halley, beta incompleta con fracción continua) y se comparan con valores de referencia calculados con SciPy. También se verifica ROUND/ROUNDUP con la semántica de Excel y el formato numérico en español.'),
        h('li', null, h('b', null, 'Invariantes financieros (pruebas de propiedades). '), '300 escenarios aleatorios con semilla fija 42: el desglose suma el costo total, EV = notional·(p·ganancia neta − q·pérdida neta), con win rate de equilibrio el EV es cero, más win rate nunca reduce el EV, más costo nunca lo aumenta, el apalancamiento no cambia la probabilidad de pérdida, en el precio de liquidación el margen restante iguala al de mantenimiento, Kelly maximiza el crecimiento logarítmico y no aparece ningún NaN.'),
        h('li', null, h('b', null, 'Robustez. '), '14 entradas extremas (capital 0, precio 0, win rate 0% y 100%, 150x, costos enormes, nivel VIP inexistente…) sin errores ni NaN.'),
        h('li', null, h('b', null, 'Monte Carlo. '), 'Reproducibilidad por semilla, ruina absorbente, percentiles ordenados y contrastes estadísticos: frecuencia de aciertos ≈ win rate, media final ≈ capital + N·EV y mediana compuesta ≈ capital·exp(N·g), cada uno dentro de ±4 errores estándar.'),
        h('li', null, h('b', null, 'Carga CSV. '), '13 casos: separadores, coma decimal, BOM, comillas, retornos con y sin %, precios con miles, filas inválidas con número de línea y exportar → importar sin pérdidas.'),
        h('li', null, h('b', null, 'Persistencia. '), 'Exportar e importar la configuración JSON da resultados idénticos; un JSON ajeno se rechaza y uno parcial se completa con los valores por defecto.'),
        h('li', null, h('b', null, 'QA en navegador. '), 'Con Playwright y Chromium sin interfaz abrí la página, recorrí todas las pestañas, plegué y desplegué secciones, cambié entradas, importé un CSV y ejecuté esta misma suite dentro de la página, en móvil (390 px) y escritorio (1280 px), en tema claro y oscuro, vigilando errores de consola y desbordes horizontales. El registro está abajo.'))));
    const s3 = sec('tst-log', 'Registro de ejecuciones previas a la publicación');
    const NL = window.__NODE_LOG__, QA = window.__QA_LOG__;
    s3.body.append(
      NL ? h('div', null, h('h3', { style: 'font-size:15px' }, 'Node.js'), kv([
        ['Fecha', NL.fecha, 'txt'], ['Versión de Node', NL.node, 'txt'], ['Tests superados', `${NL.passed} / ${NL.total}`, 'txt'],
        ['Comprobaciones individuales', NL.checks, 'int'], ['Máxima diferencia relativa con el Excel', NL.maxDiffParidad, 'sci'], ['Duración', NL.ms + ' ms', 'txt']])) : h('p', { class: 'sec-note' }, 'Sin registro de Node.'),
      QA ? h('div', null, h('h3', { style: 'font-size:15px;margin-top:10px' }, 'Navegador (Playwright + Chromium)'),
        table([{ h: 'Comprobación', wrap: true }, { h: 'Resultado' }, { h: 'Detalle', wrap: true }], QA.checks.map(c => [c.name, h('span', { class: c.ok ? 'status-ok' : 'status-ko' }, c.ok ? '✔ correcto' : '✖ fallo'), c.detail || ''])),
        h('p', { class: 'sec-note' }, `Ejecutado el ${QA.fecha} con ${QA.browser}.`)) : h('p', { class: 'sec-note' }, 'Sin registro del navegador.'));
    const s4 = sec('tst-esc', 'Escenarios dorados', 'entradas que difieren de los valores por defecto');
    if (G) s4.body.append(table([{ h: 'Escenario' }, { h: 'Entradas', wrap: true }], Object.entries(G.scenarios).map(([k, v]) => [h('b', null, k),
      Object.keys(v.inputs).length ? Object.entries(v.inputs).map(([a, b]) => `${a.replace('v_', '')} = ${b}`).join(' · ') : 'Valores por defecto del Excel' + (k === 'S6_hist40' ? '' : '')])));
    body.append(s1.el, h('div', { class: 'cols c-2' }, s2.el, h('div', { class: 'stack' }, s3.el, s4.el)));
    if (App.test) renderTestResults(out, App.test); else run();
  }
  function renderTestResults(out, res) {
    const fails = res.results.filter(t => !t.pass);
    const cats = {};
    res.results.forEach(t => { const c = cats[t.cat] = cats[t.cat] || { n: 0, ok: 0, checks: 0 }; c.n++; c.checks += t.checked || 1; if (t.pass) c.ok++; });
    const par = res.results.filter(t => t.cat === 'Paridad con el Excel');
    const maxRel = par.length ? Math.max(...par.map(t => t.maxRel || 0)) : 0;
    const filter = h('select', { class: 'sel', id: 'tst-filter', style: 'width:auto' }, h('option', { value: 'all', text: 'Todas las pruebas' }), h('option', { value: 'fail', text: 'Solo fallos' }),
      Object.keys(cats).map(c => h('option', { value: c, text: c })));
    const list = h('div');
    const draw = () => {
      const v = filter.value;
      const rows = res.results.filter(t => v === 'all' ? true : v === 'fail' ? !t.pass : t.cat === v);
      list.replaceChildren(rows.length ? table([{ h: 'Estado' }, { h: 'Categoría' }, { h: 'Prueba', wrap: true }, { h: 'Comprob.', n: true }, { h: 'Máx. dif.', n: true }],
        rows.map(t => [h('span', { class: t.pass ? 'status-ok' : 'status-ko' }, t.pass ? '✔ OK' : '✖ Fallo'), t.cat,
          h('div', null, t.name, t.fails && t.fails.length ? h('details', { class: 'fails' }, h('summary', null, 'Ver detalle'), h('pre', null, t.fails.join('\n'))) : null),
          F.int(t.checked || 1), t.maxDiff ? F.sci(t.maxDiff) : '0'])) : h('p', { class: 'sec-note' }, 'No hay pruebas en este filtro.'));
    };
    filter.addEventListener('change', draw);
    out.replaceChildren(
      verdictBox(fails.length ? 'bad' : 'good', fails.length ? `${fails.length} pruebas fallaron de ${res.total}.` : `Las ${res.total} pruebas pasaron (${F.int(res.checks)} comprobaciones) en ${res.msBrowser} ms.`),
      tiles([['Pruebas superadas', `${res.passed} / ${res.total}`], ['Fallos', F.int(res.total - res.passed), null, res.total === res.passed ? 'pos' : 'neg'], ['Comprobaciones', F.int(res.checks)],
      ['Celdas comparadas con el Excel', F.int(par.reduce((s, t) => s + (t.checked || 0), 0))], ['Máx. diferencia relativa vs. Excel', F.sci(maxRel)], ['Duración en este navegador', res.msBrowser + ' ms']]),
      table([{ h: 'Categoría' }, { h: 'Pruebas', n: true }, { h: 'Superadas', n: true }, { h: 'Comprobaciones', n: true }], Object.entries(cats).map(([c, v]) => [c, F.int(v.n), { v: F.int(v.ok), cls: v.ok === v.n ? 'pos' : 'neg' }, F.int(v.checks)])),
      h('div', { class: 'btn-row' }, h('label', { for: 'tst-filter', class: 'small muted' }, 'Mostrar:'), filter), list);
    draw();
  }

  /* ---------- Arranque ---------- */
  function start() {
    load();
    buildShell();
    App.r = E.calc(App.S, App.B, App.trades);
    renderTop();
    const fromHash = (location.hash || '').replace('#', '');
    show(TABS.some(t => t[0] === fromHash) ? fromHash : App.tab);
    window.addEventListener('hashchange', () => { const id = location.hash.replace('#', ''); if (id !== App.tab && TABS.some(t => t[0] === id)) show(id); });
    window.__app = App;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
</body>
