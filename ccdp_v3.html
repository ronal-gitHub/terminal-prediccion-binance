<style>

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.45}

button,select,input,textarea{font-family:inherit;font-size:12px;color:var(--text);background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:5px 8px}

.next-main{text-align:center;padding:14px 8px}

<script>
"use strict";
/* ===========================================================================
   CCDP — Crypto Candle Direction Predictor
   SPA de una sola página, sin backend. Todo el estado vive en el navegador.
   REGLA MAESTRA: ningún número se muestra sin su procedencia
   (LIVE = API en vivo, REC = grabado por esta app, IMP = CSV importado,
    MAN = introducido a mano, N/A = no disponible). Nunca se mezclan.
   =========================================================================== */
</script>
<script>
/* ============================ 0. UTIL ==================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,a={},...c)=>{const n=document.createElement(t);for(const k in a){if(k==="class")n.className=a[k];else if(k==="html")n.innerHTML=a[k];else if(k.startsWith("on"))n.addEventListener(k.slice(2),a[k]);else if(a[k]!==null&&a[k]!==undefined)n.setAttribute(k,a[k]);}
  for(const x of c.flat()){if(x===null||x===undefined||x===false)continue;n.append(x.nodeType?x:document.createTextNode(x));}return n;};
const now=()=>Date.now();
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const fin=x=>typeof x==="number"&&isFinite(x);
const fmt=(x,d=2)=>fin(x)?x.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const pct=(x,d=3)=>fin(x)?(x*100).toFixed(d)+"%":"—";
const ts=t=>fin(t)?new Date(t).toISOString().replace("T"," ").slice(0,19):"—";
const hhmm=t=>fin(t)?new Date(t).toISOString().slice(11,19):"--:--:--";
const sum=a=>a.reduce((s,x)=>s+x,0);
const mean=a=>a.length?sum(a)/a.length:NaN;
const sd=a=>{if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(sum(a.map(x=>(x-m)**2))/(a.length-1));};
const last=a=>a.length?a[a.length-1]:undefined;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const bisect=(arr,t,get=x=>x.t)=>{// último índice con get(x) <= t  (-1 si ninguno)
  let lo=0,hi=arr.length-1,r=-1;while(lo<=hi){const m=(lo+hi)>>1;if(get(arr[m])<=t){r=m;lo=m+1;}else hi=m-1;}return r;};
function mulberry(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function toast(msg,ms=2600){const n=$("#toast");n.textContent=msg;n.hidden=false;clearTimeout(n._t);n._t=setTimeout(()=>n.hidden=true,ms);}
function dl(name,text,mime="text/plain"){const b=new Blob([text],{type:mime}),u=URL.createObjectURL(b);
  const a=el("a",{href:u,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}
function toCSV(rows,cols){if(!rows.length)return"";cols=cols||Object.keys(rows[0]);
  const esc=v=>{if(v===null||v===undefined)return"";const s=String(v);return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  return cols.join(",")+"\n"+rows.map(r=>cols.map(c=>esc(r[c])).join(",")).join("\n");}
const PROV={LIVE:{c:"p-live",t:"LIVE"},REC:{c:"p-rec",t:"REC"},IMP:{c:"p-imp",t:"IMPORT"},MAN:{c:"p-man",t:"MANUAL"},NA:{c:"p-na",t:"N/A"}};
const provTag=p=>el("span",{class:"prov "+(PROV[p]||PROV.NA).c},(PROV[p]||PROV.NA).t);

/* ============================ 1. CONFIG ================================== */
const DEFAULTS={
  assets:["BTCUSDT","ETHUSDT"], asset:"BTCUSDT", market:"futures",
  exchanges:{binance:true,bybit:true,okx:true,coinbase:false,kraken:false,deribit:false,bitget:false},
  horizons:[1,3,5,15,30,60],
  refreshMs:2000, bookPollMs:2000, bookDepthLimit:100,
  neutralMode:"atr", neutralBps:5, neutralK:0.35,
  weights:{orderbook:20,orderflow:20,price:15,derivatives:15,liquidations:10,volume:10,crossexch:10},
  confThresholds:{low:40,med:60},
  model:"M5", mlRounds:120, mlLR:0.08, mlL2:1e-3, mlBoostRounds:80, mlBins:16,
  wf:{folds:5,embargo:10,minTrain:400},
  recorder:{on:false,everyMs:5000,keep:200000},
  apiKeys:{}, disabledFeatures:{}, autoPredict:false,
  bt:{tf:"1m",from:"",to:"",confMin:0,useOnlyAvailable:true}
};
const CFG=(()=>{
  let c;try{c=JSON.parse(localStorage.getItem("ccdp.cfg")||"{}");}catch(e){c={};}
  const merge=(d,s)=>{const o=Array.isArray(d)?d.slice():{...d};for(const k in s){
    if(s[k]&&typeof s[k]==="object"&&!Array.isArray(s[k])&&d[k]&&typeof d[k]==="object")o[k]=merge(d[k],s[k]);else o[k]=s[k];}return o;};
  const cfg=merge(DEFAULTS,c);
  cfg.save=()=>{const {save,...rest}=cfg;localStorage.setItem("ccdp.cfg",JSON.stringify(rest));};
  return cfg;})();

/* ============================ 2. INDEXEDDB =============================== */
const DB=(()=>{
  const STORES=["klines","book","bookagg","trades","oi","funding","liq","levels","preds","runs","meta","nc"];
  let db=null;
  function open(){return new Promise((res,rej)=>{
    const r=indexedDB.open("ccdp",4);
    r.onupgradeneeded=e=>{const d=e.target.result;
      for(const s of STORES){ if(d.objectStoreNames.contains(s))continue;
        if(s==="preds"){const st=d.createObjectStore(s,{keyPath:"pid"});st.createIndex("t","t");st.createIndex("open","open");}
        else if(s==="runs"||s==="meta"){d.createObjectStore(s,{keyPath:"id"});}
        else if(s==="nc"){const st=d.createObjectStore(s,{keyPath:"id"});st.createIndex("t","t");}
        else{const st=d.createObjectStore(s,{keyPath:"rid",autoIncrement:true});st.createIndex("kt",["key","t"]);st.createIndex("key","key");}
      }};
    r.onsuccess=e=>{db=e.target.result;res(db);};r.onerror=e=>rej(e.target.error);});}
  const tx=(s,m="readonly")=>db.transaction(s,m).objectStore(s);
  function putMany(store,rows){return new Promise((res,rej)=>{
    if(!rows.length)return res(0);
    const t=db.transaction(store,"readwrite"),st=t.objectStore(store);
    for(const r of rows)st.put(r);
    t.oncomplete=()=>res(rows.length);t.onerror=e=>rej(e.target.error);});}
  function put(store,row){return putMany(store,[row]);}
  function range(store,key,t0=-Infinity,t1=Infinity,limit=Infinity){return new Promise((res,rej)=>{
    const out=[],st=tx(store),ix=st.index("kt");
    const kr=IDBKeyRange.bound([key,t0===-Infinity?-8640000000000:t0],[key,t1===Infinity?8640000000000:t1]);
    const rq=ix.openCursor(kr);
    rq.onsuccess=e=>{const c=e.target.result;if(!c||out.length>=limit)return res(out);out.push(c.value);c.continue();};
    rq.onerror=e=>rej(e.target.error);});}
  function all(store,limit=Infinity){return new Promise((res,rej)=>{const out=[],rq=tx(store).openCursor();
    rq.onsuccess=e=>{const c=e.target.result;if(!c||out.length>=limit)return res(out);out.push(c.value);c.continue();};rq.onerror=e=>rej(e.target.error);});}
  function get(store,k){return new Promise((res,rej)=>{const rq=tx(store).get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=e=>rej(e.target.error);});}
  function count(store,key){return new Promise((res,rej)=>{
    if(!key){const rq=tx(store).count();rq.onsuccess=()=>res(rq.result);rq.onerror=e=>rej(e.target.error);return;}
    const rq=tx(store).index("key").count(IDBKeyRange.only(key));rq.onsuccess=()=>res(rq.result);rq.onerror=e=>rej(e.target.error);});}
  function clear(store){return new Promise((res,rej)=>{const rq=db.transaction(store,"readwrite").objectStore(store).clear();rq.onsuccess=()=>res();rq.onerror=e=>rej(e.target.error);});}
  function keys(store){return new Promise((res,rej)=>{const out=new Map();
    const rq=tx(store).index("kt").openCursor();
    rq.onsuccess=e=>{const c=e.target.result;if(!c)return res([...out].map(([k,v])=>({key:k,...v})));
      const k=c.key[0],t=c.key[1];const o=out.get(k)||{n:0,t0:t,t1:t};o.n++;o.t1=t;if(t<o.t0)o.t0=t;out.set(k,o);c.continue();};
    rq.onerror=e=>rej(e.target.error);});}
  async function quota(){try{const e=await navigator.storage.estimate();return e;}catch(_){return null;}}
  return {open,put,putMany,range,all,get,count,clear,keys,quota,STORES};
})();

/* ============================ 3. RED / CORS ============================== */
const NET=(()=>{
  const buckets=new Map();
  function host(u){try{return new URL(u).host;}catch(e){return u;}}
  async function gate(u,perMin=900){const h=host(u);let b=buckets.get(h);
    if(!b){b={tk:perMin,ts:now(),cap:perMin};buckets.set(h,b);}
    const dt=(now()-b.ts)/60000;b.tk=Math.min(b.cap,b.tk+dt*b.cap);b.ts=now();
    if(b.tk<1){await sleep(Math.ceil((1-b.tk)/b.cap*60000));b.tk=1;}
    b.tk-=1;}
  async function json(url,{timeout=9000,headers={}}={}){
    await gate(url);
    const ac=new AbortController(),to=setTimeout(()=>ac.abort("timeout"),timeout);
    try{
      const r=await fetch(url,{signal:ac.signal,headers,mode:"cors",cache:"no-store"});
      if(!r.ok){const txt=await r.text().catch(()=>"" );throw new Error("HTTP "+r.status+" "+txt.slice(0,120));}
      return await r.json();
    }catch(e){
      const m=String(e&&e.message||e);
      if(/Failed to fetch|NetworkError|load failed/i.test(m))throw new Error("CORS/RED: el navegador bloqueó o no alcanzó "+host(url));
      throw e;
    }finally{clearTimeout(to);}}
  return {json,host};
})();

/* ==================== 4. REGISTRO DE FUENTES (matriz APIs) ===============
   Ningún estado se asume: todo arranca UNVERIFIED y se comprueba con "Probar
   fuentes" (requisito 23/33 del brief). No se inventan endpoints: los que no
   pude confirmar quedan marcados UNVERIFIED hasta que el probe los valide.  */
const SRC=(()=>{
  const S=(o)=>({status:"UNVERIFIED",ms:null,last:null,key:false,...o});
  const list=[
    S({id:"bi.spot.klines",ex:"Binance",mkt:"spot",data:"OHLCV",freq:"REST 1s",lim:"1200 w/min (peso)",url:s=>`https://api.binance.com/api/v3/klines?symbol=${s}&interval=1m&limit=5`,q:"alta"}),

<script>
/* =================== 5. INDICADORES CAUSALES (sin look-ahead) ============
   Todas las series se calculan en una pasada y sólo con información pasada:
   pre[i] únicamente depende de datos con índice <= i.                       */
const IND={
  ema(x,n){const k=2/(n+1),o=new Array(x.length).fill(NaN);let e=NaN;
    for(let i=0;i<x.length;i++){e=isFinite(e)?x[i]*k+e*(1-k):x[i];o[i]=i>=n-1?e:NaN;}return o;},
  sma(x,n){const o=new Array(x.length).fill(NaN);let s=0;
    for(let i=0;i<x.length;i++){s+=x[i];if(i>=n)s-=x[i-n];if(i>=n-1)o[i]=s/n;}return o;},
  std(x,n){const o=new Array(x.length).fill(NaN);let s=0,s2=0;
    for(let i=0;i<x.length;i++){s+=x[i];s2+=x[i]*x[i];if(i>=n){s-=x[i-n];s2-=x[i-n]*x[i-n];}
      if(i>=n-1){const m=s/n,v=Math.max(0,s2/n-m*m);o[i]=Math.sqrt(v);}}return o;},
  rsi(c,n=14){const o=new Array(c.length).fill(NaN);let ag=0,al=0;
    for(let i=1;i<c.length;i++){const d=c[i]-c[i-1],g=Math.max(0,d),l=Math.max(0,-d);
      if(i<=n){ag+=g/n;al+=l/n;if(i===n)o[i]=al===0?100:100-100/(1+ag/al);}
      else{ag=(ag*(n-1)+g)/n;al=(al*(n-1)+l)/n;o[i]=al===0?100:100-100/(1+ag/al);}}return o;},
  atr(h,l,c,n=14){const tr=new Array(c.length).fill(NaN);
    for(let i=0;i<c.length;i++){tr[i]=i===0?h[i]-l[i]:Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1]));}
    const o=new Array(c.length).fill(NaN);let a=NaN;
    for(let i=0;i<tr.length;i++){a=i===0?tr[0]:(isFinite(a)?(a*(n-1)+tr[i])/n:tr[i]);if(i>=n)o[i]=a;}return o;},
  rollVWAP(c,v,n){const o=new Array(c.length).fill(NaN);let pv=0,vv=0;
    for(let i=0;i<c.length;i++){pv+=c[i]*v[i];vv+=v[i];if(i>=n){pv-=c[i-n]*v[i-n];vv-=v[i-n];}if(i>=n-1&&vv>0)o[i]=pv/vv;}return o;},
  zscore(x,n){const m=IND.sma(x,n),s=IND.std(x,n),o=new Array(x.length).fill(NaN);
    for(let i=0;i<x.length;i++)o[i]=(fin(m[i])&&fin(s[i])&&s[i]>0)?(x[i]-m[i])/s[i]:NaN;return o;},
  diffN(x,n){const o=new Array(x.length).fill(NaN);for(let i=n;i<x.length;i++)o[i]=x[i]-x[i-n];return o;},
  logret(c,n){const o=new Array(c.length).fill(NaN);for(let i=n;i<c.length;i++)if(c[i-n]>0)o[i]=Math.log(c[i]/c[i-n]);return o;}
};

/* =================== 6. MOTOR DE ORDER BOOK ==============================
   Acepta dos representaciones:
   (a) L2 crudo  {bids:[[p,q]...],asks:[[p,q]...]}  -> live, REC o CSV L2
   (b) agregado por % de distancia {depth:{"0.01":{b,a},...}} -> CSV bookDepth
   Todo lo que no se puede medir fiablemente desde el navegador (velocidad de
   cancelación real) se calcula como PROXY y se marca como tal.             */
const OB={
  LEVELS:[0.0001,0.0005,0.001,0.0025,0.005,0.01],
  fromL2(bids,asks,t,prov){
    if(!bids||!asks||!bids.length||!asks.length)return null;
    const bb=+bids[0][0],ba=+asks[0][0],bq=+bids[0][1],aq=+asks[0][1];
    const mid=(bb+ba)/2, spread=ba-bb;
    const micro=(bb*aq+ba*bq)/(aq+bq);
    const d={},cum={b:0,a:0};
    for(const L of OB.LEVELS){
      let b=0,a=0;
      for(const [p,q] of bids){if((mid-+p)/mid<=L)b+=+p*+q;else break;}
      for(const [p,q] of asks){if((+p-mid)/mid<=L)a+=+p*+q;else break;}
      d[L]={b,a,obi:(b+a)>0?(b-a)/(b+a):NaN};
    }
    for(const [p,q] of bids)cum.b+=+p*+q; for(const [p,q] of asks)cum.a+=+p*+q;
    // concentración: cuánto del notional total está en el 10% superior de niveles
    const topN=Math.max(1,Math.round(bids.length*0.1));
    const cb=sum(bids.slice(0,topN).map(x=>+x[0]*+x[1]))/(cum.b||1);
    const ca=sum(asks.slice(0,topN).map(x=>+x[0]*+x[1]))/(cum.a||1);
    return {t,prov,bb,ba,bq,aq,mid,spread,spreadRel:spread/mid,micro,microDev:(micro-mid)/mid,
            d,cumB:cum.b,cumA:cum.a,concB:cb,concA:ca,nB:bids.length,nA:asks.length,
            obiAll:(cum.b+cum.a)>0?(cum.b-cum.a)/(cum.b+cum.a):NaN};
  },
  fromAgg(row){ // row: {t,mid,depth:{pctLevel:{b,a}} con acumulados}
    const d={};for(const L of OB.LEVELS){const x=row.depth&&row.depth[L];
      d[L]=x?{b:x.b,a:x.a,obi:(x.b+x.a)>0?(x.b-x.a)/(x.b+x.a):NaN}:{b:NaN,a:NaN,obi:NaN};}
    // el "libro completo" es el nivel más profundo realmente presente en el archivo,
    // no la lista fija de niveles: los volcados agregados suelen traer 1%..5%.
    const avail=Object.keys(row.depth||{}).map(Number).filter(fin).sort((a,b)=>a-b);
    const deep=avail.length?row.depth[avail[avail.length-1]]:null;
    const tb=deep?deep.b:NaN, ta=deep?deep.a:NaN;
    return {t:row.t,prov:row.prov||"IMP",mid:row.mid,d,cumB:tb,cumA:ta,levels:avail,
            obiAll:(tb+ta)>0?(tb-ta)/(tb+ta):NaN,spreadRel:row.spreadRel,microDev:NaN,concB:NaN,concA:NaN,agg:true};
  },
  /* Absorción (proxy): cae la profundidad del lado bid mientras el precio no
     baja -> compradores absorbiendo oferta. Requiere 2 snapshots seguidos.  */
  delta(prev,cur){
    if(!prev||!cur)return {dB:NaN,dA:NaN,absorb:NaN,rate:NaN};
    const dt=(cur.t-prev.t)/1000||1;
    const dB=(cur.cumB-prev.cumB)/(prev.cumB||1), dA=(cur.cumA-prev.cumA)/(prev.cumA||1);
    const dP=fin(cur.mid)&&fin(prev.mid)?(cur.mid-prev.mid)/prev.mid:NaN;
    let absorb=NaN;
    if(fin(dP)){ absorb = (dA<0&&dP>=0)? -dA : (dB<0&&dP<=0)? dB : 0; }
    return {dB,dA,absorb,rate:(Math.abs(dB)+Math.abs(dA))/dt};
  }
};

/* =================== 7. ORDER FLOW ======================================= */
const OF={
  /* agrega trades crudos en buckets; isBuyerMaker=true => venta agresiva */
  bucket(trades,fromT,toT){
    let bq=0,sq=0,n=0,big=0,bigB=0,bigS=0,qs=[];
    for(const tr of trades){if(tr.t<fromT||tr.t>toT)continue;
      const q=tr.q*(tr.p||1);qs.push(q);n++;
      if(tr.m)sq+=q;else bq+=q;}
    if(qs.length){const thr=qs.slice().sort((a,b)=>a-b)[Math.floor(qs.length*0.99)]||Infinity;
      for(const tr of trades){if(tr.t<fromT||tr.t>toT)continue;const q=tr.q*(tr.p||1);
        if(q>=thr){big+=q;if(tr.m)bigS+=q;else bigB+=q;}}}
    const tot=bq+sq;
    return {buy:bq,sell:sq,delta:bq-sq,ratio:tot>0?bq/tot:NaN,n,rate:n/Math.max(1,(toT-fromT)/1000),
            avg:n?tot/n:NaN,bigImb:big>0?(bigB-bigS)/big:NaN};
  }
};

/* =================== 8. DERIVADOS / LIQUIDACIONES ======================== */
const DV={
  regime(dP,dOI){ if(!fin(dP)||!fin(dOI))return NaN;
    // +1 tendencia con dinero nuevo alcista, -1 bajista con dinero nuevo,
    // 0.5/-0.5 cierres (short covering / long liquidation)
    if(dP>0&&dOI>0)return 1; if(dP<0&&dOI>0)return -1;
    if(dP>0&&dOI<0)return 0.5; if(dP<0&&dOI<0)return -0.5; return 0;},
  regimeName(r){return r===1?"Price UP + OI UP (nuevos largos)":r===-1?"Price DOWN + OI UP (nuevos cortos)":
    r===0.5?"Price UP + OI DOWN (short covering)":r===-0.5?"Price DOWN + OI DOWN (long unwind)":"—";}
};
const LQ={
  near(levels,price,side){ // nivel más cercano por encima (short) / debajo (long)
    let best=null;
    for(const L of levels){ if(!L.on)continue;
      if(side==="long"&&L.side!=="long")continue; if(side==="short"&&L.side!=="short")continue;
      const d=(L.price-price)/price;
      if(side==="long"&&d>=0)continue; if(side==="short"&&d<=0)continue;
      if(!best||Math.abs(d)<Math.abs(best.d))best={d,L};}
    return best;}
};

/* =================== 9. REGISTRO DE FEATURES ============================
   Cada feature declara: categoría, versión (reproducibilidad), qué datasets
   necesita y cómo se calcula. El motor de backtest desactiva automáticamente
   las que no tengan datos y lo reporta en el "tier" del experimento.       */
const FEATURES=[];
const F=(id,cat,needs,desc,fn,ver=1)=>FEATURES.push({id,cat,needs,desc,fn,ver});

/* --- precio / volumen (siempre disponibles con klines) --- */
F("ret_1","price",["klines"],"Retorno log 1 vela",(c)=>c.pre.r1[c.i]);
F("ret_3","price",["klines"],"Retorno log 3 velas",(c)=>c.pre.r3[c.i]);
F("ret_5","price",["klines"],"Retorno log 5 velas",(c)=>c.pre.r5[c.i]);
F("ret_15","price",["klines"],"Retorno log 15 velas",(c)=>c.pre.r15[c.i]);
F("ret_60","price",["klines"],"Retorno log 60 velas",(c)=>c.pre.r60[c.i]);
F("close_loc","price",["klines"],"Posición del cierre dentro del rango de la vela",(c)=>{
  const k=c.k[c.i],r=k.h-k.l;return r>0?(k.c-k.l)/r*2-1:0;});
F("range_rel","price",["klines"],"Rango de la vela / precio",(c)=>{const k=c.k[c.i];return (k.h-k.l)/k.c;});
F("atr_rel","price",["klines"],"ATR(14) relativo",(c)=>c.pre.atr[c.i]/c.k[c.i].c);
F("rv_30","price",["klines"],"Volatilidad realizada 30 velas",(c)=>c.pre.rv[c.i]);
F("rsi_14","price",["klines"],"RSI(14) centrado en 0",(c)=>fin(c.pre.rsi[c.i])?(c.pre.rsi[c.i]-50)/50:NaN);
F("ema_spread","price",["klines"],"(EMA9−EMA21)/precio",(c)=>(c.pre.e9[c.i]-c.pre.e21[c.i])/c.k[c.i].c);
F("vwap_dev","price",["klines"],"Desvío del VWAP(60)",(c)=>(c.k[c.i].c-c.pre.vwap[c.i])/c.pre.vwap[c.i]);
F("bb_pos","price",["klines"],"Posición en Bollinger(20,2)",(c)=>{const m=c.pre.sma20[c.i],s=c.pre.sd20[c.i];
  return s>0?clamp((c.k[c.i].c-m)/(2*s),-2,2):NaN;});
F("roc_10","price",["klines"],"Rate of change 10",(c)=>c.pre.roc10[c.i]);
F("vol_z","volume",["klines"],"Z-score del volumen (60)",(c)=>c.pre.volz[c.i]);
F("rel_vol","volume",["klines"],"Volumen / media 20",(c)=>c.k[c.i].v/c.pre.volma[c.i]);
F("vol_trend","volume",["klines"],"Pendiente del volumen 5 velas",(c)=>c.pre.voltr[c.i]);

/* --- order flow derivado de klines (taker buy volume viene en la vela) --- */
F("taker_ratio_k","orderflow",["klines"],"Taker buy / volumen de la vela",(c)=>{
  const k=c.k[c.i];return k.v>0&&fin(k.tb)?(2*k.tb/k.v-1):NaN;});
F("cvd_slope_k","orderflow",["klines"],"Pendiente del CVD (delta taker) 15 velas",(c)=>c.pre.cvds[c.i]);
F("cvd_div","orderflow",["klines"],"Divergencia CVD vs precio (15)",(c)=>{
  const a=c.pre.cvds[c.i],b=c.pre.r15[c.i];return fin(a)&&fin(b)?Math.sign(a)!==Math.sign(b)?-Math.abs(a):Math.abs(a):NaN;});

/* --- order book --- */
for(const L of OB.LEVELS){
  F("obi_"+(L*100).toFixed(2),"orderbook",["book"],`Order book imbalance a ±${(L*100).toFixed(2)}%`,
    (c)=>{const b=c.book();return b?b.d[L].obi:NaN;});
}
F("obi_all","orderbook",["book"],"OBI del libro completo capturado",(c)=>{const b=c.book();return b?b.obiAll:NaN;});
F("spread_rel","orderbook",["book"],"Spread relativo",(c)=>{const b=c.book();return b?b.spreadRel:NaN;});
F("micro_dev","orderbook",["book"],"Microprice − mid (relativo)",(c)=>{const b=c.book();return b?b.microDev:NaN;});
F("ob_conc","orderbook",["book"],"Concentración bid − ask (top 10% niveles)",(c)=>{const b=c.book();return b&&fin(b.concB)?b.concB-b.concA:NaN;});
F("ob_dB","orderbook",["book"],"Cambio de profundidad bid entre snapshots",(c)=>{const d=c.bookDelta();return d?d.dB:NaN;});
F("ob_dA","orderbook",["book"],"Cambio de profundidad ask entre snapshots",(c)=>{const d=c.bookDelta();return d?d.dA:NaN;});
F("ob_absorb","orderbook",["book"],"Absorción (proxy: profundidad cae sin que el precio ceda)",(c)=>{const d=c.bookDelta();return d?d.absorb:NaN;});
F("ob_churn","orderbook",["book"],"Velocidad de cambio del libro (proxy de altas+cancelaciones)",(c)=>{const d=c.bookDelta();return d?d.rate:NaN;});

/* --- order flow tick a tick (requiere trades importados o grabados) --- */
F("cvd_z","orderflow",["trades"],"Z-score del delta acumulado (tick)",(c)=>c.tr("cvdz"));
F("taker_ratio_t","orderflow",["trades"],"Ratio taker buy (tick)",(c)=>{const x=c.tr("ratio");return fin(x)?2*x-1:NaN;});

F("avg_trade","orderflow",["trades"],"Tamaño medio de trade (notional)",(c)=>c.tr("avg"));

/* --- derivados --- */
F("oi_chg_5","derivatives",["oi"],"Cambio relativo de Open Interest en los últimos 5 minutos",(c)=>c.dv("oi5"),2);

F("funding","derivatives",["funding"],"Funding rate vigente",(c)=>c.dv("funding"));
F("funding_z","derivatives",["funding"],"Z-score del funding",(c)=>c.dv("fundingz"));
F("basis","derivatives",["funding"],"Basis (mark−index)/index",(c)=>c.dv("basis"));
F("lsr","derivatives",["oi"],"Long/short accounts (centrado)",(c)=>c.dv("lsr"));
