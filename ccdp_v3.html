/* --- liquidaciones --- */
F("liq_imb","liquidations",["liq"],"Imbalance de liquidaciones recientes",(c)=>c.lq("imb"));
F("liq_intensity","liquidations",["liq"],"Notional liquidado / volumen de la vela",(c)=>c.lq("intensity"));
F("dist_long_liq","liquidations",["levels"],"Distancia al cluster de liquidación de largos",(c)=>c.lq("dLong"));
F("dist_short_liq","liquidations",["levels"],"Distancia al cluster de liquidación de cortos",(c)=>c.lq("dShort"));

/* --- cross exchange --- */
F("x_spread","crossexch",["xe"],"Spread entre exchanges (rel.)",(c)=>c.xe("spread"));
F("x_pressure","crossexch",["xe"],"Desviación de precio ponderada por volumen frente a la mediana del grupo",(c)=>c.xe("pressure"),2);
F("x_lead","crossexch",["xe"],"Exceso de movimiento del exchange líder sobre la mediana del grupo",(c)=>c.xe("lead"),2);

const FEAT_BY_ID=Object.fromEntries(FEATURES.map(f=>[f.id,f]));
const CATS=["orderbook","orderflow","price","derivatives","liquidations","volume","crossexch"];
const CAT_ES={orderbook:"Order book",orderflow:"Order flow",price:"Precio",derivatives:"Derivados",liquidations:"Liquidaciones",volume:"Volumen",crossexch:"Cross-exchange"};
</script>
<script>
/* =================== 10. DATASET + CONTEXTO ==============================
   Un Dataset es la unión de todas las series disponibles (LIVE/REC/IMP/MAN)
   para un símbolo y timeframe. buildCtx() precalcula todo de forma causal y
   deja un accesor por vela i que NUNCA mira más allá del cierre de esa vela. */
const TFMS={"1m":6e4,"3m":18e4,"5m":3e5,"15m":9e5,"30m":18e5,"1h":36e5};
function buildCtx(D){
  const k=D.k, n=k.length, c=k.map(x=>x.c), h=k.map(x=>x.h), l=k.map(x=>x.l), v=k.map(x=>x.v);
  const pre={
    r1:IND.logret(c,1),r3:IND.logret(c,3),r5:IND.logret(c,5),r15:IND.logret(c,15),r60:IND.logret(c,60),
    atr:IND.atr(h,l,c,14),rsi:IND.rsi(c,14),e9:IND.ema(c,9),e21:IND.ema(c,21),
    vwap:IND.rollVWAP(c,v,60),sma20:IND.sma(c,20),sd20:IND.std(c,20),
    volma:IND.sma(v,20),volz:IND.zscore(v,60),roc10:IND.logret(c,10)
  };
  pre.rv=(()=>{const r=IND.logret(c,1),s=IND.std(r.map(x=>fin(x)?x:0),30);return s;})();
  pre.voltr=(()=>{const o=new Array(n).fill(NaN);for(let i=5;i<n;i++){const a=mean(v.slice(i-4,i+1)),b=mean(v.slice(i-9<0?0:i-9,i-4));o[i]=b>0?a/b-1:NaN;}return o;})();
  // CVD a partir de taker buy volume de la vela (dato incluido en klines)
  const delta=k.map(x=>fin(x.tb)?(2*x.tb-x.v):NaN);
  pre.cvds=(()=>{const o=new Array(n).fill(NaN);let cum=0;const cums=[];
    for(let i=0;i<n;i++){cum+=fin(delta[i])?delta[i]:0;cums.push(cum);}
    const z=IND.zscore(cums,60);
    for(let i=15;i<n;i++){const d=cums[i]-cums[i-15],sc=IND.std(delta.map(x=>fin(x)?x:0),60)[i];o[i]=sc>0?d/(sc*Math.sqrt(15)):NaN;}
    pre.cvdz=z;return o;})();

  // --- alineación de series auxiliares (último dato con t <= cierre de vela)
  const ct=i=>k[i].ct;           // cierre de la vela i = instante de decisión
  const ib=new Int32Array(n).fill(-1), io=new Int32Array(n).fill(-1), ifd=new Int32Array(n).fill(-1), ix=new Int32Array(n).fill(-1);
  if(D.book&&D.book.length)for(let i=0;i<n;i++)ib[i]=bisect(D.book,ct(i));
  if(D.oi&&D.oi.length)for(let i=0;i<n;i++)io[i]=bisect(D.oi,ct(i));
  if(D.funding&&D.funding.length)for(let i=0;i<n;i++)ifd[i]=bisect(D.funding,ct(i));
  if(D.xe&&D.xe.length)for(let i=0;i<n;i++)ix[i]=bisect(D.xe,ct(i));

  // --- agregados por vela de trades y liquidaciones (sólo dentro de la vela)
  const ofBar=new Array(n).fill(null), lqBar=new Array(n).fill(null);
  if(D.trades&&D.trades.length){
    let p=0;for(let i=0;i<n;i++){const t0=k[i].t,t1=k[i].ct;const arr=[];
      while(p<D.trades.length&&D.trades[p].t<t0)p++;
      let q=p;while(q<D.trades.length&&D.trades[q].t<=t1){arr.push(D.trades[q]);q++;}
      ofBar[i]=arr.length?OF.bucket(arr,t0,t1):null;}
    const cv=[];let cum=0;for(let i=0;i<n;i++){cum+=ofBar[i]?ofBar[i].delta:0;cv.push(cum);}
    const z=IND.zscore(cv,60);for(let i=0;i<n;i++)if(ofBar[i])ofBar[i].cvdz=z[i];
  }
  if(D.liq&&D.liq.length){
    let p=0;for(let i=0;i<n;i++){const t0=k[i].t,t1=k[i].ct;let L=0,S=0;
      while(p<D.liq.length&&D.liq[p].t<t0)p++;
      let q=p;while(q<D.liq.length&&D.liq[q].t<=t1){const x=D.liq[q];const nt=x.qty*(x.price||1);
        if(x.side==="long")L+=nt;else S+=nt;q++;}
      lqBar[i]=(L+S)>0?{L,S,imb:(S-L)/(S+L),intensity:(L+S)/(k[i].v*k[i].c||1)}:{L:0,S:0,imb:0,intensity:0};}
  }
  /* FIX: el OI llega con espaciados distintos (histórico 5m + muestreo en vivo
     cada 30 s + CSV importado). Contar "5 muestras atrás" mezclaba escalas de
     tiempo distintas, así que el lookback es por TIEMPO y se descarta si la
     muestra más cercana está demasiado lejos del objetivo. */
  const oiChgMin=(idx,mins)=>{
    if(idx<0||!D.oi.length)return NaN;
    const cur=D.oi[idx], want=cur.t-mins*60000, j=bisect(D.oi,want);
    if(j<0)return NaN;
    const prev=D.oi[j];
    if(!fin(prev.oi)||prev.oi<=0||!fin(cur.oi))return NaN;
    if(Math.abs(prev.t-want)>mins*60000*0.5)return NaN;   // tolerancia 50%
    return cur.oi/prev.oi-1;};
  /* FIX: z-score del funding por ventana temporal (8 h) en vez de por número
     de muestras: la serie mezcla eventos de funding (cada 8 h) con lecturas
     del premium index (cada 30 s) y un z-score "de 30 filas" no significaba
     lo mismo en un tramo que en otro. */
  const fz=(()=>{if(!D.funding||!D.funding.length)return null;
    const W=8*3600000,out=new Array(D.funding.length).fill(NaN);
    for(let i=0;i<D.funding.length;i++){const t=D.funding[i].t,v=[];
      for(let j=i;j>=0&&D.funding[j].t>=t-W;j--)if(fin(D.funding[j].rate))v.push(D.funding[j].rate);
      if(v.length>=8){const m=mean(v),s2=sd(v);out[i]=fin(s2)&&s2>1e-12?(D.funding[i].rate-m)/s2:NaN;}}
    return out;})();

  const has={klines:n>0,book:!!(D.book&&D.book.length),trades:!!(D.trades&&D.trades.length),
             oi:!!(D.oi&&D.oi.length),funding:!!(D.funding&&D.funding.length),
             liq:!!(D.liq&&D.liq.length),levels:!!(D.levels&&D.levels.length),xe:!!(D.xe&&D.xe.length)};
  const ctx={D,k,pre,n,has,i:0,
    book(){return ib[this.i]>=0?D.book[ib[this.i]]:null;},
    bookDelta(){const j=ib[this.i];return j>0?OB.delta(D.book[j-1],D.book[j]):null;},
    tr(f){const b=ofBar[this.i];return b?(f==="cvdz"?b.cvdz:b[f]):NaN;},
    dv(f){const j=io[this.i],g=ifd[this.i];
      switch(f){case"oi5":return oiChgMin(j,5);case"oi15":return oiChgMin(j,15);
        case"lsr":return j>=0&&fin(D.oi[j].lsr)?Math.log(D.oi[j].lsr):NaN;
        case"tlsr":return j>=0&&fin(D.oi[j].tlsr)?Math.log(D.oi[j].tlsr):NaN;
        case"funding":return g>=0?D.funding[g].rate:NaN;
        case"fundingz":return g>=0&&fz?fz[g]:NaN;
        case"basis":return g>=0&&fin(D.funding[g].mark)&&fin(D.funding[g].index)&&D.funding[g].index>0?
          (D.funding[g].mark-D.funding[g].index)/D.funding[g].index:NaN;}
      return NaN;},
    lq(f){const b=lqBar[this.i];
      if(f==="imb")return b?b.imb:NaN; if(f==="intensity")return b?b.intensity:NaN;
      if(!D.levels||!D.levels.length)return NaN;
      const p=k[this.i].c,s=LQ.near(D.levels,p,f==="dLong"?"long":"short");return s?s.d:NaN;},
    xe(f){const j=ix[this.i];return j>=0?D.xe[j][f]:NaN;}
  };
  return ctx;
}
function activeFeatures(has){
  return FEATURES.filter(f=>!CFG.disabledFeatures[f.id]&&f.needs.every(nd=>has[nd]));
}
function featureVector(ctx,i,feats){
  ctx.i=i;const o={};for(const f of feats){let v;try{v=f.fn(ctx);}catch(e){v=NaN;}o[f.id]=fin(v)?v:NaN;}return o;}

/* =================== 11. ETIQUETAS Y MUESTRAS =========================== */
function neutralThreshold(ctx,i){
  if(CFG.neutralMode==="bps")return CFG.neutralBps/10000;
  const a=ctx.pre.atr[i]/ctx.k[i].c;return fin(a)?Math.max(1e-5,CFG.neutralK*a):CFG.neutralBps/10000;}
function labelAt(ctx,i,hBars){
  const k=ctx.k;if(i+hBars>=k.length)return null;
  const r=Math.log(k[i+hBars].c/k[i].c), thr=neutralThreshold(ctx,i);
  let mfe=-Infinity,mae=Infinity;
  for(let j=i+1;j<=i+hBars;j++){mfe=Math.max(mfe,k[j].h/k[i].c-1);mae=Math.min(mae,k[j].l/k[i].c-1);}
  return {ret:r,thr,y:r>thr?"UP":r<-thr?"DOWN":"NEUTRAL",mfe,mae,tEnd:k[i+hBars].ct,pEnd:k[i+hBars].c};}
function buildSamples(ctx,hBars,warmup=70){
  const feats=activeFeatures(ctx.has),out=[];
  for(let i=warmup;i<ctx.n-hBars;i++){
    const lab=labelAt(ctx,i,hBars);if(!lab)continue;
    out.push({i,t:ctx.k[i].ct,p:ctx.k[i].c,x:featureVector(ctx,i,feats),...lab});}
  return {samples:out,feats};}

/* =================== 12. ESTANDARIZACIÓN (sólo con train) =============== */
function fitScaler(samples,feats){
  const st={};for(const f of feats){const v=[];for(const s of samples){const x=s.x[f.id];if(fin(x))v.push(x);}
    const m=mean(v),d=sd(v);st[f.id]={m:fin(m)?m:0,s:fin(d)&&d>1e-12?d:1,cov:v.length/Math.max(1,samples.length)};}
  return st;}
const zx=(x,st,id)=>{const v=x[id];if(!fin(v))return 0;const s=st[id];return clamp((v-s.m)/s.s,-6,6);};

/* =================== 13. MODELOS ======================================== */
function softmax3(lu,ln,ld){const m=Math.max(lu,ln,ld),a=Math.exp(lu-m),b=Math.exp(ln-m),c=Math.exp(ld-m),s=a+b+c;
  return {UP:a/s,NEUTRAL:b/s,DOWN:c/s};}
function scoreToProb(score,conflict=0){
  const k=1.9, band=0.55+1.1*conflict;
  const p=softmax3(k*score,band-Math.abs(score)*0.9,-k*score);
  return p;}
const CAT_OF=id=>FEAT_BY_ID[id]?FEAT_BY_ID[id].cat:"price";
/* signo esperado de cada feature respecto a "sube" (sólo para modelos de
   score explicables; el ML aprende los signos por su cuenta) */
const SIGN={ret_1:1,ret_3:1,ret_5:1,ret_15:1,ret_60:1,close_loc:1,rsi_14:-.4,ema_spread:1,vwap_dev:.5,bb_pos:-.4,
  roc_10:1,taker_ratio_k:1,cvd_slope_k:1,cvd_div:.6,obi_all:1,micro_dev:1,ob_conc:.6,ob_dB:.5,ob_dA:-.5,ob_absorb:.8,
  cvd_z:1,taker_ratio_t:1,big_imb:1,oi_chg_5:0,oi_chg_15:0,oi_price_regime:1,funding:-.5,funding_z:-.5,basis:-.3,
  lsr:-.3,taker_ls:.6,liq_imb:.6,liq_intensity:0,dist_long_liq:.4,dist_short_liq:.4,x_pressure:1,x_lead:.6,
  vol_z:0,rel_vol:0,vol_trend:0,spread_rel:0,ob_churn:0,trade_rate:0,avg_trade:0,x_spread:0,rv_30:0,atr_rel:0,range_rel:0};
for(const L of OB.LEVELS)SIGN["obi_"+(L*100).toFixed(2)]=1;

function catScore(x,st,feats,cats){
  const contrib=[];let s=0,w=0;
  for(const f of feats){ if(cats&&!cats.includes(f.cat))continue;
    const sg=SIGN[f.id];if(!sg)continue;
    const z=zx(x,st,f.id)/3, c=sg*z; s+=c; w+=Math.abs(sg);
    if(fin(x[f.id]))contrib.push({id:f.id,c,v:x[f.id],cat:f.cat});}
  contrib.sort((a,b)=>Math.abs(b.c)-Math.abs(a.c));
  return {score:w>0?clamp(s/w*2.2,-1,1):0,contrib};}

const MODELS={
  M0:{name:"M0 · Aleatorio (baseline)",cats:[],fit:()=>({r:mulberry(12345)}),
    predict(x,st,feats,S){const u=S.r();const a=u,b=S.r(),c=S.r(),t=a+b+c;
      return {p:{UP:a/t,NEUTRAL:b/t,DOWN:c/t},contrib:[],score:0};}},
  M1:{name:"M1 · Momentum de precio",cats:["price"],fit:()=>({}),
    predict(x,st,feats){const r=catScore(x,st,feats,["price"]);return {p:scoreToProb(r.score),...r};}},
  M2:{name:"M2 · Order Book Imbalance",cats:["orderbook"],fit:()=>({}),
    predict(x,st,feats){const r=catScore(x,st,feats,["orderbook"]);return {p:scoreToProb(r.score),...r};}},
  M3:{name:"M3 · Order Flow",cats:["orderflow"],fit:()=>({}),
    predict(x,st,feats){const r=catScore(x,st,feats,["orderflow"]);return {p:scoreToProb(r.score),...r};}},
  M4:{name:"M4 · Derivados",cats:["derivatives","liquidations"],fit:()=>({}),
    predict(x,st,feats){const r=catScore(x,st,feats,["derivatives","liquidations"]);return {p:scoreToProb(r.score),...r};}},
  M5:{name:"M5 · Score combinado (pesos configurables)",cats:CATS,fit:()=>({}),
    predict(x,st,feats){
      const parts={},contrib=[];let tot=0,acc=0;
      for(const cat of CATS){const w=CFG.weights[cat]||0;if(!w)continue;
        const r=catScore(x,st,feats,[cat]);if(!r.contrib.length)continue;
        parts[cat]=r.score;acc+=w*r.score;tot+=w;contrib.push(...r.contrib.map(c=>({...c,c:c.c*w/100})));}
      const score=tot>0?clamp(acc/tot,-1,1):0;
      const vals=Object.values(parts);
      const agree=vals.length>1?1-sd(vals.map(v=>Math.sign(v)||0))/1.2:1;
      const conflict=clamp(1-agree,0,1);
      contrib.sort((a,b)=>Math.abs(b.c)-Math.abs(a.c));
      return {p:scoreToProb(score,conflict*0.6),score,contrib,parts,agree:clamp(agree,0,1)};}},
  M6:{name:"M6a · Regresión logística multinomial",cats:CATS,
    fit(train,st,feats){
      const K=3,ids=feats.map(f=>f.id),d=ids.length+1;
      const W=[new Float64Array(d),new Float64Array(d),new Float64Array(d)];
      const CL=["UP","NEUTRAL","DOWN"];const lr=CFG.mlLR,l2=CFG.mlL2;
      const idx=train.map((_,i)=>i);const rnd=mulberry(7);
      for(let ep=0;ep<CFG.mlRounds;ep++){
        for(let a=idx.length-1;a>0;a--){const b=Math.floor(rnd()*(a+1));[idx[a],idx[b]]=[idx[b],idx[a]];}
        for(const j of idx){const s=train[j];const xs=new Float64Array(d);xs[0]=1;
          for(let m=0;m<ids.length;m++)xs[m+1]=zx(s.x,st,ids[m]);
          const z=[0,0,0];for(let c2=0;c2<K;c2++){let acc=0;for(let m=0;m<d;m++)acc+=W[c2][m]*xs[m];z[c2]=acc;}
          const mx=Math.max(...z),ex=z.map(v=>Math.exp(v-mx)),sx=sum(ex),pp=ex.map(v=>v/sx);
          const yi=CL.indexOf(s.y);const eta=lr/(1+ep*0.02);
          for(let c2=0;c2<K;c2++){const g=pp[c2]-(c2===yi?1:0);
            for(let m=0;m<d;m++)W[c2][m]-=eta*(g*xs[m]+(m?l2*W[c2][m]:0));}}}
      return {W,ids};},
    predict(x,st,feats,S){const {W,ids}=S,d=ids.length+1,xs=new Float64Array(d);xs[0]=1;
      for(let m=0;m<ids.length;m++)xs[m+1]=zx(x,st,ids[m]);
      const z=[0,0,0];for(let c2=0;c2<3;c2++){let a=0;for(let m=0;m<d;m++)a+=W[c2][m]*xs[m];z[c2]=a;}
      const p=softmax3(z[0],z[1],z[2]);
      const contrib=ids.map((id,m)=>({id,c:(W[0][m+1]-W[2][m+1])*xs[m+1],v:x[id],cat:CAT_OF(id)}))
        .filter(o=>fin(o.c)).sort((a,b)=>Math.abs(b.c)-Math.abs(a.c));
      return {p,contrib,score:clamp((p.UP-p.DOWN),-1,1)};}},
  M7:{name:"M6b · Gradient boosting (stumps, one-vs-rest)",cats:CATS,
    fit(train,st,feats){
      const ids=feats.map(f=>f.id),CL=["UP","NEUTRAL","DOWN"],B=CFG.mlBins;
      const X=train.map(s=>ids.map(id=>zx(s.x,st,id)));
      const edges=ids.map((_,m)=>{const col=X.map(r=>r[m]).sort((a,b)=>a-b);
        const e=[];for(let q=1;q<B;q++)e.push(col[Math.floor(col.length*q/B)]);return [...new Set(e)];});
      const ens=[];
      for(let c2=0;c2<3;c2++){
        const y=train.map(s=>s.y===CL[c2]?1:0), base=Math.log((mean(y)+1e-6)/(1-mean(y)+1e-6));
        const Fv=new Float64Array(train.length).fill(base),trees=[];
        for(let r=0;r<CFG.mlBoostRounds;r++){
          const g=new Float64Array(train.length);
          for(let j=0;j<train.length;j++){const p=1/(1+Math.exp(-Fv[j]));g[j]=y[j]-p;}
          let best=null;
          for(let m=0;m<ids.length;m++){for(const th of edges[m]){
            let sl=0,nl=0,sr=0,nr=0;
            for(let j=0;j<train.length;j++){if(X[j][m]<=th){sl+=g[j];nl++;}else{sr+=g[j];nr++;}}
            if(nl<20||nr<20)continue;
            const gain=sl*sl/nl+sr*sr/nr;
            if(!best||gain>best.gain)best={gain,m,th,vl:sl/nl,vr:sr/nr};}}
          if(!best)break;
          const lr=0.15;trees.push({m:best.m,th:best.th,vl:best.vl*lr*2,vr:best.vr*lr*2});
          for(let j=0;j<train.length;j++)Fv[j]+=X[j][best.m]<=best.th?trees[trees.length-1].vl:trees[trees.length-1].vr;}
        ens.push({base,trees});}
      return {ens,ids};},
    predict(x,st,feats,S){const {ens,ids}=S;const xs=ids.map(id=>zx(x,st,id));
      const z=ens.map(e=>{let f=e.base;for(const t of e.trees)f+=xs[t.m]<=t.th?t.vl:t.vr;return f;});
      const p=softmax3(z[0],z[1],z[2]);
      const imp={};for(let c2=0;c2<3;c2++)for(const t of ens[c2].trees){const s=(c2===0?1:c2===2?-1:0)*Math.abs(t.vr-t.vl);
        imp[ids[t.m]]=(imp[ids[t.m]]||0)+s;}
      const contrib=Object.entries(imp).map(([id,c])=>({id,c,v:x[id],cat:CAT_OF(id)})).sort((a,b)=>Math.abs(b.c)-Math.abs(a.c));
      return {p,contrib,score:clamp(p.UP-p.DOWN,-1,1)};}}
};
const MODEL_IDS=["M0","M1","M2","M3","M4","M5","M6","M7"];
function confidenceOf(pred){
  const p=pred.p,top=Math.max(p.UP,p.DOWN,p.NEUTRAL);
  const ent=-(["UP","DOWN","NEUTRAL"].reduce((s,c)=>s+(p[c]>0?p[c]*Math.log(p[c]):0),0))/Math.log(3);
  const base=(top-1/3)/(2/3);
  const agree=fin(pred.agree)?pred.agree:1;
  return clamp(Math.round(100*(0.65*base+0.2*(1-ent)+0.15*agree)),0,100);}
function dirOf(p){return p.UP>=p.DOWN&&p.UP>=p.NEUTRAL?"UP":p.DOWN>=p.NEUTRAL?"DOWN":"NEUTRAL";}
</script>
<script>
/* =================== 14. ESTADÍSTICA ==================================== */
const ST={
  wilson(k,n,z=1.96){if(!n)return [NaN,NaN];const p=k/n,d=1+z*z/n,c=p+z*z/(2*n),m=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n));
    return [(c-m)/d,(c+m)/d];},
  erf(x){const s=x<0?-1:1;x=Math.abs(x);const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911;
    const t=1/(1+p*x),y=1-((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);return s*y;},
  normP(z){return 1-0.5*(1+ST.erf(Math.abs(z)/Math.SQRT2));}, // p a una cola
  binomP(k,n,p0){ // aproximación normal con corrección de continuidad (2 colas)
    if(!n)return NaN;const mu=n*p0,s=Math.sqrt(n*p0*(1-p0));if(s<=0)return NaN;
    const z=(Math.abs(k-mu)-0.5)/s;return 2*ST.normP(z);},
  mcnemar(a,b){ // a,b = arrays booleanos de aciertos emparejados
    let n01=0,n10=0;for(let i=0;i<a.length;i++){if(a[i]&&!b[i])n10++;else if(!a[i]&&b[i])n01++;}
    const n=n01+n10;if(n<5)return {n01,n10,p:NaN,note:"muestra discordante <5"};
    const chi=(Math.abs(n10-n01)-1)**2/n;const p=2*ST.normP(Math.sqrt(chi));
    return {n01,n10,chi,p};},
  bootstrapDiff(a,b,iters=800,seed=99){ // IC 95% de la diferencia de accuracy
    const r=mulberry(seed),n=a.length,d=[];
    for(let it=0;it<iters;it++){let sa=0,sb=0;for(let i=0;i<n;i++){const j=Math.floor(r()*n);sa+=a[j]?1:0;sb+=b[j]?1:0;}d.push((sa-sb)/n);}
    d.sort((x,y)=>x-y);return [d[Math.floor(iters*.025)],d[Math.floor(iters*.975)]];},
  metrics(rows){
    const CL=["UP","NEUTRAL","DOWN"],cm={};for(const a of CL){cm[a]={};for(const b of CL)cm[a][b]=0;}
    let ok=0,brier=0,ll=0,dirN=0,dirOK=0,ret=0,mfe=0,mae=0,cov=0;
    for(const r of rows){cm[r.y][r.yhat]++;if(r.y===r.yhat)ok++;
      for(const c of CL){const y=(r.y===c)?1:0;brier+=(r.p[c]-y)**2;}
      ll+=-Math.log(Math.max(1e-9,r.p[r.y]));
      if(r.yhat!=="NEUTRAL"){cov++;const sg=r.yhat==="UP"?1:-1;ret+=sg*r.ret;
        mfe+=sg>0?r.mfe:-r.mae; mae+=sg>0?r.mae:-r.mfe;
        if(r.y!=="NEUTRAL"){dirN++;if(r.y===r.yhat)dirOK++;}}}
    const n=rows.length||1,per={};
    for(const c of CL){const tp=cm[c][c];let fp=0,fn=0;
      for(const o of CL){if(o!==c){fp+=cm[o][c];fn+=cm[c][o];}}
      const P=tp+fp?tp/(tp+fp):NaN,R=tp+fn?tp/(tp+fn):NaN;
      per[c]={P,R,F1:fin(P)&&fin(R)&&P+R>0?2*P*R/(P+R):NaN,n:tp+fn};}
    const [lo,hi]=ST.wilson(ok,rows.length);
    return {n:rows.length,acc:ok/n,ok,ci:[lo,hi],brier:brier/n,logloss:ll/n,cm,per,
      dirAcc:dirN?dirOK/dirN:NaN,dirN,coverage:cov/n,
      avgRet:cov?ret/cov:NaN,avgMFE:cov?mfe/cov:NaN,avgMAE:cov?mae/cov:NaN,
      hit:rows.map(r=>r.y===r.yhat)};},
  calibration(rows,bins=10){
    const B=Array.from({length:bins},()=>({n:0,ok:0,sp:0}));
    for(const r of rows){const p=r.p[r.yhat];const b=clamp(Math.floor((p-1/3)/(2/3)*bins),0,bins-1);
      B[b].n++;B[b].sp+=p;if(r.y===r.yhat)B[b].ok++;}
    return B.map((b,i)=>({bin:i,n:b.n,pMean:b.n?b.sp/b.n:NaN,obs:b.n?b.ok/b.n:NaN}));}
};

/* =================== 15. BASELINES OBLIGATORIOS ========================= */
const BASELINES={
  random:{name:"Aleatorio 50/50",fn:(s,ctx,r)=>r()<0.5?"UP":"DOWN"},
  alwaysUp:{name:"Siempre UP",fn:()=>"UP"},
  alwaysDown:{name:"Siempre DOWN",fn:()=>"DOWN"},
  prevCandle:{name:"Dirección de la vela previa",fn:(s,ctx)=>{const i=s.i;const d=ctx.k[i].c-ctx.k[i-1].c;return d>0?"UP":d<0?"DOWN":"NEUTRAL";}},
  momentum:{name:"Momentum simple (ret 5)",fn:(s)=>{const r=s.x.ret_5;return !fin(r)?"NEUTRAL":r>0?"UP":"DOWN";}}
};

/* =================== 16. BACKTEST WALK-FORWARD =========================
   Anti look-ahead por construcción:
   · las features de la muestra i sólo usan datos con t <= cierre de vela i;
   · el escalador y el modelo se ajustan SÓLO con el tramo de entrenamiento;
   · entre train y test hay purga (h velas) + embargo configurable;
   · el test nunca se reutiliza para ajustar nada.                         */
async function runBacktest(opts,onProgress){
  const {ctx,hBars,modelId,confMin=0}=opts;
  const {samples,feats}=buildSamples(ctx,hBars);
  if(samples.length<80)throw new Error("Muestras insuficientes ("+samples.length+"). Importa o graba más historia.");
  const folds=Math.max(2,CFG.wf.folds), emb=CFG.wf.embargo+hBars;
  const minTrain=Math.max(60,Math.min(CFG.wf.minTrain,Math.floor(samples.length*0.4)));
  const testLen=Math.floor((samples.length-minTrain)/folds);
  if(testLen<20)throw new Error("Tramo de test demasiado corto: reduce folds o aporta más datos.");
  const M=MODELS[modelId], rows=[], bl={}; for(const b in BASELINES)bl[b]=[];
  const rnd=mulberry(2024);
  const foldInfo=[];
  for(let f=0;f<folds;f++){
    const trainEnd=minTrain+f*testLen-emb, testFrom=minTrain+f*testLen, testTo=Math.min(samples.length,testFrom+testLen);
    if(trainEnd<40)continue;
    const train=samples.slice(0,trainEnd), test=samples.slice(testFrom,testTo);
    const scaler=fitScaler(train,feats);
    const state=M.fit?M.fit(train,scaler,feats):{};
    for(const s of test){
      const pr=M.predict(s.x,scaler,feats,state);
      const yhat=dirOf(pr.p), conf=confidenceOf(pr);
      if(conf<confMin)continue;
      rows.push({t:s.t,i:s.i,p:pr.p,yhat,y:s.y,ret:s.ret,mfe:s.mfe,mae:s.mae,conf,price:s.p,thr:s.thr,
        top:pr.contrib?pr.contrib.slice(0,6):[]});
      for(const b in BASELINES)bl[b].push({y:s.y,yhat:BASELINES[b].fn(s,ctx,rnd),p:{UP:1/3,NEUTRAL:1/3,DOWN:1/3},ret:s.ret,mfe:s.mfe,mae:s.mae});
    }
    foldInfo.push({fold:f+1,train:trainEnd,test:test.length,from:ts(samples[testFrom].t),to:ts(samples[testTo-1].t)});
    onProgress&&onProgress((f+1)/folds);
    await sleep(0); // cede el hilo: la UI no se congela
  }
  if(!rows.length)throw new Error("Ninguna predicción superó el umbral de confianza.");
  const m=ST.metrics(rows), blm={};
  for(const b in BASELINES){const mm=ST.metrics(bl[b]);
    mm.mcnemar=ST.mcnemar(m.hit,mm.hit); mm.ciDiff=ST.bootstrapDiff(m.hit,mm.hit);
    blm[b]={name:BASELINES[b].name,...mm};}
  const tier=dataTier(ctx.has,feats);
  return {rows,metrics:m,baselines:blm,folds:foldInfo,feats:feats.map(f=>f.id),tier,
    calib:ST.calibration(rows),modelId,hBars,samples:samples.length,
    cfgSnapshot:JSON.parse(JSON.stringify({weights:CFG.weights,neutral:{mode:CFG.neutralMode,bps:CFG.neutralBps,k:CFG.neutralK},wf:CFG.wf,ml:{r:CFG.mlRounds,lr:CFG.mlLR,l2:CFG.mlL2,b:CFG.mlBoostRounds}}))};
}
function dataTier(has,feats){
  const cats=new Set(feats.map(f=>f.cat));
  if(has.book&&(has.trades||cats.has("orderflow"))&&has.oi)return {tier:3,label:"TIER 3 · microestructura + derivados",
    note:"El backtest incluye order book. Sólo es válido si el libro proviene de snapshots reales alineados en el tiempo (IMPORT/REC), no reconstruidos."};
  if(has.oi||has.funding)return {tier:2,label:"TIER 2 · precio + derivados",note:"Sin order book histórico: las features de libro quedan fuera del experimento."};
  return {tier:1,label:"TIER 1 · sólo precio/volumen",note:"Únicamente klines. Es el suelo del experimento: si un modelo no bate al baseline aquí, no lo hará añadiendo ruido."};
}

/* =================== 17. TESTS DE FUGA (leakage) ======================== */
function runLeakTests(ctx){
  const out=[],n=ctx.n;
  if(n<120){out.push({name:"Datos suficientes para testear",pass:false,detail:"Se necesitan ≥120 velas"});return out;}
  const i=Math.floor(n*0.6), feats=activeFeatures(ctx.has);
  const before=featureVector(ctx,i,feats);
  const bak=ctx.k.slice(i+1).map(x=>({...x}));
  for(let j=i+1;j<n;j++){ctx.k[j].c*=1.07;ctx.k[j].h*=1.07;ctx.k[j].l*=1.07;ctx.k[j].v*=3;}
  const ctx2=buildCtx(ctx.D);
  const after=featureVector(ctx2,i,feats);
  for(let j=i+1;j<n;j++)ctx.k[j]=bak[j-i-1];
  const diffs=feats.filter(f=>{const a=before[f.id],b=after[f.id];
    if(!fin(a)&&!fin(b))return false;return !(fin(a)&&fin(b)&&Math.abs(a-b)<1e-9);}).map(f=>f.id);
  out.push({name:"Features inmunes a datos futuros",pass:diffs.length===0,
    detail:diffs.length?("Contaminadas: "+diffs.join(", ")):"Alterar todas las velas posteriores a i no cambió ninguna feature en i"});
  const lab=labelAt(ctx,i,5);
  out.push({name:"La etiqueta usa exactamente el horizonte pedido",pass:!!lab&&lab.tEnd===ctx.k[i+5].ct,
    detail:lab?("t_pred="+ts(ctx.k[i].ct)+" → t_label="+ts(lab.tEnd)):"—"});
  const {samples}=buildSamples(ctx,5);
  const sc=fitScaler(samples.slice(0,50),feats);
  const bad=Object.keys(sc).filter(k2=>!fin(sc[k2].m)||!fin(sc[k2].s));
  out.push({name:"Escalador ajustado sólo con el tramo de entrenamiento",pass:bad.length===0,
    detail:"fitScaler recibe exclusivamente samples[0..trainEnd); parámetros válidos: "+(Object.keys(sc).length-bad.length)+"/"+Object.keys(sc).length});
  const mono=ctx.k.every((x,j)=>j===0||x.t>ctx.k[j-1].t);
  out.push({name:"Serie temporal estrictamente creciente y sin duplicados",pass:mono,detail:mono?"OK":"Hay velas desordenadas o repetidas"});
  return out;
}
</script>
<script>
/* =================== 18. IMPORTACIÓN CSV ===============================
   Pensado para trabajar con volcados históricos que NO se pueden pedir desde
   el navegador (order book histórico, liquidaciones, métricas de OI...).
   El importador detecta el esquema, propone el mapeo de columnas y deja que
   lo corrijas a mano: así funciona tanto con los CSV públicos de Binance
   (data.binance.vision) como con exports propios de Parquet/DuckDB.        */
const CSV={
  sniffDelim(head){const cands=[",",";","\t","|"];let best=",",bn=0;
    for(const d of cands){const n=head.split(d).length;if(n>bn){bn=n;best=d;}}return best;},
  parse(text,{delim=null,maxRows=Infinity}={}){
    text=text.replace(/^\uFEFF/,"");
    const nl=text.indexOf("\n");const d=delim||CSV.sniffDelim(text.slice(0,nl>0?nl:200));
    const rows=[];let i=0,field="",row=[],q=false;
    while(i<text.length){const ch=text[i];
      if(q){ if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; } else field+=ch; }
      else if(ch==='"')q=true;
      else if(ch===d){row.push(field);field="";}
      else if(ch==="\n"){row.push(field);field="";if(row.length>1||row[0]!=="")rows.push(row);row=[];if(rows.length>=maxRows)break;}
      else if(ch!=="\r")field+=ch;
      i++;}
    if(field.length||row.length){row.push(field);rows.push(row);}
    let header=null;
    if(rows.length){const first=rows[0];const numeric=first.filter(x=>x!==""&&isFinite(+x)).length;
      if(numeric<first.length*0.5)header=rows.shift().map(x=>x.trim());}
    if(!header&&rows.length)header=rows[0].map((_,j)=>"col"+j);
    return {header,rows,delim:d};},
  toTs(v){ if(v===""||v===null||v===undefined)return NaN;
    const s=String(v).trim();
    if(/^\d+$/.test(s)){const n=+s;
      if(n>1e17)return Math.round(n/1e6);   // ns
      if(n>1e14)return Math.round(n/1e3);   // µs
      if(n>1e11)return n;                   // ms
      if(n>1e8)return n*1000;               // s
      return n;}
    const p=Date.parse(s.includes(" ")&&!s.includes("T")?s.replace(" ","T")+(/[zZ+]/.test(s)?"":"Z"):s);
    return isFinite(p)?p:NaN;},
  /* esquemas conocidos: firma de cabecera -> tipo interno */
  detect(header){
    const h=header.map(x=>x.toLowerCase().trim());
    const has=(...c)=>c.every(x=>h.some(y=>y===x||y.includes(x)));
    if(has("open_time","open","high","low","close"))return "klines";
    if(has("open time")||((has("open","high","low","close"))&&h.some(x=>x.includes("time"))))return "klines";
    if(has("agg_trade_id")||has("is_buyer_maker")||(has("price","quantity")&&h.some(x=>x.includes("transact"))))return "trades";
    if(has("percentage","depth")&&h.some(x=>x.includes("notional")))return "bookdepth";
    if(has("best_bid_price")||has("best_ask_price"))return "bookticker";
    if(has("sum_open_interest")||has("open_interest"))return "oi";
    if(has("funding")&&h.some(x=>x.includes("rate")))return "funding";
    if(has("original_quantity")&&has("side"))return "liq";
    if(has("side","price")&&(has("qty")||has("quantity")||has("size")))return h.some(x=>x.includes("level"))?"bookl2":"liq";
    if(has("bids")&&has("asks"))return "bookjson";
    return "custom";},
  FIELDS:{
    klines:["t","o","h","l","c","v","tb","ct"],
    bookl2:["t","side","price","qty"],
    bookjson:["t","bids","asks"],
    bookdepth:["t","percentage","depth","notional","mid"],
    bookticker:["t","bidPrice","bidQty","askPrice","askQty"],
    trades:["t","price","qty","isBuyerMaker"],
    oi:["t","oi","lsr","tlsr"],
    funding:["t","rate","mark","index"],
    liq:["t","side","qty","price"]
  },
  LABEL:{t:"timestamp",o:"open",h:"high",l:"low",c:"close",v:"volumen",tb:"taker buy vol (opcional)",ct:"close time (opcional)",
    side:"lado (bid/ask o long/short)",price:"precio",qty:"cantidad",percentage:"% desde mid",depth:"profundidad",notional:"notional",
    mid:"mid (opcional)",bidPrice:"best bid",bidQty:"qty bid",askPrice:"best ask",askQty:"qty ask",
    isBuyerMaker:"is_buyer_maker",oi:"open interest",lsr:"long/short ratio (opcional)",tlsr:"taker l/s (opcional)",
    rate:"funding rate",mark:"mark price (opcional)",index:"index price (opcional)",bids:"bids JSON",asks:"asks JSON"},
  guess(field,header){
    const h=header.map(x=>x.toLowerCase());
    const pats={t:["open_time","timestamp","transact_time","create_time","time","ts","date"],ct:["close_time"],
      o:["open"],h:["high"],l:["low"],c:["close"],v:["volume","vol"],tb:["taker_buy_volume","taker_buy_base","taker_buy"],
      side:["side"],price:["price","average_price","px"],qty:["quantity","qty","size","original_quantity","amount"],
      percentage:["percentage","pct","level_pct"],depth:["depth"],notional:["notional"],mid:["mid","mid_price"],
      bidPrice:["best_bid_price","bid_price","bid"],bidQty:["best_bid_qty","bid_qty"],askPrice:["best_ask_price","ask_price","ask"],askQty:["best_ask_qty","ask_qty"],
      isBuyerMaker:["is_buyer_maker","buyer_maker","maker"],oi:["sum_open_interest","open_interest","oi"],
      lsr:["count_long_short_ratio","long_short_ratio","lsr"],tlsr:["sum_taker_long_short_vol_ratio","taker_long_short"],
      rate:["funding_rate","fundingrate","rate"],mark:["mark_price","mark"],index:["index_price","index"],
      bids:["bids"],asks:["asks"]};
    for(const p of (pats[field]||[])){const j=h.findIndex(x=>x===p);if(j>=0)return j;}
    for(const p of (pats[field]||[])){const j=h.findIndex(x=>x.includes(p));if(j>=0)return j;}
    return -1;}
};
function transformImport(type,header,rows,map,sym,opt={}){
  const g=(r,f)=>{const j=map[f];return j===undefined||j<0?undefined:r[j];};
  const num=x=>{const v=+String(x).replace(/[, ]/g,"");return isFinite(v)?v:NaN;};
  const key=(ds)=>`${sym}|${ds}|IMP`;
  if(type==="klines"){const tf=opt.tf||"1m",ms=TFMS[tf]||6e4;
    return {store:"klines",key:`${sym}|${tf}|IMP`,rows:rows.map(r=>{const t=CSV.toTs(g(r,"t"));
      return {key:`${sym}|${tf}|IMP`,t,o:num(g(r,"o")),h:num(g(r,"h")),l:num(g(r,"l")),c:num(g(r,"c")),
        v:num(g(r,"v")),tb:num(g(r,"tb")),ct:g(r,"ct")!==undefined?CSV.toTs(g(r,"ct")):t+ms-1,prov:"IMP"};}).filter(x=>fin(x.t)&&fin(x.c))};}
  if(type==="trades"){return {store:"trades",key:key("trades"),rows:rows.map(r=>({key:key("trades"),t:CSV.toTs(g(r,"t")),
      p:num(g(r,"price")),q:num(g(r,"qty")),m:/^(true|1|y)$/i.test(String(g(r,"isBuyerMaker"))),prov:"IMP"})).filter(x=>fin(x.t)&&fin(x.q))};}
  if(type==="oi"){return {store:"oi",key:key("oi"),rows:rows.map(r=>({key:key("oi"),t:CSV.toTs(g(r,"t")),
      oi:num(g(r,"oi")),lsr:num(g(r,"lsr")),tlsr:num(g(r,"tlsr")),prov:"IMP"})).filter(x=>fin(x.t)&&fin(x.oi))};}
  if(type==="funding"){return {store:"funding",key:key("funding"),rows:rows.map(r=>({key:key("funding"),t:CSV.toTs(g(r,"t")),
      rate:num(g(r,"rate")),mark:num(g(r,"mark")),index:num(g(r,"index")),prov:"IMP"})).filter(x=>fin(x.t)&&fin(x.rate))};}
  if(type==="liq"){return {store:"liq",key:key("liq"),rows:rows.map(r=>{const s=String(g(r,"side")||"").toUpperCase();
      // en Binance el 'side' del snapshot es el lado de la ORDEN de liquidación:
      // SELL liquida largos, BUY liquida cortos.
      const side=/SELL|LONG/.test(s)?"long":"short";
      return {key:key("liq"),t:CSV.toTs(g(r,"t")),side,qty:num(g(r,"qty")),price:num(g(r,"price")),prov:"IMP"};}).filter(x=>fin(x.t)&&fin(x.qty))};}
  if(type==="bookticker"){return {store:"book",key:key("book"),rows:rows.map(r=>{const t=CSV.toTs(g(r,"t"));
      const bp=num(g(r,"bidPrice")),ap=num(g(r,"askPrice")),bq=num(g(r,"bidQty")),aq=num(g(r,"askQty"));
      const s=OB.fromL2([[bp,bq]],[[ap,aq]],t,"IMP");return s&&{key:key("book"),...s};}).filter(Boolean)};}
  if(type==="bookl2"||type==="bookjson"){
    const byT=new Map();
    for(const r of rows){const t=CSV.toTs(g(r,"t"));if(!fin(t))continue;
      let e=byT.get(t);if(!e){e={b:[],a:[]};byT.set(t,e);}
      if(type==="bookjson"){try{const bb=JSON.parse(g(r,"bids")),aa=JSON.parse(g(r,"asks"));
          e.b=bb.map(x=>[+x[0],+x[1]]);e.a=aa.map(x=>[+x[0],+x[1]]);}catch(_){ }}
      else{const s=String(g(r,"side")||"").toLowerCase(),p=num(g(r,"price")),q=num(g(r,"qty"));
        if(!fin(p)||!fin(q))continue; (s.startsWith("b")||s.startsWith("1")?e.b:e.a).push([p,q]);}}
    const out=[];for(const [t,e] of byT){e.b.sort((x,y)=>y[0]-x[0]);e.a.sort((x,y)=>x[0]-y[0]);
      const s=OB.fromL2(e.b,e.a,t,"IMP");if(s)out.push({key:key("book"),...s});}
    out.sort((x,y)=>x.t-y.t);return {store:"book",key:key("book"),rows:out};}
  if(type==="bookdepth"){
    const unit=opt.pctUnit||1; // 1 => la columna ya está en %, 100 => viene en fracción
    const byT=new Map();
    for(const r of rows){const t=CSV.toTs(g(r,"t"));if(!fin(t))continue;
      const pctv=num(g(r,"percentage"))*unit, nt=num(g(r,"notional")), dp=num(g(r,"depth"));
      const val=fin(nt)?Math.abs(nt):Math.abs(dp);if(!fin(val))continue;
      let e=byT.get(t);if(!e){e={depth:{},mid:num(g(r,"mid"))};byT.set(t,e);}
      const L=Math.abs(pctv)/100, side=pctv<0?"b":"a";
      // acumula: todos los niveles hasta L
      e.depth[L]=e.depth[L]||{b:0,a:0}; e.depth[L][side]+=val;}
    const out=[];for(const [t,e] of byT){
      const ks=Object.keys(e.depth).map(Number).sort((a,b)=>a-b);
      const cum={};let cb=0,ca=0;for(const L of ks){cb+=e.depth[L].b;ca+=e.depth[L].a;cum[L]={b:cb,a:ca};}
      out.push({key:key("book"),...OB.fromAgg({t,mid:e.mid,depth:cum,prov:"IMP"})});}
    out.sort((x,y)=>x.t-y.t);return {store:"book",key:key("book"),rows:out};}
  throw new Error("Tipo no soportado todavía: "+type);
}

/* =================== 19. MERCADO EN VIVO ================================ */
/* FIX: toda serie temporal en memoria se alimenta por aquí. Rechaza
   timestamps repetidos o que retroceden, que era lo que ensuciaba ΔOI,
   el z-score del funding y el muestreo del libro. */
function pushSeries(arr,row,cap=3000){
  if(!row||!fin(row.t))return false;
  const L=last(arr);
  if(L&&row.t<=L.t)return false;
  arr.push(row); if(arr.length>cap)arr.splice(0,arr.length-cap); return true;}
const MKT={sym:CFG.asset,mkt:CFG.market,tfSel:"1m",klines:[],book:null,bookPrev:null,bookHist:[],trades:[],
  oi:[],funding:[],liq:[],levels:[],xe:[],streams:{},price:NaN,
  health:{ws:"idle",klines:"idle",book:"idle",deriv:"idle",xe:"idle"}};
const BASE=()=>MKT.mkt==="futures"?"https://fapi.binance.com/fapi/v1":"https://api.binance.com/api/v3";
const FEED=(()=>{
  let ws=null,stop=false;
  function mapKline(a){return {t:a[0],o:+a[1],h:+a[2],l:+a[3],c:+a[4],v:+a[5],ct:a[6],tb:+a[9],prov:"LIVE"};}
  async function klines(sym,tf="1m",limit=1000){
    const u=`${BASE()}/klines?symbol=${sym}&interval=${tf}&limit=${limit}`;
    const d=await NET.json(u);return d.map(mapKline);}
  async function depth(sym){
    const u=`${BASE()}/depth?symbol=${sym}&limit=${CFG.bookDepthLimit}`;
    const d=await NET.json(u);return OB.fromL2(d.bids,d.asks,now(),"LIVE");}
  async function derivs(sym){
    if(MKT.mkt!=="futures")return null;
    const [oi,pi]=await Promise.all([
      NET.json(`https://fapi.binance.com/fapi/v1/openInterest?symbol=${sym}`).catch(()=>null),
      NET.json(`https://fapi.binance.com/fapi/v1/premiumIndex?symbol=${sym}`).catch(()=>null)]);
    return {t:now(),oi:oi?+oi.openInterest:NaN,mark:pi?+pi.markPrice:NaN,index:pi?+pi.indexPrice:NaN,
      rate:pi?+pi.lastFundingRate:NaN,prov:"LIVE"};}
  async function derivHist(sym){ // OI 5m + long/short + taker l/s (ventana corta)
    const q=`symbol=${sym}&period=5m&limit=500`;
    const [oh,ls,tl]=await Promise.all([
      NET.json(`https://fapi.binance.com/futures/data/openInterestHist?${q}`).catch(()=>[]),
      NET.json(`https://fapi.binance.com/futures/data/globalLongShortAccountRatio?${q}`).catch(()=>[]),
      NET.json(`https://fapi.binance.com/futures/data/takerlongshortRatio?${q}`).catch(()=>[])]);
    const m=new Map();
    for(const r of (oh||[]))m.set(+r.timestamp,{t:+r.timestamp,oi:+r.sumOpenInterest,prov:"LIVE"});
    for(const r of (ls||[])){const e=m.get(+r.timestamp)||{t:+r.timestamp,prov:"LIVE"};e.lsr=+r.longShortRatio;m.set(+r.timestamp,e);}
    for(const r of (tl||[])){const e=m.get(+r.timestamp)||{t:+r.timestamp,prov:"LIVE"};e.tlsr=+r.buySellRatio;m.set(+r.timestamp,e);}
    return [...m.values()].sort((a,b)=>a.t-b.t);}
  async function fundingHist(sym){
    const d=await NET.json(`https://fapi.binance.com/fapi/v1/fundingRate?symbol=${sym}&limit=500`).catch(()=>[]);
    return (d||[]).map(r=>({t:+r.fundingTime,rate:+r.fundingRate,prov:"LIVE"}));}
  async function cross(sym){
    const out=[],base=sym.replace("USDT","");
    const tasks=[];
    if(CFG.exchanges.bybit)tasks.push(NET.json(`https://api.bybit.com/v5/market/tickers?category=linear&symbol=${sym}`)
      .then(d=>({ex:"Bybit",price:+d.result.list[0].lastPrice,vol:+d.result.list[0].turnover24h}))); 
    if(CFG.exchanges.okx)tasks.push(NET.json(`https://www.okx.com/api/v5/market/ticker?instId=${SRC.okxId(sym)}`)
      .then(d=>({ex:"OKX",price:+d.data[0].last,vol:+d.data[0].volCcy24h})));
    if(CFG.exchanges.coinbase)tasks.push(NET.json(`https://api.exchange.coinbase.com/products/${SRC.cbId(sym)}/ticker`)
      .then(d=>({ex:"Coinbase",price:+d.price,vol:+d.volume})));
    if(CFG.exchanges.kraken)tasks.push(NET.json(`https://api.kraken.com/0/public/Ticker?pair=${SRC.krId(sym)}`)
      .then(d=>{const k=Object.values(d.result)[0];return {ex:"Kraken",price:+k.c[0],vol:+k.v[1]};}));
    const res=await Promise.allSettled(tasks);
    for(const r of res)if(r.status==="fulfilled"&&fin(r.value.price))out.push(r.value);
    if(fin(MKT.price))out.unshift({ex:"Binance",price:MKT.price,vol:NaN});
    return out;}
  function openWS(sym){
    closeWS();
    const s=sym.toLowerCase();
    const fut=MKT.mkt==="futures";
    const streams=[`${s}@aggTrade`,`${s}@depth20@100ms`,fut?`${s}@markPrice@1s`:`${s}@bookTicker`,fut?`${s}@forceOrder`:null].filter(Boolean);
    const url=(fut?"wss://fstream.binance.com/stream?streams=":"wss://stream.binance.com:9443/stream?streams=")+streams.join("/");
    try{ws=new WebSocket(url);}catch(e){MKT.health.ws="error";return;}
    MKT.health.ws="connecting";
    ws.onopen=()=>{MKT.health.ws="open";UI.renderHealth&&UI.renderHealth();};
    ws.onclose=()=>{MKT.health.ws="closed";UI.renderHealth&&UI.renderHealth();if(!stop)setTimeout(()=>openWS(MKT.sym),4000);};
    ws.onerror=()=>{MKT.health.ws="error";};
    ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(_){return;}
      const d=m.data||m,st=m.stream||"";
      if(st.includes("aggTrade")){MKT.trades.push({t:d.T,p:+d.p,q:+d.q,m:d.m,prov:"LIVE"});
        if(MKT.trades.length>60000)MKT.trades.splice(0,20000);MKT.price=+d.p;}
      else if(st.includes("depth")){const b=OB.fromL2(d.b||d.bids,d.a||d.asks,d.E||now(),"LIVE");
        if(b){MKT.bookPrev=MKT.book;MKT.book=b;MKT.health.book="ok";}}
      else if(st.includes("markPrice")){MKT.mark={t:d.E,mark:+d.p,index:+d.i,rate:+d.r,prov:"LIVE"};}
      else if(st.includes("bookTicker")){MKT.price=(+d.b+ +d.a)/2;}
      else if(st.includes("forceOrder")){const o=d.o||d;
        MKT.liq.push({t:o.T,side:/SELL/i.test(o.S)?"long":"short",qty:+o.q,price:+o.ap||+o.p,prov:"LIVE"});
        if(MKT.liq.length>5000)MKT.liq.splice(0,2000);}
    };}
  function closeWS(){stop=false;if(ws){try{ws.onclose=null;ws.close();}catch(_){}ws=null;}}
  return {klines,depth,derivs,derivHist,fundingHist,cross,openWS,closeWS,mapKline};
})();

/* =================== 20. GRABADOR (construye tu propio histórico) ======= */
const REC=(()=>{
  let timer=null;
  async function tick(){
    if(!CFG.recorder.on)return;
    try{
      /* FIX: antes se guardaba el snapshot aunque el libro no hubiera cambiado
         y el OI aunque fuera la misma lectura de hace 30 s: eso generaba filas
         duplicadas con el mismo timestamp y distorsionaba cualquier cálculo
         posterior por número de muestras. */
      const key=`${MKT.sym}|book|REC`;
      if(MKT.book&&MKT.book.t!==REC.lastBookT){const {...snap}=MKT.book;snap.prov="REC";
        await DB.put("book",{key,...snap});REC.lastBookT=MKT.book.t;MKT.health.rec="ok";}
      const okey=`${MKT.sym}|oi|REC`;
      if(MKT.derivNow&&fin(MKT.derivNow.oi)&&MKT.derivNow.t!==REC.lastOiT){
        await DB.put("oi",{key:okey,t:MKT.derivNow.t,oi:MKT.derivNow.oi,prov:"REC"});REC.lastOiT=MKT.derivNow.t;}
      const lkey=`${MKT.sym}|liq|REC`;
      if(MKT._liqCursor===undefined)MKT._liqCursor=MKT.liq.length;
      const fresh=MKT.liq.slice(MKT._liqCursor);MKT._liqCursor=MKT.liq.length;
      if(fresh.length)await DB.putMany("liq",fresh.map(x=>({key:lkey,...x,prov:"REC"})));
    }catch(e){MKT.health.rec="error";}
  }
  function start(){stop();timer=setInterval(tick,Math.max(1000,CFG.recorder.everyMs));}
  function stop(){if(timer)clearInterval(timer);timer=null;}
  return {start,stop,tick,lastBookT:null,lastOiT:null};
})();
</script>
<script>
/* =================== 21. GRÁFICOS (canvas, sin dependencias) ============ */
const CH={
  setup(cv,h=160){const dpr=devicePixelRatio||1,w=cv.clientWidth||600;
    cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+"px";
    const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);return {g,w,h};},
  axes(g,w,h,pad,min,max,fmtY=(v)=>fmt(v,2)){
    g.strokeStyle="#1E333D";g.lineWidth=1;g.font="10px ui-monospace,monospace";g.fillStyle="#5A6E78";
    for(let i=0;i<=4;i++){const y=pad.t+(h-pad.t-pad.b)*i/4,v=max-(max-min)*i/4;
      g.beginPath();g.moveTo(pad.l,y+.5);g.lineTo(w-pad.r,y+.5);g.stroke();
      g.fillText(fmtY(v),3,y+3);}},
  line(cv,series,{h=170,fmtY,zero=false,labels=null}={}){
    const {g,w}=CH.setup(cv,h),pad={l:52,r:8,t:8,b:16};
    const all=series.flatMap(s=>s.data.filter(fin));
    if(!all.length){g.fillStyle="#5A6E78";g.font="11px ui-monospace";g.fillText("sin datos",pad.l,h/2);return;}
    let min=Math.min(...all),max=Math.max(...all);
    if(zero){const m=Math.max(Math.abs(min),Math.abs(max));min=-m;max=m;}
    if(min===max){min-=1;max+=1;}
    const pd=(max-min)*0.08;min-=pd;max+=pd;
    CH.axes(g,w,h,pad,min,max,fmtY);
    const n=Math.max(...series.map(s=>s.data.length));
    const X=i=>pad.l+(w-pad.l-pad.r)*(n<2?0:i/(n-1)), Y=v=>pad.t+(h-pad.t-pad.b)*(1-(v-min)/(max-min));
    if(zero){g.strokeStyle="#2A4450";g.beginPath();g.moveTo(pad.l,Y(0));g.lineTo(w-pad.r,Y(0));g.stroke();}
    for(const s of series){g.strokeStyle=s.color||"#3FC1C9";g.lineWidth=s.w||1.4;g.beginPath();let started=false;
      s.data.forEach((v,i)=>{if(!fin(v)){started=false;return;}const x=X(i),y=Y(v);
        if(!started){g.moveTo(x,y);started=true;}else g.lineTo(x,y);});
      g.stroke();
      if(s.fillLast&&fin(last(s.data))){g.fillStyle=s.color;g.beginPath();g.arc(X(s.data.length-1),Y(last(s.data)),2.2,0,7);g.fill();}}
    if(labels){g.fillStyle="#5A6E78";g.font="10px ui-monospace";
      g.fillText(labels[0],pad.l,h-4);g.textAlign="right";g.fillText(labels[1],w-pad.r,h-4);g.textAlign="left";}},
  bars(cv,vals,cols,{h=140,fmtY,names=null}={}){
    const {g,w}=CH.setup(cv,h),pad={l:52,r:8,t:8,b:20};
    const max=Math.max(0.0001,...vals.map(Math.abs));
    CH.axes(g,w,h,pad,-max,max,fmtY);
    const bw=(w-pad.l-pad.r)/vals.length,Y=v=>pad.t+(h-pad.t-pad.b)*(1-(v+max)/(2*max));
    vals.forEach((v,i)=>{g.fillStyle=cols[i]||"#3FC1C9";const y0=Y(0),y=Y(v);
      g.fillRect(pad.l+i*bw+bw*0.15,Math.min(y0,y),bw*0.7,Math.abs(y-y0)||1);
      if(names){g.save();g.fillStyle="#5A6E78";g.font="9px ui-monospace";g.translate(pad.l+i*bw+bw/2,h-3);g.textAlign="center";
        g.fillText(names[i].slice(0,10),0,0);g.restore();}});},
  reliability(cv,bins,{h=170}={}){
    const {g,w}=CH.setup(cv,h),pad={l:40,r:8,t:8,b:18};
    g.strokeStyle="#2A4450";g.beginPath();g.moveTo(pad.l,h-pad.b);g.lineTo(w-pad.r,pad.t);g.stroke();
    g.strokeStyle="#1E333D";g.strokeRect(pad.l,pad.t,w-pad.l-pad.r,h-pad.t-pad.b);
    const X=p=>pad.l+(w-pad.l-pad.r)*clamp((p-1/3)/(2/3),0,1),Y=p=>pad.t+(h-pad.t-pad.b)*(1-clamp(p,0,1));
    g.strokeStyle="#E0A23C";g.lineWidth=1.6;g.beginPath();let st=false;
    for(const b of bins){if(!b.n||!fin(b.obs))continue;const x=X(b.pMean),y=Y(b.obs);
      if(!st){g.moveTo(x,y);st=true;}else g.lineTo(x,y);}
    g.stroke();
    for(const b of bins){if(!b.n)continue;g.fillStyle="#E0A23C";g.beginPath();g.arc(X(b.pMean),Y(b.obs),Math.min(5,1.5+Math.log10(b.n+1)*2),0,7);g.fill();}
    g.fillStyle="#5A6E78";g.font="10px ui-monospace";g.fillText("prob. declarada →",pad.l+2,h-5);
    g.save();g.translate(11,h/2);g.rotate(-Math.PI/2);g.textAlign="center";g.fillText("acierto real",0,0);g.restore();}
};

/* =================== 22. DATASET EN VIVO + MOTOR DE PREDICCIÓN ========== */
async function buildLiveDataset(tf="1m"){
  const sym=MKT.sym;
  const D={sym,tf,k:MKT.klines.filter(k=>k.ct<now()),book:MKT.bookHist.slice(),
    trades:MKT.trades.slice(),oi:MKT.oi.slice(),funding:MKT.funding.slice(),
    liq:MKT.liq.slice(),levels:MKT.levels.filter(l=>l.on),xe:MKT.xe.slice(),
    prov:{klines:"LIVE",book:MKT.bookHist.length?"LIVE":"NA",trades:MKT.trades.length?"LIVE":"NA",
      oi:MKT.oi.length?"LIVE":"NA",funding:MKT.funding.length?"LIVE":"NA",liq:MKT.liq.length?"LIVE":"NA",
      levels:MKT.levels.length?"MAN":"NA",xe:MKT.xe.length?"LIVE":"NA"}};
  return D;
}
async function buildStoredDataset(sym,tf,sources){
  const pick=async(store,ds)=>{const out=[];
    for(const p of sources){const key=`${sym}|${ds}|${p}`;const r=await DB.range(store,key);out.push(...r);}
    return out.sort((a,b)=>a.t-b.t);};
  const kk=[];for(const p of sources){kk.push(...await DB.range("klines",`${sym}|${tf}|${p}`));}
  kk.sort((a,b)=>a.t-b.t);
  const dedup=[];for(const k of kk)if(!dedup.length||k.t>last(dedup).t)dedup.push(k);
  const D={sym,tf,k:dedup,book:await pick("book","book"),trades:await pick("trades","trades"),
    oi:await pick("oi","oi"),funding:await pick("funding","funding"),liq:await pick("liq","liq"),
    levels:MKT.levels.filter(l=>l.on),xe:[]};
  D.prov={klines:dedup.length?dedup[0].prov:"NA",book:D.book.length?D.book[0].prov:"NA",
    trades:D.trades.length?"IMP":"NA",oi:D.oi.length?D.oi[0].prov:"NA",funding:D.funding.length?"IMP":"NA",
    liq:D.liq.length?D.liq[0].prov:"NA",levels:D.levels.length?"MAN":"NA",xe:"NA"};
  return D;
}
const ENGINE={
  ctx:null,lastPred:{},busy:false,
  async predictNow(){
    if(this.busy)return;this.busy=true;
    try{
      const D=await buildLiveDataset("1m");
      if(D.k.length<80){this.busy=false;return;}
      const ctx=buildCtx(D);this.ctx=ctx;
      const feats=activeFeatures(ctx.has);
      const i=ctx.n-1;
      const x=featureVector(ctx,i,feats);
      // escalador causal: media/sd de las últimas 500 velas cerradas (expanding, sin futuro)
      const hist=[];for(let j=Math.max(70,ctx.n-500);j<=i;j++)hist.push({x:featureVector(ctx,j,feats),y:"NEUTRAL"});
      const scaler=fitScaler(hist,feats);
      const M=MODELS[CFG.model];
      let state={};
      if(CFG.model==="M6"||CFG.model==="M7"){
        const {samples}=buildSamples(ctx,5);
        if(samples.length>150)state=M.fit(samples.slice(0,samples.length-10),scaler,feats);
        else {this.lastNote="M6/M7 necesitan ≥150 muestras cerradas; usando M5.";}
      }
      const useM=(state&&Object.keys(state).length)||["M0","M1","M2","M3","M4","M5"].includes(CFG.model)?M:MODELS.M5;
      const out={};
      for(const hMin of CFG.horizons){
        const pr=useM.predict(x,scaler,feats,state);
        // el horizonte modula la fuerza: más lejos, menos señal microestructural
        const damp=1/(1+Math.log2(1+hMin)*0.35);
        const sc=clamp((pr.score||0)*damp,-1,1);
        const p=useM===MODELS.M0?pr.p:scoreToProb(sc,fin(pr.agree)?1-pr.agree:0);
        const dir=dirOf(p),conf=confidenceOf({p,agree:pr.agree});
        const thr=neutralThreshold(ctx,i);
        const rec={pid:`${now()}-${hMin}-${Math.random().toString(36).slice(2,7)}`,t:ctx.k[i].ct,
          sym:MKT.sym,tf:"1m",hMin,price:ctx.k[i].c,p,dir,conf,thr,
          model:useM===MODELS.M0?"M0":CFG.model,agree:fin(pr.agree)?Math.round(pr.agree*100):null,
          top:(pr.contrib||[]).slice(0,8).map(c=>({id:c.id,c:+c.c.toFixed(4),v:fin(c.v)?+c.v.toFixed(6):null,cat:c.cat})),
          features:Object.fromEntries(Object.entries(x).filter(([,v])=>fin(v)).map(([k2,v])=>[k2,+v.toFixed(6)])),
          prov:D.prov,tier:dataTier(ctx.has,feats).tier,tEnd:ctx.k[i].ct+hMin*60000,open:1,expMove:sc*thr*3};
        out[hMin]=rec;
        const prev=this.lastPred[hMin];
        if(!prev||prev.t!==rec.t){await DB.put("preds",rec);}
      }
      this.lastPred=out;
      await this.resolve();
    }catch(e){console.warn("predictNow",e);}
    this.busy=false;
  },
  async resolve(){
    const all=await DB.all("preds");
    const open=all.filter(p=>p.open&&p.tEnd<=now());
    for(const p of open){
      const k=MKT.klines.find(x=>x.t<=p.tEnd&&x.ct>=p.tEnd)||MKT.klines.filter(x=>x.ct<=p.tEnd).pop();
      if(!k)continue;
      const ret=Math.log(k.c/p.price);
      p.actual=ret>p.thr?"UP":ret<-p.thr?"DOWN":"NEUTRAL";
      p.ret=ret;p.pEnd=k.c;p.correct=p.actual===p.dir?1:0;p.open=0;
      await DB.put("preds",p);}
  }
};


/* =================== 22b. SIGUIENTE VELA (NC) ==========================
   Pregunta más estricta que la del panel: ¿la vela EN CURSO cerrará por
   encima o por debajo de SU PROPIA apertura?
   Usa sólo datos que la app ya consume (klines, libro y aggTrades por WS,
   derivados REST). Los clusters de liquidación (MAN) son opcionales.

   Tres cosas que esta sección hace explícitas porque cambian la lectura:
   · Una vela empezada ya contiene parte de la respuesta. Se mide qué
     fracción de la vela había transcurrido al predecir y el acierto se
     desglosa por ese tramo: acertar al 90% de la vela no vale lo mismo.
   · Si ninguna señal domina, se dice SIN SEÑAL en vez de inventar una
     dirección. El umbral es configurable.
   · Una vela que cierra exactamente en su apertura no es ni acierto ni
     fallo: se excluye del cómputo en lugar de contarse como acierto.     */
const NC={
  ST:{on:false,timer:null,ticker:null,snap:null,last:[],loaded:false},
  band:0.12,
  W:{model:2.0,pos:1.4,obiNear:1.5,obiAll:1.0,microDev:1.0,flow:1.2,reg:0.8,funding:0.4,trend:1.0,liq:0.6},

  /* ---------- lógica pura: sin DOM, sin red, testeable ---------- */
  tfMs(tf){return TFMS[tf||MKT.tfSel]||60000;},
  barOpen(t,ms){return Math.floor(t/ms)*ms;},
  nextClose(t,ms){return NC.barOpen(t,ms)+ms;},
  elapsed(t,ms){return clamp((t-NC.barOpen(t,ms))/ms,0,1);},
  prob2(score){score=clamp(score,-1,1);const z=3*score;
    return {UP:1/(1+Math.exp(-2*z)),DOWN:1/(1+Math.exp(2*z))};},
  confOf(p){return Math.round(clamp((Math.max(p.UP,p.DOWN)-0.5)*200,0,100));},
  blend(parts){let s=0,w=0;
    for(const p of parts){if(!p||!fin(p.c)||!fin(p.w)||p.w<=0)continue;s+=clamp(p.c,-1,1)*p.w;w+=p.w;}
    return w>0?clamp(s/w,-1,1):0;},
  verdict(o,c){return c>o?"UP":c<o?"DOWN":"FLAT";},
  idOf(tf,barOpen){return tf+"|"+barOpen;},
  /* recorrido ya consumido de la vela, medido en ATR: invariante de escala */
  posSignal(bar,price,atr){
    if(!bar||!fin(price)||!fin(atr)||atr<=0)return NaN;
    return clamp((price-bar.o)/atr,-1,1);},
  /* tendencia normalizada por su propia volatilidad: comparable entre 1m y 1h */
  trendSignal(closed,n2){
    n2=n2||3;if(!closed||closed.length<n2+2)return NaN;
    const c=closed.map(k=>k.c),r=IND.logret(c,1).filter(fin).slice(-30);
    const s2=r.length>10?sd(r):NaN;if(!fin(s2)||s2<=0)return NaN;
    return clamp(Math.log(c[c.length-1]/c[c.length-1-n2])/(s2*Math.sqrt(n2))/2,-1,1);},
  decide(score,band){
    band=fin(band)?band:NC.band;
    const p=NC.prob2(score);
    return {score,p,conf:NC.confOf(p),
      dir:score>=band?"UP":score<=-band?"DOWN":"NONE"};},
  /* señales; cada una declara de dónde sale y cómo se normaliza */
  parts(x){
    const W=NC.W,out=[];
    const add=(id,v,c,w,note)=>{if(fin(c))out.push({id,v,c:clamp(c,-1,1),w,note});};
    add("modelo "+(x.modelName||""),x.model,x.model,W.model,
      "score del modelo de la app sobre la última vela de 1 m cerrada, amortiguado por la distancia de esta temporalidad");
    add("recorrido de la vela",x.posRaw,x.pos,W.pos,
      "cuánto lleva avanzado el precio sobre la apertura, medido en ATR de esta temporalidad: es la parte de la respuesta que ya ocurrió");
    add("OBI ±0.1%",x.obiNear,fin(x.obiNear)?x.obiNear*2.5:NaN,W.obiNear,"desbalance del libro cerca del mid (WS depth20)");
    add("OBI libro completo",x.obiAll,x.obiAll,W.obiAll,"desbalance de todo el libro capturado (WS)");
    add("microprice − mid",x.microDev,fin(x.microDev)?x.microDev*4000:NaN,W.microDev,
      "microprice ponderado por tamaños frente al mid; ±0,025% satura la señal");
    add("order flow 60 s",x.flow,fin(x.flow)?x.flow*3:NaN,W.flow,"delta taker de los últimos 60 s sobre volumen agresivo total (WS aggTrade)");
    add("régimen precio×OI",x.reg,x.reg,W.reg,"misma función DV.regime del panel, con ΔOI medido por tiempo real, no por número de muestras");
    add("funding (contrario)",x.funding,fin(x.funding)?-x.funding*200:NaN,W.funding,
      "funding vigente en sentido contrario: apiñamiento alcista, presión bajista (REST futures)");
    add("tendencia "+(x.tf||""),x.trendRaw,x.trend,W.trend,
      "retorno de las 3 últimas velas CERRADAS dividido por su propia volatilidad: comparable entre 1 m y 1 h");
    add("clusters de liquidación",x.liqRaw,x.liq,W.liq,
      "única entrada manual y opcional: niveles cargados en «Fuentes y datos»; sin niveles la señal no existe");
    return out;},

  /* ---------- datos ---------- */
  async klinesTF(sym,tf,limit){
    const d=await NET.json(`${BASE()}/klines?symbol=${sym}&interval=${tf}&limit=${limit}`);
    return d.map(FEED.mapKline);},
  async snapshot(opt={}){
    const tf=opt.tf||MKT.tfSel||"1m",ms=NC.tfMs(tf),t=now();
    const ks=await NC.klinesTF(MKT.sym,tf,120);
    const closed=ks.filter(k=>k.ct<t);
    const bar=ks.find(k=>k.t<=t&&k.ct>=t)||null;
    const x={tf},src={},missing=[];
    const price=bar?bar.c:(fin(MKT.price)?MKT.price:NaN);

    // volatilidad propia de la temporalidad, para normalizar sin números mágicos
    const c=closed.map(k=>k.c),h=closed.map(k=>k.h),l=closed.map(k=>k.l);
    const atr=closed.length>20?last(IND.atr(h,l,c,14)):NaN;
    const r1=IND.logret(c,1).filter(fin).slice(-30);
    const sd1=r1.length>10?sd(r1):NaN;

    // 1) score del modelo de la app (sobre 1 m cerrado). M0/M6/M7 necesitan
    //    estado entrenado: sin él se usa M5 en vez de reventar.
    if(ENGINE.ctx&&ENGINE.ctx.n>80){
      try{
        const ctx=ENGINE.ctx,feats=activeFeatures(ctx.has),i=ctx.n-1;
        const fv=featureVector(ctx,i,feats);
        const hist=[];for(let j=Math.max(70,ctx.n-500);j<=i;j++)hist.push({x:featureVector(ctx,j,feats),y:"NEUTRAL"});
        const scaler=fitScaler(hist,feats);
        const mid=["M0","M6","M7"].includes(CFG.model)?"M5":CFG.model;
        const pr=MODELS[mid].predict(fv,scaler,feats,{});
        const hMin=Math.max(1,Math.round(ms/60000));
        x.model=clamp((pr.score||0)/(1+Math.log2(1+hMin)*0.35),-1,1);
        x.modelName=mid+(mid===CFG.model?"":" (sustituye a "+CFG.model+", sin entrenar)");
        src.modelo=x.modelName;
      }catch(e){missing.push("modelo: "+e.message);}
    } else missing.push("modelo: aún no hay contexto de 1 m (necesita 80 velas)");

    // 2) recorrido ya consumido de la vela en curso
    if(bar&&fin(atr)&&atr>0){x.posRaw=(price-bar.o)/bar.o;x.pos=NC.posSignal(bar,price,atr);
      src.vela="klines REST "+tf+" (LIVE)";}
    else if(bar)missing.push("recorrido: sin ATR suficiente en "+tf);

    // 3) libro en vivo
    const b=MKT.book;
    if(b){x.obiNear=b.d&&b.d[0.001]?b.d[0.001].obi:NaN;x.obiAll=b.obiAll;x.microDev=b.microDev;
      src.libro="WS depth20 (LIVE)";}
    else missing.push("libro: WebSocket sin snapshot");

    // 4) order flow en vivo
    if(MKT.trades.length){const agg=OF.bucket(MKT.trades,t-60000,t),ref=agg.buy+agg.sell;
      if(ref>0){x.flow=agg.delta/ref;src.flujo="WS aggTrade (LIVE)";}else missing.push("flujo: sin trades en los últimos 60 s");}
    else missing.push("flujo: buffer de trades vacío");

    // 5) derivados
    if(MKT.mkt==="futures"){
      const oi=last(MKT.oi);
      if(oi&&MKT.oi.length>1){
        const j=bisect(MKT.oi,oi.t-300000),ref=j>=0?MKT.oi[j]:null;
        const dOI=ref&&Math.abs(ref.t-(oi.t-300000))<=150000&&ref.oi>0?oi.oi/ref.oi-1:NaN;
        const ci=(()=>{for(let i=MKT.klines.length-1;i>=0;i--)if(MKT.klines[i].ct<t)return i;return -1;})();
        const dP=ci>=5?MKT.klines[ci].c/MKT.klines[ci-5].c-1:NaN;
        if(fin(dOI)&&fin(dP)){x.reg=DV.regime(dP,dOI);src.derivados="REST futures (LIVE)";}
        else missing.push("régimen precio×OI: sin muestra de OI a 5 minutos");}
      else missing.push("régimen precio×OI: serie de OI vacía");
      if(MKT.mark&&fin(MKT.mark.rate)){x.funding=MKT.mark.rate;src.funding="markPrice WS (LIVE)";}
      else missing.push("funding: sin markPrice");
    } else missing.push("derivados: sólo disponibles en mercado de futuros");

    // 6) tendencia normalizada por su propia volatilidad
    if(closed.length>4&&fin(sd1)&&sd1>0){
      x.trendRaw=Math.log(last(closed).c/closed[closed.length-4].c);
      x.trend=NC.trendSignal(closed,3);
      src.tendencia="klines REST "+tf+" (LIVE)";}

    // 7) magnetismo hacia clusters (MANUAL, opcional)
    if(MKT.levels.some(l=>l.on)&&fin(price)){
      const lo=LQ.near(MKT.levels,price,"long"),sh=LQ.near(MKT.levels,price,"short");
      if(lo&&sh){const dl2=Math.abs(lo.d),ds2=Math.abs(sh.d);
        x.liqRaw=ds2-dl2;x.liq=clamp((ds2-dl2)/Math.max(1e-9,dl2+ds2),-1,1);
        src.clusters="niveles MAN cargados por ti";}}

    const parts=NC.parts(x),score=NC.blend(parts),d=NC.decide(score);
    return {t,tf,ms,bar,closed:closed.length,atr,barOpen:NC.barOpen(t,ms),nextClose:NC.nextClose(t,ms),
      elapsed:NC.elapsed(t,ms),x,parts,price,src,missing,...d};},

  /* ---------- registro, resolución y estadística ---------- */
  async record(snap){
    const id=NC.idOf(snap.tf,snap.barOpen);
    if(NC.ST.last.some(r=>r.id===id))return null;
    const row={id,t:snap.t,tf:snap.tf,ms:snap.ms,barOpen:snap.barOpen,barClose:snap.nextClose,
      elapsed:+snap.elapsed.toFixed(4),dir:snap.dir,conf:snap.conf,pUp:snap.p.UP,score:+snap.score.toFixed(4),
      price:snap.price,open:snap.bar?snap.bar.o:NaN,close:NaN,actual:null,hit:null,
      parts:snap.parts.map(q=>({id:q.id,c:+q.c.toFixed(3),w:q.w}))};
    NC.ST.last.unshift(row);if(NC.ST.last.length>200)NC.ST.last.pop();
    try{await DB.put("nc",row);}catch(e){}
    return row;},
  resolveRow(row,k){
    if(!k||k.t!==row.barOpen||k.ct>=now())return false;
    row.actual=NC.verdict(k.o,k.c);row.close=k.c;row.open=k.o;
    row.hit=(row.actual==="FLAT"||row.dir==="NONE")?null:(row.actual===row.dir?1:0);
    return true;},
  async resolve(){
    const pend=NC.ST.last.filter(r=>!r.actual);
    if(!pend.length)return 0;
    const byTf={};for(const r of pend)(byTf[r.tf]=byTf[r.tf]||[]).push(r);
    let done=0;
    for(const tf in byTf){
      const ms=NC.tfMs(tf),oldest=Math.min(...byTf[tf].map(r=>r.barOpen));
      const limit=clamp(Math.ceil((now()-oldest)/ms)+2,2,1000);
      let ks;try{ks=await NC.klinesTF(MKT.sym,tf,limit);}catch(e){continue;}
      const byOpen=new Map(ks.map(k=>[k.t,k]));
      for(const r of byTf[tf])
        if(NC.resolveRow(r,byOpen.get(r.barOpen))){done++;try{await DB.put("nc",r);}catch(e){}}}
    return done;},
  stats(rows){
    const done=rows.filter(r=>r.actual);
    const scored=done.filter(r=>r.hit!==null);
    const hits=scored.filter(r=>r.hit).length;
    const B=[[0,.34,"primer tercio"],[.34,.67,"tramo medio"],[.67,1.01,"último tercio"]];
    const buckets=B.map(([a,b2,label])=>{const g=scored.filter(r=>r.elapsed>=a&&r.elapsed<b2);
      return {label,n:g.length,acc:g.length?g.filter(r=>r.hit).length/g.length:NaN};});
    const [lo,hi]=ST.wilson(hits,scored.length);
    return {total:rows.length,done:done.length,scored:scored.length,hits,
      acc:scored.length?hits/scored.length:NaN,ci:[lo,hi],
      p:scored.length?ST.binomP(hits,scored.length,0.5):NaN,
      flats:done.filter(r=>r.actual==="FLAT").length,
      none:done.filter(r=>r.dir==="NONE").length,buckets};},
  async load(){
    if(NC.ST.loaded)return;
    try{const all=await DB.all("nc");NC.ST.last=all.sort((a,b)=>b.t-a.t).slice(0,200);}catch(e){}
    NC.ST.loaded=true;},
  exportCSV(){
    if(!NC.ST.last.length)return toast("Sin predicciones registradas");
    dl("ccdp-siguiente-vela.csv",toCSV(NC.ST.last.map(r=>({
      hora:ts(r.t),tf:r.tf,vela_abre:ts(r.barOpen),vela_cierra:ts(r.barClose),
      transcurrido_pct:(r.elapsed*100).toFixed(1),prediccion:r.dir,confianza:r.conf,
      p_verde:r.pUp.toFixed(4),score:r.score,precio_al_predecir:r.price,apertura:r.open,
      cierre:fin(r.close)?r.close:"",resultado:r.actual||"",acierto:r.hit===null?"":r.hit,
      señales:(r.parts||[]).map(q=>q.id+":"+q.c).join("|")}))),"text/csv");}
};

const EXP={
  async predictions(kind="csv"){
    let rows=[];try{rows=(await DB.all("preds")).sort((a,b)=>b.t-a.t);}catch(e){return toast("No se pudo leer el historial: "+e.message);}
    if(!rows.length)return toast("No hay predicciones registradas todavía");
    if(kind==="json")return dl("ccdp-predictions.json",JSON.stringify(rows,null,1),"application/json");
    dl("ccdp-predictions.csv",toCSV(rows.map(p=>({timestamp:ts(p.t),asset:p.sym,horizon_min:p.hMin,model:p.model,
      price:p.price,prediction:p.dir,p_up:p.p.UP.toFixed(4),p_neutral:p.p.NEUTRAL.toFixed(4),p_down:p.p.DOWN.toFixed(4),
      confidence:p.conf,threshold:p.thr.toFixed(6),tier:p.tier,resolved:p.open?"":ts(p.tEnd),actual:p.actual||"",
      ret:fin(p.ret)?p.ret.toFixed(6):"",correct:p.open?"":p.correct,
      provenance:Object.entries(p.prov||{}).map(([k,v])=>k+"="+v).join(" ")}))),"text/csv");},
  backtest(res,kind="csv"){
    if(!res)return toast("Ejecuta antes un backtest");
    if(kind==="json")return dl("ccdp-backtest.json",JSON.stringify(res,null,1),"application/json");
    dl("ccdp-backtest.csv",toCSV(res.rows.map(r=>({timestamp:ts(r.t),price:r.price,pred:r.yhat,actual:r.y,
      p_up:r.p.UP.toFixed(4),p_neutral:r.p.NEUTRAL.toFixed(4),p_down:r.p.DOWN.toFixed(4),conf:r.conf,
      ret:r.ret.toFixed(6),mfe:r.mfe.toFixed(6),mae:r.mae.toFixed(6),correct:r.y===r.yhat?1:0,
      top_factors:r.top.map(c=>c.id+":"+c.c.toFixed(3)).join("|")}))),"text/csv");},
  async features(){
    if(!ENGINE.ctx)return toast("Sin contexto: carga datos primero");
    const ctx=ENGINE.ctx,feats=activeFeatures(ctx.has),rows=[];
    for(let i=70;i<ctx.n;i++){const x=featureVector(ctx,i,feats);rows.push({timestamp:ts(ctx.k[i].ct),close:ctx.k[i].c,...x});}
    dl("ccdp-features.csv",toCSV(rows),"text/csv");},
  config(){const {save,...c}=CFG;dl("ccdp-config.json",JSON.stringify(c,null,1),"application/json");},
  async market(){const D=await buildLiveDataset("1m");
    dl("ccdp-market.json",JSON.stringify({sym:D.sym,klines:D.k.slice(-1500),book:D.book.slice(-800),
      oi:D.oi,funding:D.funding,liq:D.liq.slice(-800),levels:D.levels,prov:D.prov},null,1),"application/json");}
};

const esc=s=>String(s===null||s===undefined?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderStrip(){
  const p=MKT.price,k=MKT.klines,n=k.length;
  /* FIX: la última vela del array está EN CURSO. Calcular "cambio 1m/5m/15m"
     contra ella mezclaba una vela incompleta con velas cerradas y el número
     bailaba dentro del mismo minuto. Ahora todo se mide sobre velas cerradas
     y la vela en curso se muestra aparte, etiquetada como tal. */
  const ci=(()=>{for(let i=n-1;i>=0;i--)if(k[i].ct<now())return i;return -1;})();
  const chg=m=>{if(ci<m)return NaN;return k[ci].c/k[ci-m].c-1;};
  const live=ci>=0&&ci<n-1?k[n-1].c/k[ci].c-1:(ci>=0&&fin(p)?p/k[ci].c-1:NaN);
  const cell=(lab,val,cls="")=>`<div style="min-width:86px"><div class="tag">${lab}</div><div class="num ${cls}" style="font-size:14px">${val}</div></div>`;
  const col=v=>!fin(v)?"":v>0?"up":v<0?"down":"neu";
  $("#strip").innerHTML=`<div class="row" style="gap:18px;align-items:flex-start">
    <div><div class="tag">${esc(MKT.sym)} · ${MKT.mkt==="futures"?"USDⓈ-M perp":"spot"}</div>

      <div>${MKT.health.ws==="open"?'<span class="prov p-live">LIVE</span>':'<span class="prov p-na">SIN FEED</span>'}</div></div>
    ${cell("en curso",pct(live,2),col(live))}
    ${cell("1m cerrada",pct(chg(1),2),col(chg(1)))}${cell("5m",pct(chg(5),2),col(chg(5)))}
    ${cell("15m",pct(chg(15),2),col(chg(15)))}${cell("1h",pct(chg(60),2),col(chg(60)))}
    ${cell("velas cerradas",ci+1)}${cell("snapshots libro",MKT.bookHist.length)}${cell("trades buffer",MKT.trades.length)}
    <div class="sp"></div>
    <div class="row tight">
      <button class="sm" onclick="boot(true)">Recargar datos</button>
      <button class="sm" onclick="ENGINE.predictNow().then(()=>RENDER.live())">Predecir ahora</button>
    </div></div>`;
}
UI.renderHealth=function(){

     <span style="min-width:112px">${name}</span><span class="tag">${esc(detail||"")}</span></div>`;

  ].join("");

function renderPredCards(){

    const p=preds[hMin];if(!p)continue;
    const cls=p.dir==="UP"?"up":p.dir==="DOWN"?"down":"neu";
    const lvl=p.conf>=CFG.confThresholds.med?"HIGH":p.conf>=CFG.confThresholds.low?"MEDIUM":"LOW";

function renderMicroPanels(){
  const b=MKT.book,ob=$("#obPanel");
  if(ob){ob.innerHTML=b?`<dl class="kv">
      <dt>best bid / ask</dt><dd>${fmt(b.bb,2)} / ${fmt(b.ba,2)}</dd>
      <dt>spread</dt><dd>${fmt(b.spread,2)} (${pct(b.spreadRel,4)})</dd>

  const of=$("#ofPanel");
  if(of){const t1=now(),t0=t1-60000,agg=MKT.trades.length?OF.bucket(MKT.trades,t0,t1):null;

      :'<div class="dim">—</div>';}
}

async function ncTick(manual){
  if(!manual&&UI.tab!=="next")return;           // no gasta peticiones en segundo plano
  const st=$("#ncState");if(st)st.textContent="midiendo…";
  try{
    const snap=await NC.snapshot();NC.ST.snap=snap;
    await NC.record(snap);
    await NC.resolve();
    if(UI.tab==="next"){paintNext(snap);paintNextHist();}
    if(st)st.textContent="actualizado "+hhmm(now());
  }catch(e){if(st)st.textContent="error: "+e.message;}
}
function ncCountdown(){
  const snp=NC.ST.snap;if(!snp||UI.tab!=="next")return;
  const el2=$("#ncClock"),eb=$("#ncElapsed");if(!el2)return;
  const rest=snp.nextClose-now();
  if(rest<=0){el2.textContent="vela cerrada · esperando la siguiente lectura";if(eb)eb.style.width="100%";return;}
  const mm=Math.floor(rest/60000),ss=Math.floor(rest%60000/1000);
  el2.textContent=`cierra en ${mm}m ${String(ss).padStart(2,"0")}s`;
  if(eb)eb.style.width=(100*(1-rest/snp.ms)).toFixed(1)+"%";
}
