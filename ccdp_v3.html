      return `<tr class="${first?"exgrp":""}"><td>${first?esc(x.ex):'<span class="dim">·</span>'}</td>
        <td class="opt dim">${esc(x.mkt)}</td><td class="wrap">${esc(x.data)}</td><td class="opt dim">${esc(x.freq)}</td>
        <td class="opt">${x.key?"sí":"no"}</td><td class="opt dim">${esc(x.lim)}</td>
        <td class="${col}">${esc(x.status)}${x.err?`<div class="tag">${esc(String(x.err).slice(0,44))}</div>`:""}</td>
        <td>${fin(x.ms)?x.ms:"—"}</td><td class="opt dim">${esc(x.q)}</td>
        <td class="opt dim" title="${esc(url)}">${esc(url.replace(/^https:\/\//,"").slice(0,46))}…</td>
        <td><button class="sm" data-probe="${esc(x.id)}">probar</button></td></tr>`;}).join("");
    $$("[data-probe]").forEach(bt=>bt.onclick=async e=>{
      const id=e.target.dataset.probe,src=SRC.by(id);
      e.target.textContent="…";await SRC.probe(src,MKT.sym);paint();});};
  paint();
  $("#onlyOk").onchange=paint;
  $("#probeBtn").onclick=async()=>{const b2=$("#probeBtn");b2.disabled=true;
    let i=0;for(const src of SRC.list){b2.textContent=`probando ${++i}/${SRC.list.length}…`;await SRC.probe(src,MKT.sym);paint();}
    b2.disabled=false;b2.textContent="Probar todas";
    toast(SRC.list.filter(x=>x.status==="OK").length+" de "+SRC.list.length+" fuentes responden desde este navegador");};

  /* ---- consistencia de datos ---- */
  const paintChecks=(rows)=>{
    const c={ok:0,warn:0,error:0};for(const r of rows)c[r.level]++;
    $("#ckOut").innerHTML=`<div class="row" style="gap:18px;margin-bottom:6px">
        ${stat(c.ok,"correctos","res-ok")}${stat(c.warn,"avisos","res-warn")}${stat(c.error,"errores","res-err")}</div>
      <div class="scroll"><table><thead><tr><th>Serie</th><th>Comprobación</th><th>Resultado</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td class="dim">${esc(r.series)}</td><td class="wrap">${esc(r.name)}</td>
        <td class="wrap ${r.level==="ok"?"res-ok":r.level==="warn"?"res-warn":"res-err"}">${esc(r.detail)}</td></tr>`).join("")}
      </tbody></table></div>`;
    $("#ckWhen").textContent="última comprobación "+hhmm(now());};
  $("#ckRun").onclick=async()=>{
    const D=await buildLiveDataset("1m");
    UI.checks=CHECKS.run(D);paintChecks(UI.checks);};
  $("#ckExport").onclick=()=>{if(!UI.checks)return toast("Ejecuta antes la comprobación");
    dl("ccdp-consistencia.md",CHECKS.report(UI.checks),"text/markdown");};

  /* ---- pruebas unitarias ---- */
  const paintTests=()=>{
    const r=UI.tests;if(!r)return;
    const onlyFail=$("#utFail").checked;
    const byG={};for(const t of r.rows)(byG[t.g]=byG[t.g]||[]).push(t);
    $("#utOut").innerHTML=`<div class="row" style="gap:18px;margin-bottom:6px">
        ${stat(r.pass,"pasadas","res-ok")}${stat(r.total-r.pass,"fallidas",r.total-r.pass?"res-err":"dim")}
        ${stat(r.total,"total")}${stat(r.ms+" ms","duración")}</div>
      <div class="scroll">${Object.entries(byG).map(([g,ts2])=>{
        const vis=ts2.filter(t=>!onlyFail||!t.pass);if(!vis.length)return "";
        return `<table style="margin-bottom:8px"><thead><tr><th colspan="3">${esc(g)} <span class="dim">(${ts2.filter(t=>t.pass).length}/${ts2.length})</span></th></tr></thead><tbody>
          ${vis.map(t=>`<tr><td class="${t.pass?"res-ok":"res-err"}">${t.pass?"PASS":"FAIL"}</td>
            <td class="wrap">${esc(t.name)}</td><td class="wrap dim">${esc(t.detail)}</td></tr>`).join("")}</tbody></table>`;}).join("")}</div>`;};
  $("#utRun").onclick=()=>{UI.tests=TESTS.run();paintTests();
    toast(`${UI.tests.pass}/${UI.tests.total} pruebas pasadas`);};
  $("#utFail").onchange=paintTests;
  $("#utExport").onclick=()=>{if(!UI.tests)return toast("Ejecuta antes las pruebas");
    dl("ccdp-pruebas.md",TESTS.report(UI.tests),"text/markdown");};
  if(UI.tests)paintTests();
  if(UI.checks)paintChecks(UI.checks);

  /* ---- almacenamiento ---- */
  const spacing=(rows)=>{if(rows.length<3)return "—";
    const d=[];for(let i=1;i<rows.length;i++)d.push(rows[i].t-rows[i-1].t);
    d.sort((a,b)=>a-b);const med=d[Math.floor(d.length/2)];
    const cv=sd(d)/(mean(d)||1);
    return `${(med/1000).toFixed(1)}s ${cv>0.5?`<span class="res-warn">irregular</span>`:""}`;};
  const storeInfo=async()=>{
    const q=await DB.quota();const parts=[];
    for(const st of ["klines","book","trades","oi","funding","liq"]){
      let ks=[];try{ks=await DB.keys(st);}catch(e){continue;}
      for(const k of ks){
        let sample=[];try{sample=await DB.range(st,k.key,-Infinity,Infinity,400);}catch(e){}
        const prov=[...new Set(sample.map(r=>r.prov).filter(Boolean))];
        parts.push(`<tr><td>${esc(st)}</td><td class="wrap">${esc(k.key)}</td><td>${k.n.toLocaleString()}</td>
          <td class="opt dim">${ts(k.t0)}</td><td class="opt dim">${ts(k.t1)}</td>
          <td class="opt">${spacing(sample)}</td>
          <td>${prov.map(x=>provTag(x).outerHTML).join(" ")||'<span class="dim">—</span>'}</td></tr>`);}}
    let np=0;try{np=await DB.count("preds");}catch(e){}
    const used=(q&&q.usage)||0,cap=(q&&q.quota)||0;
    $("#storeInfo").innerHTML=`
      <div class="row"><span class="tag">${cap?`${fmt(used/1048576,1)} MB de ~${fmt(cap/1048576,0)} MB`:"cuota desconocida"}</span>
        <span class="sp"></span><span class="tag">${np.toLocaleString()} predicciones registradas</span></div>
      <div class="quota"><i style="width:${cap?clamp(used/cap*100,0.5,100):0}%"></i></div>
      <div class="scroll" style="margin-top:6px"><table><thead><tr><th>Store</th><th>Serie</th><th>Filas</th>
        <th class="opt">Desde</th><th class="opt">Hasta</th><th class="opt">Espaciado</th><th>Procedencia</th></tr></thead>
      <tbody>${parts.join("")||'<tr><td colspan="7" class="dim">vacío</td></tr>'}</tbody></table></div>`;};
  storeInfo();
  $("#refreshStore").onclick=storeInfo;
  $("#wipe").onclick=async()=>{if(!confirm("Borrar TODO lo guardado (datos, predicciones, backtests)?"))return;
    for(const st of DB.STORES){try{await DB.clear(st);}catch(e){}}toast("Almacenamiento vaciado");storeInfo();};

  /* ---- grabador ---- */
  const recStat=()=>{$("#recStat").textContent=CFG.recorder.on
    ? `último libro ${REC.lastBookT?hhmm(REC.lastBookT):"—"} · último OI ${REC.lastOiT?hhmm(REC.lastOiT):"—"}`
    : "apagado";};
  recStat();
  $("#recOn").onchange=e=>{CFG.recorder.on=e.target.checked;CFG.save();e.target.checked?REC.start():REC.stop();UI.renderHealth();recStat();};
  $("#recMs").onchange=e=>{CFG.recorder.everyMs=Math.max(1,+e.target.value)*1000;CFG.save();if(CFG.recorder.on)REC.start();};

  /* ---- niveles de liquidación ---- */
  const paintLv=()=>{$("#levels").innerHTML=MKT.levels.length?`<div class="scroll"><table><thead><tr><th>Lado</th><th>Precio</th><th>Distancia</th>
      <th class="opt">Volumen est.</th><th class="opt">Fuente</th><th>Tipo</th><th class="opt">Timestamp</th><th>Coherencia</th><th></th></tr></thead><tbody>
      ${MKT.levels.map((l,i)=>{
        const d=fin(MKT.price)?(l.price-MKT.price)/MKT.price:NaN;
        const bad=fin(d)&&((l.side==="long"&&d>0)||(l.side==="short"&&d<0));
        return `<tr><td class="${l.side==="long"?"down":"up"}">${l.side}</td><td>${fmt(l.price,2)}</td>
        <td class="${d>0?"up":"down"}">${fin(d)?pct(d,3):"—"}</td><td class="opt">${fin(l.vol)?fmt(l.vol,0):"—"}</td>
        <td class="opt">${esc(l.src||"")}</td><td>${provTag(l.type).outerHTML}</td><td class="opt dim">${ts(l.ts)}</td>
        <td class="${bad?"res-err":"res-ok"}">${bad?(l.side==="long"?"un nivel de largos debería estar por debajo":"un nivel de cortos debería estar por encima"):"ok"}</td>
        <td><label class="inline"><input type="checkbox" data-i="${i}" class="lvOn" ${l.on?"checked":""}> usar</label>
        <button class="sm" data-del="${i}">×</button></td></tr>`;}).join("")}</tbody></table></div>`
      :'<div class="dim">Sin niveles. Añádelos a mano o impórtalos como CSV (quedan marcados IMPORT).</div>';
    $$(".lvOn").forEach(c=>c.onchange=e=>{MKT.levels[+e.target.dataset.i].on=e.target.checked;saveLevels();});
    $$("[data-del]").forEach(bt=>bt.onclick=e=>{MKT.levels.splice(+e.target.dataset.del,1);saveLevels();paintLv();});};
  paintLv();
  $("#addLv").onclick=()=>{const pr=+$("#lvPrice").value;if(!fin(pr)||pr<=0)return toast("Precio inválido");
    MKT.levels.push({side:$("#lvSide").value,price:pr,vol:+$("#lvVol").value||NaN,src:$("#lvSrc").value||"manual",
      type:"MAN",ts:now(),on:true});saveLevels();paintLv();};
};
function saveLevels(){localStorage.setItem("ccdp.levels",JSON.stringify(MKT.levels));}
</script>
<script>
/* ---------- IMPORTAR CSV ---------- */
let IMPORTQ=[];
RENDER_import=function(){
  const s=$("#tab-import");
  s.innerHTML=`<div class="grid">
    <div class="card c12"><h3>Cargar datos históricos desde archivos</h3>
      <div class="drop" id="drop">Arrastra aquí CSV / TSV / NDJSON, o <button class="sm" id="pick">elige archivos</button>
        <input type="file" id="file" multiple accept=".csv,.tsv,.txt,.json,.ndjson" hidden>
        <div class="tag" style="margin-top:6px">Se procesan en el navegador. Nada sale de tu máquina.</div></div>
      <div id="queue" class="stack" style="margin-top:10px"></div></div>
    <div class="card c6"><h3>De dónde sacar cada dato sin backend</h3>
      <table><thead><tr><th>Dato</th><th>Vía</th><th>Cobertura</th></tr></thead><tbody>
        <tr><td>OHLCV 1m</td><td>API en vivo + volcados diarios públicos</td><td>años</td></tr>
        <tr><td>aggTrades (CVD real)</td><td>volcado diario → CSV</td><td>años (archivos grandes)</td></tr>
        <tr><td>Profundidad agregada del libro</td><td>volcado diario <span class="mono">bookDepth</span> → CSV</td><td>desde 2023 aprox.</td></tr>
        <tr><td>Best bid/ask alta frecuencia</td><td>volcado diario <span class="mono">bookTicker</span> → CSV</td><td>años</td></tr>
        <tr><td>OI y ratios long/short</td><td>volcado <span class="mono">metrics</span> → CSV, o API (ventana corta)</td><td>metrics: largo; API: ~30 d</td></tr>
        <tr><td>Liquidaciones</td><td>volcado <span class="mono">liquidationSnapshot</span> → CSV, o WS en vivo</td><td>histórico por archivo</td></tr>
        <tr><td>Clusters / heatmap de liquidación</td><td>no hay API pública fiable → MANUAL</td><td>puntual</td></tr>
        <tr><td>L2 completo tick a tick</td><td>tu propia captura (Parquet/DuckDB) → exportar a CSV</td><td>lo que grabes</td></tr>
      </tbody></table>
      <div class="warnbox" style="margin-top:8px">Los volcados públicos vienen en ZIP: descomprime antes de arrastrar el CSV.
        El importador detecta la cabecera y te deja corregir el mapeo, así que también acepta exports propios de DuckDB/Parquet con otros nombres de columna.</div></div>
    <div class="card c6"><h3>Esquemas que entiende</h3>
      <table><thead><tr><th>Tipo</th><th>Campos mínimos</th></tr></thead><tbody>
        ${Object.entries(CSV.FIELDS).map(([k,v])=>`<tr><td class="mono">${k}</td><td class="dim">${v.map(f=>esc(CSV.LABEL[f]||f)).join(", ")}</td></tr>`).join("")}
      </tbody></table>
      <div class="infobox" style="margin-top:8px">Si tu archivo no encaja en ninguno, elige <b>custom</b> y mapea las columnas a mano: el tipo destino lo eliges tú.</div></div>
  </div>`;
  const pickEl=$("#file");
  $("#pick").onclick=()=>pickEl.click();
  pickEl.onchange=e=>handleFiles([...e.target.files]);
  const d=$("#drop");
  d.ondragover=e=>{e.preventDefault();d.classList.add("over");};
  d.ondragleave=()=>d.classList.remove("over");
  d.ondrop=e=>{e.preventDefault();d.classList.remove("over");handleFiles([...e.dataTransfer.files]);};
  paintQueue();
};
async function handleFiles(files){
  for(const f of files){
    const text=await f.slice(0,3_000_000).text();
    const {header,rows,delim}=CSV.parse(text,{maxRows:4000});
    const type=CSV.detect(header);
    IMPORTQ.push({file:f,name:f.name,size:f.size,header,sample:rows.slice(0,5),delim,type,
      map:Object.fromEntries((CSV.FIELDS[type]||["t"]).map(fd=>[fd,CSV.guess(fd,header)])),tf:"1m",pctUnit:1,status:"listo"});}
  paintQueue();
}
function paintQueue(){
  const q=$("#queue");if(!q)return;q.innerHTML="";
  if(!IMPORTQ.length){q.innerHTML='<div class="dim">Sin archivos en cola.</div>';return;}
  IMPORTQ.forEach((it,idx)=>{
    const fields=CSV.FIELDS[it.type]||[];
    const card=el("div",{class:"card"});
    card.innerHTML=`<div class="row"><b class="mono">${esc(it.name)}</b>
      <span class="tag">${fmt(it.size/1048576,2)} MB · ${it.header.length} columnas · separador "${it.delim==="\t"?"TAB":it.delim}"</span>
      <span class="sp"></span>
      <label class="inline">tipo
        <select data-t="${idx}">${["klines","trades","bookl2","bookjson","bookdepth","bookticker","oi","funding","liq","custom"]
          .map(t=>`<option value="${t}" ${t===it.type?"selected":""}>${t}</option>`).join("")}</select></label>
      ${it.type==="klines"?`<label class="inline">timeframe <select data-tf="${idx}">${Object.keys(TFMS).map(t=>`<option ${t===it.tf?"selected":""}>${t}</option>`).join("")}</select></label>`:""}
      ${it.type==="bookdepth"?`<label class="inline">unidad %<select data-pu="${idx}"><option value="1">columna en % (1 = 1%)</option><option value="100">columna en fracción (0.01 = 1%)</option></select></label>`:""}
      <button class="sm" data-rm="${idx}">quitar</button></div>
      <div class="row" style="margin-top:6px;gap:10px">${fields.map(fd=>`<label class="inline">${esc(CSV.LABEL[fd]||fd)}
        <select data-map="${idx}" data-f="${fd}"><option value="-1">—</option>
        ${it.header.map((h,j)=>`<option value="${j}" ${it.map[fd]===j?"selected":""}>${esc(h)}</option>`).join("")}</select></label>`).join("")}</div>
      <div class="scroll" style="max-height:120px;margin-top:6px"><table><thead><tr>${it.header.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
        <tbody>${it.sample.map(r=>`<tr>${r.map(c=>`<td>${esc(String(c).slice(0,22))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <div class="row" style="margin-top:6px"><button class="primary sm" data-go="${idx}">Importar a ${esc(MKT.sym)}</button>
        <span class="tag" data-st="${idx}">${esc(it.status)}</span></div>`;
    q.append(card);});
  $$("[data-t]").forEach(s2=>s2.onchange=e=>{const i=+e.target.dataset.t;IMPORTQ[i].type=e.target.value;
    IMPORTQ[i].map=Object.fromEntries((CSV.FIELDS[e.target.value]||["t"]).map(fd=>[fd,CSV.guess(fd,IMPORTQ[i].header)]));paintQueue();});
  $$("[data-tf]").forEach(s2=>s2.onchange=e=>{IMPORTQ[+e.target.dataset.tf].tf=e.target.value;});
  $$("[data-pu]").forEach(s2=>s2.onchange=e=>{IMPORTQ[+e.target.dataset.pu].pctUnit=+e.target.value;});
  $$("[data-map]").forEach(s2=>s2.onchange=e=>{IMPORTQ[+e.target.dataset.map].map[e.target.dataset.f]=+e.target.value;});
  $$("[data-rm]").forEach(b=>b.onclick=e=>{IMPORTQ.splice(+e.target.dataset.rm,1);paintQueue();});
  $$("[data-go]").forEach(b=>b.onclick=async e=>{
    const i=+e.target.dataset.go,it=IMPORTQ[i],st=$(`[data-st="${i}"]`);
    if(it.type==="custom")return toast("Elige un tipo de destino distinto de custom");
    st.textContent="leyendo archivo completo…";
    try{
      const text=await it.file.text();
      const {header,rows}=CSV.parse(text,{delim:it.delim});
      st.textContent=`transformando ${rows.length.toLocaleString()} filas…`;await sleep(10);
      const r=transformImport(it.type,header,rows,it.map,MKT.sym,{tf:it.tf,pctUnit:it.pctUnit});
      // inserta por lotes para no bloquear
      let done=0;const B=5000;
      while(done<r.rows.length){await DB.putMany(r.store,r.rows.slice(done,done+B));done+=B;
        st.textContent=`guardando ${done.toLocaleString()}/${r.rows.length.toLocaleString()}…`;await sleep(0);}
      it.status=`importadas ${r.rows.length.toLocaleString()} filas → ${r.store} (${r.key})`;
      st.textContent=it.status;toast("Importación terminada");
    }catch(err){it.status="error: "+err.message;st.textContent=it.status;}
  });
}

/* ---------- FEATURES ---------- */
RENDER_features=function(){
  const s=$("#tab-features");
  const has=ENGINE.ctx?ENGINE.ctx.has:{klines:true};
  const byCat={};for(const f of FEATURES){(byCat[f.cat]=byCat[f.cat]||[]).push(f);}
  s.innerHTML=`<div class="grid">
    <div class="card c12"><h3>Vector de features <span class="hint">${FEATURES.length} definidas · versionadas para reproducibilidad</span></h3>
      <div class="row"><button class="sm" id="allOn">Activar todas</button><button class="sm" id="allOff">Desactivar todas</button>
      <span class="tag">Las que no tengan datos cargados se excluyen solas del experimento y el backtest lo declara en su “tier”.</span></div></div>
    ${CATS.map(c=>`<div class="card c6"><h3>${CAT_ES[c]} <span class="hint">${(byCat[c]||[]).length}</span></h3>
      ${(byCat[c]||[]).map(f=>{const ok=f.needs.every(n=>has[n]);
        return `<div class="feat-row"><input type="checkbox" class="ftog" data-id="${f.id}" ${CFG.disabledFeatures[f.id]?"":"checked"}>
        <span title="${esc(f.desc)}">${esc(f.id)}</span>
        <span class="tag">v${f.ver}</span>
        <span class="prov ${ok?"p-live":"p-na"}">${ok?"datos":"sin datos"}</span></div>`;}).join("")}
      </div>`).join("")}
    <div class="card c12"><h3>Definición</h3><div class="scroll"><table><thead><tr><th>id</th><th>categoría</th><th>requiere</th><th>descripción</th></tr></thead>
      <tbody>${FEATURES.map(f=>`<tr><td>${esc(f.id)}</td><td class="dim">${esc(CAT_ES[f.cat])}</td><td class="dim">${f.needs.join("+")}</td><td>${esc(f.desc)}</td></tr>`).join("")}</tbody></table></div></div>
  </div>`;
  $$(".ftog").forEach(c=>c.onchange=e=>{const id=e.target.dataset.id;
    if(e.target.checked)delete CFG.disabledFeatures[id];else CFG.disabledFeatures[id]=1;CFG.save();});
  $("#allOn").onclick=()=>{CFG.disabledFeatures={};CFG.save();RENDER.features();};
  $("#allOff").onclick=()=>{CFG.disabledFeatures=Object.fromEntries(FEATURES.map(f=>[f.id,1]));CFG.save();RENDER.features();};
};

/* ---------- MODELOS ---------- */
RENDER_models=function(){
  const s=$("#tab-models");
  s.innerHTML=`<div class="grid">
    <div class="card c6"><h3>Modelo activo</h3>
      <div class="stack">${MODEL_IDS.map(m=>`<label class="inline"><input type="radio" name="mdl" value="${m}" ${CFG.model===m?"checked":""}>
        <b>${esc(MODELS[m].name)}</b></label>`).join("")}</div>
      <div class="infobox" style="margin-top:8px">M0 existe para que nunca compares contra nada. Si tu modelo no bate a M0 y a los baselines, no hay señal: hay ruido bien presentado.</div></div>
    <div class="card c6"><h3>Pesos del score combinado (M5)</h3>
      ${CATS.map(c=>`<div class="row" style="gap:8px"><span style="width:110px" class="tag">${CAT_ES[c]}</span>
        <input type="range" min="0" max="40" value="${CFG.weights[c]}" data-w="${c}" style="flex:1">
        <span class="num" style="width:34px;text-align:right" id="w-${c}">${CFG.weights[c]}</span></div>`).join("")}
      <div class="warnbox" style="margin-top:8px">Mover estos pesos mirando el resultado del backtest <b>es overfitting manual</b>. Ajusta pesos con el tramo de entrenamiento y deja el test quieto.</div></div>
    <div class="card c6"><h3>Umbral NEUTRAL</h3>
      <div class="row"><label class="inline"><input type="radio" name="nm" value="bps" ${CFG.neutralMode==="bps"?"checked":""}> fijo</label>
        <input type="number" id="nbps" value="${CFG.neutralBps}" step="1" style="width:70px"> bps
        <label class="inline"><input type="radio" name="nm" value="atr" ${CFG.neutralMode==="atr"?"checked":""}> adaptativo</label>
        k=<input type="number" id="nk" value="${CFG.neutralK}" step="0.05" style="width:70px"> × ATR</div>
      <div class="infobox" style="margin-top:8px">Umbral fijo en un mercado que cambia de volatilidad crea clases desbalanceadas artificiales. El modo adaptativo (k·ATR) mantiene el reparto UP/NEUTRAL/DOWN estable.</div></div>
    <div class="card c6"><h3>Confianza y validación</h3>
      <div class="row"><label class="inline">LOW &lt; <input type="number" id="cl" value="${CFG.confThresholds.low}" style="width:60px"></label>
        <label class="inline">HIGH ≥ <input type="number" id="cm" value="${CFG.confThresholds.med}" style="width:60px"></label></div>
      <div class="row" style="margin-top:6px"><label class="inline">folds walk-forward <input type="number" id="wff" value="${CFG.wf.folds}" min="2" max="12" style="width:60px"></label>
        <label class="inline">embargo (velas) <input type="number" id="wfe" value="${CFG.wf.embargo}" min="0" style="width:60px"></label>
        <label class="inline">train mínimo <input type="number" id="wfm" value="${CFG.wf.minTrain}" style="width:80px"></label></div>
      <div class="row" style="margin-top:6px"><label class="inline">épocas logística <input type="number" id="mlr" value="${CFG.mlRounds}" style="width:70px"></label>
        <label class="inline">rondas boosting <input type="number" id="mlb" value="${CFG.mlBoostRounds}" style="width:70px"></label></div>
      <div class="tag" style="margin-top:6px">El embargo se suma al horizonte para purgar el solape entre train y test (López de Prado).</div></div>
    <div class="card c12"><h3>Tests anti look-ahead</h3>
      <button class="sm" id="runLeak">Ejecutar tests</button><div id="leakOut" style="margin-top:8px"></div></div>
  </div>`;
  $$("[name=mdl]").forEach(r=>r.onchange=e=>{CFG.model=e.target.value;CFG.save();toast("Modelo: "+MODELS[e.target.value].name);});
  $$("[data-w]").forEach(r=>r.oninput=e=>{const c=e.target.dataset.w;CFG.weights[c]=+e.target.value;$("#w-"+c).textContent=e.target.value;CFG.save();});
  $$("[name=nm]").forEach(r=>r.onchange=e=>{CFG.neutralMode=e.target.value;CFG.save();});
  $("#nbps").onchange=e=>{CFG.neutralBps=+e.target.value;CFG.save();};
  $("#nk").onchange=e=>{CFG.neutralK=+e.target.value;CFG.save();};
  $("#cl").onchange=e=>{CFG.confThresholds.low=+e.target.value;CFG.save();};
  $("#cm").onchange=e=>{CFG.confThresholds.med=+e.target.value;CFG.save();};
  $("#wff").onchange=e=>{CFG.wf.folds=+e.target.value;CFG.save();};
  $("#wfe").onchange=e=>{CFG.wf.embargo=+e.target.value;CFG.save();};
  $("#wfm").onchange=e=>{CFG.wf.minTrain=+e.target.value;CFG.save();};
  $("#mlr").onchange=e=>{CFG.mlRounds=+e.target.value;CFG.save();};
  $("#mlb").onchange=e=>{CFG.mlBoostRounds=+e.target.value;CFG.save();};
  $("#runLeak").onclick=()=>{
    if(!ENGINE.ctx)return toast("Carga datos primero (pestaña Panel)");
    const r=runLeakTests(ENGINE.ctx);
    $("#leakOut").innerHTML=`<table><thead><tr><th></th><th>Test</th><th>Detalle</th></tr></thead><tbody>
      ${r.map(x=>`<tr><td class="${x.pass?"up":"down"}">${x.pass?"PASS":"FAIL"}</td><td>${esc(x.name)}</td><td class="dim">${esc(x.detail)}</td></tr>`).join("")}</tbody></table>`;};
};

<script>
/* ---------- BACKTEST ---------- */
async function getDataset(){
  const src=$("#btSrc")?$("#btSrc").value:"auto";
  const tf=$("#btTf")?$("#btTf").value:CFG.bt.tf;
  let D;
  if(src==="live")D=await buildLiveDataset(tf);
  else{
    D=await buildStoredDataset(MKT.sym,tf,["IMP","REC"]);
    if(!D.k.length){const L=await buildLiveDataset(tf);D.k=L.k;D.prov.klines="LIVE";
      if(!D.book.length){D.book=L.book;D.prov.book=L.prov.book;}
      if(!D.trades.length){D.trades=L.trades;D.prov.trades=L.prov.trades;}
      if(!D.oi.length){D.oi=L.oi;D.prov.oi=L.prov.oi;}
      if(!D.funding.length){D.funding=L.funding;D.prov.funding=L.prov.funding;}
      if(!D.liq.length){D.liq=L.liq;D.prov.liq=L.prov.liq;}}}
  const f=$("#btFrom")&&$("#btFrom").value?Date.parse($("#btFrom").value):-Infinity;
  const t=$("#btTo")&&$("#btTo").value?Date.parse($("#btTo").value)+86399999:Infinity;
  if(isFinite(f)||isFinite(t)){
    D.k=D.k.filter(x=>x.t>=f&&x.t<=t);
    for(const s of ["book","trades","oi","funding","liq"])D[s]=D[s].filter(x=>x.t>=f-3600000&&x.t<=t);}
  return D;
}
RENDER_backtest=function(){
  const s=$("#tab-backtest");
  s.innerHTML=`<div class="grid">
    <div class="card c12"><h3>Configurar experimento</h3>
      <div class="row">
        <label class="inline">datos <select id="btSrc"><option value="auto">guardados (IMPORT/REC) y si no, memoria</option><option value="live">sólo memoria (sesión actual)</option></select></label>
        <label class="inline">timeframe <select id="btTf">${Object.keys(TFMS).map(t=>`<option ${t===CFG.bt.tf?"selected":""}>${t}</option>`).join("")}</select></label>
        <label class="inline">horizonte <select id="btH">${CFG.horizons.map(h=>`<option value="${h}">${h} velas</option>`).join("")}</select></label>
        <label class="inline">modelo <select id="btM">${MODEL_IDS.map(m=>`<option value="${m}" ${m===CFG.model?"selected":""}>${esc(MODELS[m].name)}</option>`).join("")}</select></label>
        <label class="inline">confianza mínima <input type="number" id="btC" value="${CFG.bt.confMin}" min="0" max="100" style="width:64px"></label>
        <label class="inline">desde <input type="date" id="btFrom" value="${esc(CFG.bt.from)}"></label>
        <label class="inline">hasta <input type="date" id="btTo" value="${esc(CFG.bt.to)}"></label>
        <button class="primary" id="btRun">Ejecutar backtest</button>
        <button class="sm" id="btAll">Comparar los 8 modelos</button>
      </div>
      <div class="meter" style="margin-top:8px"><i id="btBar" style="width:0%"></i></div>
      <div id="btState" class="tag" style="margin-top:4px"></div></div>
    <div id="btOut" class="c12" style="grid-column:span 12"></div>
  </div>`;
  $("#btRun").onclick=async()=>{
    const btn=$("#btRun");btn.disabled=true;$("#btState").textContent="preparando dataset…";
    try{
      const D=await getDataset();
      if(D.k.length<150)throw new Error(`Sólo ${D.k.length} velas disponibles. Importa un CSV de klines o deja correr la sesión.`);
      const ctx=buildCtx(D);ENGINE.ctx=ctx;
      $("#btState").textContent=`${D.k.length.toLocaleString()} velas · ${ts(D.k[0].t)} → ${ts(last(D.k).ct)}`;
      const res=await runBacktest({ctx,hBars:+$("#btH").value,modelId:$("#btM").value,confMin:+$("#btC").value},
        p=>{$("#btBar").style.width=(p*100).toFixed(0)+"%";});
      res.prov=D.prov;res.sym=MKT.sym;res.tf=$("#btTf").value;
      UI.bt=res;await DB.put("runs",{id:"run-"+now(),t:now(),summary:{acc:res.metrics.acc,n:res.metrics.n,model:res.modelId,h:res.hBars,tier:res.tier.tier}});
      paintBacktest(res);
    }catch(e){$("#btOut").innerHTML=`<div class="card"><div class="warnbox">${esc(e.message)}</div></div>`;}
    btn.disabled=false;$("#btBar").style.width="0%";};
  $("#btAll").onclick=async()=>{
    const btn=$("#btAll");btn.disabled=true;
    try{
      const D=await getDataset();const ctx=buildCtx(D);ENGINE.ctx=ctx;
      const out=[];let i=0;
      for(const m of MODEL_IDS){$("#btState").textContent="modelo "+m+"…";
        try{const r=await runBacktest({ctx,hBars:+$("#btH").value,modelId:m,confMin:+$("#btC").value});
          out.push({m,name:MODELS[m].name,...r.metrics,vsRandom:r.baselines.random.mcnemar.p});}
        catch(e){out.push({m,name:MODELS[m].name,err:e.message});}
        $("#btBar").style.width=(++i/MODEL_IDS.length*100)+"%";await sleep(0);}
      $("#btOut").innerHTML=`<div class="card"><h3>Comparación de modelos <span class="hint">mismo dataset, mismos folds, mismo test</span></h3>
        <table><thead><tr><th>Modelo</th><th>n</th><th>Accuracy</th><th>IC 95%</th><th>Brier</th><th>LogLoss</th><th>Dir. acc</th><th>Cobertura</th><th>Ret medio</th><th>p vs aleatorio</th></tr></thead>
        <tbody>${out.map(o=>o.err?`<tr><td>${esc(o.name)}</td><td colspan="9" class="dim">${esc(o.err)}</td></tr>`:
          `<tr><td>${esc(o.name)}</td><td>${o.n}</td><td class="${o.acc>0.4?"up":""}">${pct(o.acc,2)}</td>
           <td class="dim">${pct(o.ci[0],1)}–${pct(o.ci[1],1)}</td><td>${fmt(o.brier,4)}</td><td>${fmt(o.logloss,4)}</td>
           <td>${pct(o.dirAcc,2)}</td><td>${pct(o.coverage,1)}</td><td class="${o.avgRet>0?"up":"down"}">${pct(o.avgRet,4)}</td>
           <td>${fin(o.vsRandom)?o.vsRandom.toFixed(4):"—"}</td></tr>`).join("")}</tbody></table>
        <div class="infobox" style="margin-top:8px">Accuracy de 3 clases: el azar no es 50%, depende del reparto real de UP/NEUTRAL/DOWN. Por eso la columna que importa es la comparación contra los baselines, no el número absoluto.</div></div>`;
    }catch(e){$("#btOut").innerHTML=`<div class="card"><div class="warnbox">${esc(e.message)}</div></div>`;}
    btn.disabled=false;$("#btBar").style.width="0%";};
  if(UI.bt)paintBacktest(UI.bt);
};
function paintBacktest(r){
  const m=r.metrics,CL=["UP","NEUTRAL","DOWN"];
  const bl=Object.entries(r.baselines);
  $("#btOut").innerHTML=`<div class="grid">
    <div class="card c12"><div class="row">
      <span class="prov ${r.tier.tier===3?"p-live":r.tier.tier===2?"p-rec":"p-imp"}">${esc(r.tier.label)}</span>
      <span class="tag">${esc(r.tier.note)}</span><span class="sp"></span>
      <span class="tag">procedencia: ${Object.entries(r.prov||{}).map(([k,v])=>k+"="+v).join(" · ")}</span></div></div>
    <div class="card c4"><h3>Resultado fuera de muestra</h3>
      <dl class="kv"><dt>predicciones</dt><dd>${m.n.toLocaleString()}</dd>
      <dt>muestras totales</dt><dd>${r.samples.toLocaleString()}</dd>
      <dt>accuracy</dt><dd>${pct(m.acc,2)}</dd>
      <dt>IC 95% (Wilson)</dt><dd>${pct(m.ci[0],2)} – ${pct(m.ci[1],2)}</dd>
      <dt>Brier (3 clases)</dt><dd>${fmt(m.brier,4)}</dd>
      <dt>LogLoss</dt><dd>${fmt(m.logloss,4)}</dd>
      <dt>Directional accuracy</dt><dd>${pct(m.dirAcc,2)} <span class="tag">n=${m.dirN}</span></dd>
      <dt>cobertura (no NEUTRAL)</dt><dd>${pct(m.coverage,1)}</dd>
      <dt>retorno medio por señal</dt><dd class="${m.avgRet>0?"up":"down"}">${pct(m.avgRet,4)}</dd>
      <dt>MFE medio</dt><dd class="up">${pct(m.avgMFE,4)}</dd>
      <dt>MAE medio</dt><dd class="down">${pct(m.avgMAE,4)}</dd></dl>
      <div class="warnbox" style="margin-top:8px">El retorno medio no incluye comisiones, slippage ni funding. No es una curva de equity.</div></div>
    <div class="card c4"><h3>Matriz de confusión <span class="hint">filas = real</span></h3>
      <table><thead><tr><th></th>${CL.map(c=>`<th>pred ${c}</th>`).join("")}<th>P</th><th>R</th><th>F1</th></tr></thead>
      <tbody>${CL.map(a=>`<tr><td class="dim">${a}</td>${CL.map(b=>`<td class="${a===b?"up":""}">${m.cm[a][b]}</td>`).join("")}
        <td>${pct(m.per[a].P,1)}</td><td>${pct(m.per[a].R,1)}</td><td>${pct(m.per[a].F1,1)}</td></tr>`).join("")}</tbody></table>
      <h3 style="margin-top:12px">Folds walk-forward</h3>
      <table><thead><tr><th>#</th><th>train</th><th>test</th><th>desde</th><th>hasta</th></tr></thead>
      <tbody>${r.folds.map(f=>`<tr><td>${f.fold}</td><td>${f.train}</td><td>${f.test}</td><td class="dim">${f.from}</td><td class="dim">${f.to}</td></tr>`).join("")}</tbody></table></div>
    <div class="card c4"><h3>Calibración <span class="hint">¿un 70% declarado acierta el 70%?</span></h3>
      <canvas id="cCal"></canvas>
      <table style="margin-top:6px"><thead><tr><th>bin</th><th>n</th><th>declarada</th><th>observada</th></tr></thead>
      <tbody>${r.calib.filter(b=>b.n).map(b=>`<tr><td>${b.bin}</td><td>${b.n}</td><td>${pct(b.pMean,1)}</td>
        <td class="${b.obs>=b.pMean?"up":"down"}">${pct(b.obs,1)}</td></tr>`).join("")}</tbody></table></div>
    <div class="card c12"><h3>Contra los baselines obligatorios <span class="hint">McNemar pareado sobre las mismas muestras</span></h3>
      <table><thead><tr><th>Baseline</th><th>Accuracy</th><th>Δ modelo − baseline</th><th>IC 95% de Δ (bootstrap)</th><th>McNemar n01/n10</th><th>p</th><th>Veredicto</th></tr></thead>
      <tbody>${bl.map(([k,b])=>{const d=m.acc-b.acc,sig=fin(b.mcnemar.p)&&b.mcnemar.p<0.05;
        return `<tr><td>${esc(b.name)}</td><td>${pct(b.acc,2)}</td><td class="${d>0?"up":"down"}">${d>0?"+":""}${pct(d,2)}</td>
        <td class="dim">${pct(b.ciDiff[0],2)} … ${pct(b.ciDiff[1],2)}</td><td>${b.mcnemar.n01}/${b.mcnemar.n10}</td>
        <td>${fin(b.mcnemar.p)?b.mcnemar.p.toFixed(4):"—"}</td>
        <td class="${sig&&d>0?"up":sig?"down":"neu"}">${!fin(b.mcnemar.p)?"sin potencia":sig?(d>0?"mejor (p<0.05)":"peor (p<0.05)"):"indistinguible"}</td></tr>`;}).join("")}</tbody></table>
      <div class="infobox" style="margin-top:8px">Si el IC de Δ cruza el cero, el modelo no ha demostrado nada sobre ese baseline con esta muestra.</div></div>
    <div class="card c12"><h3>Predicciones del test <span class="hint">${m.n} filas fuera de muestra</span></h3>
      <div class="row" style="margin-bottom:6px"><button class="sm" onclick="EXP.backtest(UI.bt,'csv')">Exportar CSV</button>
        <button class="sm" onclick="EXP.backtest(UI.bt,'json')">Exportar JSON</button>
        <span class="tag">features usadas (${r.feats.length}): ${esc(r.feats.join(", ").slice(0,220))}…</span></div>
      <div class="scroll"><table><thead><tr><th>timestamp</th><th>precio</th><th>pred</th><th>UP</th><th>NEU</th><th>DOWN</th><th>conf</th><th>real</th><th>ret</th><th>ok</th><th>factores</th></tr></thead>
      <tbody>${r.rows.slice(-400).reverse().map(x=>`<tr><td class="dim">${ts(x.t)}</td><td>${fmt(x.price,2)}</td>
        <td class="${x.yhat==="UP"?"up":x.yhat==="DOWN"?"down":"neu"}">${x.yhat}</td>
        <td>${(x.p.UP*100).toFixed(1)}</td><td>${(x.p.NEUTRAL*100).toFixed(1)}</td><td>${(x.p.DOWN*100).toFixed(1)}</td>
        <td>${x.conf}</td><td class="${x.y==="UP"?"up":x.y==="DOWN"?"down":"neu"}">${x.y}</td>
        <td class="${x.ret>0?"up":"down"}">${pct(x.ret,3)}</td><td>${x.y===x.yhat?"✓":"·"}</td>
        <td class="dim">${esc(x.top.slice(0,3).map(c=>c.id).join(" "))}</td></tr>`).join("")}</tbody></table></div></div>
  </div>`;
  CH.reliability($("#cCal"),r.calib);
}

/* ---------- VALIDACIÓN DE TESIS ---------- */
const QUESTIONS=[
  {id:"ob",q:"¿El order book contiene información predictiva para la siguiente vela?",cats:["orderbook"]},
  {id:"of",q:"¿El order flow mejora el resultado?",cats:["orderflow"]},
  {id:"dv",q:"¿El Open Interest y el funding aportan información adicional?",cats:["derivatives"]},
  {id:"lq",q:"¿Las liquidaciones aportan información adicional?",cats:["liquidations"]},
  {id:"xe",q:"¿Combinar varios exchanges mejora la predicción?",cats:["crossexch"]},
  {id:"vol",q:"¿El volumen aporta algo más allá del precio?",cats:["volume"]}
];
RENDER_thesis=function(){
  const s=$("#tab-thesis");
  s.innerHTML=`<div class="grid">
    <div class="card c12"><h3>Validación de la tesis <span class="hint">ablación por bloques + significancia</span></h3>
      <div class="row"><label class="inline">horizonte <select id="thH">${CFG.horizons.map(h=>`<option value="${h}">${h} velas</option>`).join("")}</select></label>
        <label class="inline">modelo <select id="thM">${["M5","M6","M7"].map(m=>`<option value="${m}">${esc(MODELS[m].name)}</option>`).join("")}</select></label>
        <button class="primary" id="thRun">Ejecutar ablación</button>
        <button class="sm" id="thH2">Comparar 1m vs 60m</button></div>
      <div class="meter" style="margin-top:8px"><i id="thBar" style="width:0%"></i></div>
      <div class="tag" id="thState"></div>
      <div class="infobox" style="margin-top:8px">Cada pregunta se responde igual: se entrena el modelo <b>sin</b> ese bloque de features y <b>con</b> él, sobre exactamente el mismo test, y se compara con McNemar. Si el bloque no tiene datos cargados, la respuesta es “datos insuficientes”, no “no aporta”.</div></div>
    <div id="thOut" style="grid-column:span 12"></div></div>`;
  $("#thRun").onclick=async()=>{
    const btn=$("#thRun");btn.disabled=true;
    try{
      const D=await getDataset();const ctx=buildCtx(D);ENGINE.ctx=ctx;
      const h=+$("#thH").value,mid=$("#thM").value;
      const backup={...CFG.disabledFeatures};
      const off=cats=>{CFG.disabledFeatures={...backup};
        for(const f of FEATURES)if(cats.includes(f.cat))CFG.disabledFeatures[f.id]=1;};
      $("#thState").textContent="base (sólo precio y volumen)…";
      off(CATS.filter(c=>c!=="price"&&c!=="volume"));
      const base=await runBacktest({ctx,hBars:h,modelId:mid});
      const rows=[];let i=0;
      for(const Q of QUESTIONS){
        $("#thState").textContent=Q.q;
        const available=Q.cats.every(c=>FEATURES.filter(f=>f.cat===c).some(f=>f.needs.every(n=>ctx.has[n])));
        if(!available){rows.push({Q,verdict:"DATOS INSUFICIENTES",note:"no hay datos cargados para "+Q.cats.map(c=>CAT_ES[c]).join("+")});}
        else{
          off(CATS.filter(c=>c!=="price"&&c!=="volume"&&!Q.cats.includes(c)));
          const r=await runBacktest({ctx,hBars:h,modelId:mid});
          const n=Math.min(base.metrics.hit.length,r.metrics.hit.length);
          const mc=ST.mcnemar(r.metrics.hit.slice(0,n),base.metrics.hit.slice(0,n));
          const ci=ST.bootstrapDiff(r.metrics.hit.slice(0,n),base.metrics.hit.slice(0,n));
          const d=r.metrics.acc-base.metrics.acc;
          rows.push({Q,acc:r.metrics.acc,brier:r.metrics.brier,d,ci,p:mc.p,
            verdict:!fin(mc.p)?"SIN POTENCIA ESTADÍSTICA":(mc.p<0.05&&d>0)?"SÍ, APORTA":(mc.p<0.05&&d<0)?"EMPEORA":"NO DEMOSTRADO"});}
        $("#thBar").style.width=(++i/QUESTIONS.length*100)+"%";await sleep(0);}
      CFG.disabledFeatures=backup;CFG.save();
      UI.thesis={base,rows,h,mid,tier:base.tier};
      paintThesis(UI.thesis);
    }catch(e){$("#thOut").innerHTML=`<div class="card"><div class="warnbox">${esc(e.message)}</div></div>`;}
    btn.disabled=false;$("#thBar").style.width="0%";$("#thState").textContent="";};
  $("#thH2").onclick=async()=>{
    const btn=$("#thH2");btn.disabled=true;
    try{const D=await getDataset();const ctx=buildCtx(D);const out=[];
      for(const h of CFG.horizons){$("#thState").textContent="horizonte "+h+"…";
        try{const r=await runBacktest({ctx,hBars:h,modelId:$("#thM").value});
          const top=Object.entries(r.rows.reduce((a,x)=>{for(const c of x.top)a[c.id]=(a[c.id]||0)+Math.abs(c.c);return a;},{}))
            .sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
          out.push({h,acc:r.metrics.acc,ci:r.metrics.ci,brier:r.metrics.brier,base:r.baselines.prevCandle.acc,p:r.baselines.prevCandle.mcnemar.p,top});}
        catch(e){out.push({h,err:e.message});}await sleep(0);}
      $("#thOut").innerHTML=`<div class="card"><h3>¿Las variables que funcionan a 1m funcionan a 60m?</h3>
        <table><thead><tr><th>Horizonte</th><th>Accuracy</th><th>IC 95%</th><th>Brier</th><th>vs vela previa</th><th>p</th><th>Features dominantes</th></tr></thead>
        <tbody>${out.map(o=>o.err?`<tr><td>${o.h}</td><td colspan="6" class="dim">${esc(o.err)}</td></tr>`:
          `<tr><td>${o.h} velas</td><td>${pct(o.acc,2)}</td><td class="dim">${pct(o.ci[0],1)}–${pct(o.ci[1],1)}</td>
           <td>${fmt(o.brier,4)}</td><td>${pct(o.base,2)}</td><td>${fin(o.p)?o.p.toFixed(4):"—"}</td>
           <td class="dim">${esc(o.top.join(", "))}</td></tr>`).join("")}</tbody></table></div>`;
    }catch(e){$("#thOut").innerHTML=`<div class="card"><div class="warnbox">${esc(e.message)}</div></div>`;}
    btn.disabled=false;$("#thState").textContent="";};
  if(UI.thesis)paintThesis(UI.thesis);
};
function paintThesis(T){
  const vcol=v=>v==="SÍ, APORTA"?"up":v==="EMPEORA"?"down":"neu";
  $("#thOut").innerHTML=`<div class="grid">
    <div class="card c12"><div class="row"><span class="prov ${T.tier.tier===3?"p-live":"p-imp"}">${esc(T.tier.label)}</span>
      <span class="tag">${esc(T.tier.note)}</span></div></div>
    <div class="card c12"><h3>Respuestas <span class="hint">modelo ${esc(T.mid)} · horizonte ${T.h} velas · base = precio + volumen (acc ${pct(T.base.metrics.acc,2)}, n=${T.base.metrics.n})</span></h3>
      <table><thead><tr><th>Pregunta</th><th>Accuracy con el bloque</th><th>Δ vs base</th><th>IC 95% de Δ</th><th>p</th><th>Respuesta</th></tr></thead>
      <tbody>${T.rows.map(r=>`<tr><td style="white-space:normal;max-width:380px">${esc(r.Q.q)}</td>

const RENDER={live:RENDER_live,next:RENDER_next,data:RENDER_data,import:RENDER_import,features:RENDER_features,
  models:RENDER_models,backtest:RENDER_backtest,thesis:RENDER_thesis,log:RENDER_log,
  settings:RENDER_settings,help:RENDER_help};
let loops=[];
function startLoops(){
  loops.forEach(clearInterval);loops=[];
  loops.push(setInterval(()=>{$("#clock").textContent=new Date().toISOString().slice(11,19)+" UTC";},1000));
  loops.push(setInterval(()=>{ // muestreo del libro -> historial en memoria
    if(MKT.book&&(!MKT.bookHist.length||MKT.book.t>last(MKT.bookHist).t)){
      MKT.bookHist.push(MKT.book);if(MKT.bookHist.length>4000)MKT.bookHist.splice(0,1000);}
    if(UI.tab==="live"){renderStrip();renderMicroPanels();UI.renderHealth();}
  },Math.max(1000,CFG.refreshMs)));
  loops.push(setInterval(async()=>{ // cola de velas + cierre de vela
    try{const k=await FEED.klines(MKT.sym,"1m",3);
      for(const nk of k){const i=MKT.klines.findIndex(x=>x.t===nk.t);
        if(i>=0)MKT.klines[i]=nk;else MKT.klines.push(nk);}
      MKT.klines.sort((a,b)=>a.t-b.t);
      const lastClosed=MKT.klines.filter(x=>x.ct<now()).pop();
      if(lastClosed&&lastClosed.t!==MKT._lastBar){MKT._lastBar=lastClosed.t;
        if(CFG.autoPredict)await ENGINE.predictNow();else await ENGINE.resolve();
        if(UI.tab==="live"){renderPredCards();drawLiveCharts();}}
      MKT.health.klines="ok";}catch(e){MKT.health.klines="bad";}
  },15000));
  loops.push(setInterval(async()=>{ // derivados + cross exchange
    try{const d=await FEED.derivs(MKT.sym);
      if(d&&fin(d.oi)){MKT.derivNow=d;
        pushSeries(MKT.oi,{t:d.t,oi:d.oi,prov:"LIVE"},3000);
        pushSeries(MKT.funding,{t:d.t,rate:d.rate,mark:d.mark,index:d.index,prov:"LIVE"},3000);}
    }catch(e){}
    try{const x=await FEED.cross(MKT.sym);
      if(x.length>1){
        const px=Object.fromEntries(x.map(o=>[o.ex,o.price])),vals=x.map(o=>o.price),avg=mean(vals);
        const srt=vals.slice().sort((a,b)=>a-b);
        const med=srt.length%2?srt[(srt.length-1)/2]:(srt[srt.length/2-1]+srt[srt.length/2])/2;
        /* FIX: antes "presión cross-exchange" era simplemente el OBI de Binance,
           con lo que el nombre mentía. Ahora es la desviación de cada exchange
           respecto a la mediana del grupo, ponderada por su volumen: positiva
           si las plazas con más volumen cotizan por encima del resto. */
        const w=x.map(o=>fin(o.vol)&&o.vol>0?o.vol:1), wt=sum(w);
        const pressure=med>0?sum(x.map((o,i)=>w[i]*(o.price-med)/med))/wt:NaN;
        /* FIX: "liderazgo" era la dispersión de retornos (siempre positiva).
           Ahora es el exceso de movimiento del exchange que más se movió
           respecto a la mediana de los movimientos, con su signo. */
        const prev=last(MKT.xe);
        let lead=NaN,leader=null;
        if(prev){
          const d=x.map(o=>({ex:o.ex,d:prev.px[o.ex]>0?o.price/prev.px[o.ex]-1:NaN})).filter(o=>fin(o.d));
          if(d.length>1){
            const ds=d.map(o=>o.d).sort((a,b)=>a-b);
            const md=ds.length%2?ds[(ds.length-1)/2]:(ds[ds.length/2-1]+ds[ds.length/2])/2;
            const top=d.reduce((a,b)=>Math.abs(b.d)>Math.abs(a.d)?b:a);
            lead=top.d-md; leader=top.ex;}}
        pushSeries(MKT.xe,{t:now(),px,avg,med,spread:(Math.max(...vals)-Math.min(...vals))/avg,
          pressure,lead,leader,obiBinance:MKT.book?MKT.book.obiAll:NaN,prov:"LIVE"},2000);}
    }catch(e){}
    if(UI.tab==="live")renderMicroPanels();
  },30000));
}
async function boot(reload=false){
  if(!reload){
    try{await DB.open();}catch(e){toast("IndexedDB no disponible: la app funciona pero no guarda nada");}
    try{MKT.levels=JSON.parse(localStorage.getItem("ccdp.levels")||"[]");}catch(e){MKT.levels=[];}
    mountTabs();startLoops();
  }
  MKT.sym=CFG.asset;MKT.mkt=CFG.market;
  MKT.klines=[];MKT.bookHist=[];MKT.trades=[];MKT.oi=[];MKT.funding=[];MKT.liq=[];MKT.xe=[];MKT.book=null;
  FEED.closeWS();
  try{MKT.klines=await FEED.klines(MKT.sym,"1m",1000);MKT.price=last(MKT.klines).c;MKT.health.klines="ok";}
  catch(e){MKT.health.klines="bad";toast("No se pudieron cargar velas: "+e.message);}
  try{const b=await FEED.depth(MKT.sym);if(b){MKT.book=b;MKT.bookHist.push(b);}}catch(e){}
  FEED.openWS(MKT.sym);
  FEED.derivHist(MKT.sym).then(d=>{if(d.length)MKT.oi=d;}).catch(()=>{});
  FEED.fundingHist(MKT.sym).then(d=>{if(d.length)MKT.funding=d;}).catch(()=>{});
  if(CFG.recorder.on)REC.start();
  go(UI.tab);
  setTimeout(()=>ENGINE.predictNow().then(()=>{if(UI.tab==="live"){renderPredCards();drawLiveCharts();}}),3000);
}
window.addEventListener("DOMContentLoaded",()=>boot());
window.addEventListener("beforeunload",()=>{try{FEED.closeWS();}catch(e){}});

<script>
/* =================== 26. PRUEBAS UNITARIAS =============================
   Cubren lo que puede romperse en silencio: aritmética de indicadores,
   agregación del libro, parseo de CSV, estadística y —sobre todo— la
   alineación temporal, que es donde se cuelan los errores que no dan error. */
const TESTS=(()=>{
  const R=[];let G="";
  const grp=g=>{G=g;};
  const push=(name,pass,detail)=>R.push({g:G,name,pass:!!pass,detail:detail||""});
  const near=(a,b,tol)=>fin(a)&&fin(b)&&Math.abs(a-b)<=tol;
  const eq=(name,got,exp)=>push(name,got===exp,`esperado ${exp} · obtenido ${got}`);
  const approx=(name,got,exp,tol=1e-9)=>push(name,near(got,exp,tol),`esperado ${exp} ±${tol} · obtenido ${fin(got)?got:String(got)}`);
  const isNaNv=(name,got)=>push(name,!fin(got),`esperado no-numérico · obtenido ${String(got)}`);
  const truthy=(name,cond,detail)=>push(name,cond,detail||"");

  function run(){

  /* serie sintética determinista para las pruebas de alineación */
  function synth(n){
    const r=mulberry(11),k=[],book=[],T=Date.UTC(2026,0,1);let p=100;
    for(let i=0;i<n;i++){const o=p,c=o*(1+(r()-0.5)*0.004);
      k.push({t:T+i*60000,o,h:Math.max(o,c)*1.001,l:Math.min(o,c)*0.999,c,v:10+r(),tb:5+r(),ct:T+i*60000+59999,prov:"IMP"});
      book.push(OB.fromL2([[c*0.999,5],[c*0.99,10]],[[c*1.001,5],[c*1.01,10]],T+i*60000+30000,"IMP"));
      p=c;}
    return {sym:"T",tf:"1m",k,book,trades:[],oi:[],funding:[],liq:[],levels:[],xe:[],prov:{klines:"IMP",book:"IMP"}};
  }
  function report(r){
    const byG={};for(const t of r.rows)(byG[t.g]=byG[t.g]||[]).push(t);
    return `# CCDP · informe de pruebas unitarias\n\n`+
      `Fecha: ${ts(r.when)} UTC\nResultado: **${r.pass}/${r.total}** pasadas · ${r.ms} ms\n\n`+
      Object.entries(byG).map(([g,ts2])=>`## ${g} (${ts2.filter(t=>t.pass).length}/${ts2.length})\n\n`+
        `| | Prueba | Detalle |\n|---|---|---|\n`+
        ts2.map(t=>`| ${t.pass?"PASS":"FAIL"} | ${t.name} | ${String(t.detail).replace(/\|/g,"\\|")} |`).join("\n")).join("\n\n")+"\n";
  }
  return {run,report,synth};

    const d=[];for(let i=1;i<rows.length;i++)d.push(rows[i].t-rows[i-1].t);
    const m=mean(d),s=sd(d),srt=d.slice().sort((a,b)=>a-b);
    return {med:srt[Math.floor(srt.length/2)],mean:m,cv:m>0?s/m:NaN,min:srt[0],max:srt[srt.length-1]};
  }
  function serie(name,rows,expectedMs){
    if(!rows||!rows.length){add(name,"Serie presente","warn","vacía: las features que dependen de ella quedan fuera");return;}
    let dup=0,back=0;
    for(let i=1;i<rows.length;i++){if(rows[i].t===rows[i-1].t)dup++;else if(rows[i].t<rows[i-1].t)back++;}
    add(name,"Orden y unicidad de timestamps",dup||back?"error":"ok",
      dup||back?`${dup} duplicados, ${back} retrocesos en ${rows.length} filas`:`${rows.length.toLocaleString()} filas ordenadas y sin repetir`);
    const sp=spacingStats(rows);
    if(sp){
      const irregular=fin(sp.cv)&&sp.cv>0.5;
      add(name,"Regularidad del muestreo",irregular?"warn":"ok",
        `mediana ${(sp.med/1000).toFixed(1)}s · rango ${(sp.min/1000).toFixed(1)}–${(sp.max/1000).toFixed(1)}s · CV ${fmt(sp.cv,2)}`+
        (irregular?" · los cálculos de esta serie son por tiempo, no por número de filas":""));
      if(expectedMs){
        const gaps=[];for(let i=1;i<rows.length;i++)if(rows[i].t-rows[i-1].t>expectedMs*1.5)gaps.push(i);
        add(name,"Huecos en la serie",gaps.length?"warn":"ok",
          gaps.length?`${gaps.length} huecos mayores que 1,5× el intervalo esperado`:"sin huecos relevantes");}
    }
    const prov=[...new Set(rows.map(r=>r.prov).filter(Boolean))];
    add(name,"Procedencia",prov.length>1?"warn":"ok",
      prov.length?prov.join(" + ")+(prov.length>1?" mezcladas en la misma serie: compruébalo antes de concluir nada":""):"sin etiquetar");
    const age=now()-last(rows).t;
    add(name,"Antigüedad del último dato",age>600000?"warn":"ok",`${Math.round(age/1000)} s`);
  }
  function run(D){
    out.length=0;
    serie("klines",D.k,60000);
    if(D.k.length){
      const open=D.k.filter(x=>x.ct>=now()).length;
      add("klines","La vela en curso queda fuera del dataset",open?"error":"ok",
        open?`${open} velas sin cerrar incluidas`:"sólo velas cerradas");
      const badOHLC=D.k.filter(x=>!(x.h>=Math.max(x.o,x.c)&&x.l<=Math.min(x.o,x.c))).length;
      add("klines","Coherencia OHLC",badOHLC?"error":"ok",badOHLC?`${badOHLC} velas con máximo/mínimo imposibles`:"máximos y mínimos contienen apertura y cierre");
      const negv=D.k.filter(x=>!(x.v>=0)).length;
      add("klines","Volumen no negativo",negv?"error":"ok",negv?`${negv} velas con volumen inválido`:"ok");
      const tb=D.k.filter(x=>fin(x.tb)&&x.tb>x.v*1.0001).length;
      add("klines","Volumen taker buy ≤ volumen total",tb?"error":"ok",tb?`${tb} velas incoherentes`:"ok");
    }
    serie("order book",D.book,null);
    if(D.book&&D.book.length&&D.k.length){
      const b=last(D.book),c=last(D.k).c;
      const dev=fin(b.mid)&&c>0?Math.abs(b.mid/c-1):NaN;
      add("order book","Mid coherente con el último cierre",!fin(dev)?"warn":dev>0.005?"error":"ok",
        fin(dev)?`desviación ${pct(dev,3)}`:"el archivo agregado no trae mid: las features de spread quedan fuera");
      const cross=D.book.filter(x=>fin(x.bb)&&fin(x.ba)&&x.bb>=x.ba).length;
      add("order book","Libro sin cruzar (bid < ask)",cross?"error":"ok",cross?`${cross} snapshots cruzados`:"ok");
      const outside=D.book.filter(x=>x.t<D.k[0].t||x.t>last(D.k).ct).length;
      add("order book","Snapshots dentro del rango de las velas",outside?"warn":"ok",
        outside?`${outside} snapshots fuera del rango: no se usarán`:"ok");
    }
    serie("open interest",D.oi,null);
    if(D.oi&&D.oi.length){
      const jump=D.oi.filter((x,i)=>i>0&&D.oi[i-1].oi>0&&Math.abs(x.oi/D.oi[i-1].oi-1)>0.25).length;
      add("open interest","Saltos plausibles entre muestras",jump?"warn":"ok",
        jump?`${jump} saltos mayores del 25%: suele indicar dos fuentes mezcladas`:"sin saltos anómalos");
    }
    serie("funding",D.funding,null);
    serie("liquidaciones",D.liq,null);
    if(D.liq&&D.liq.length){
      const bad=D.liq.filter(x=>!["long","short"].includes(x.side)||!(x.qty>0)).length;
      add("liquidaciones","Lado y cantidad válidos",bad?"error":"ok",bad?`${bad} eventos inválidos`:"ok");
    }
    serie("cross-exchange",D.xe,null);
    if(D.levels&&D.levels.length&&fin(MKT.price)){
      const bad=D.levels.filter(l=>(l.side==="long"&&l.price>MKT.price)||(l.side==="short"&&l.price<MKT.price)).length;
      add("niveles","Los clusters están del lado correcto del precio",bad?"error":"ok",
        bad?`${bad} niveles al lado contrario del precio actual`:"ok");
    }
    // cobertura de features
    try{
      const ctx=buildCtx(D),feats=activeFeatures(ctx.has);
      const n=Math.min(200,Math.max(0,ctx.n-80));
      if(n>20){
        const cnt={};for(const f of feats)cnt[f.id]=0;
        for(let i=ctx.n-n;i<ctx.n;i++){const x=featureVector(ctx,i,feats);
          for(const f of feats)if(fin(x[f.id]))cnt[f.id]++;}
        const empty=feats.filter(f=>cnt[f.id]===0).map(f=>f.id);
        const partial=feats.filter(f=>cnt[f.id]>0&&cnt[f.id]<n*0.8).map(f=>f.id);
        add("features","Cobertura en las últimas "+n+" velas",empty.length?"warn":"ok",
          `${feats.length-empty.length}/${feats.length} devuelven valor`+(empty.length?` · vacías: ${empty.join(", ")}`:""));
        if(partial.length)add("features","Features con huecos","warn",partial.join(", "));
      }else add("features","Cobertura","warn","pocas velas para medirla");
    }catch(e){add("features","Cobertura","error",e.message);}
    const skew=D.k.length?now()-last(D.k).ct:NaN;
    add("reloj","Desfase con el último cierre de vela",fin(skew)&&skew>180000?"warn":"ok",
      fin(skew)?`${Math.round(skew/1000)} s`:"—");
    return out.slice();
  }
  function report(rows){
    const c={ok:0,warn:0,error:0};for(const r of rows)c[r.level]++;
    return `# CCDP · informe de consistencia de datos\n\nFecha: ${ts(now())} UTC\n`+
      `Símbolo: ${MKT.sym} (${MKT.mkt})\n\nResumen: ${c.ok} correctos · ${c.warn} avisos · ${c.error} errores\n\n`+
      `| Serie | Comprobación | Nivel | Detalle |\n|---|---|---|---|\n`+
      rows.map(r=>`| ${r.series} | ${r.name} | ${r.level} | ${String(r.detail).replace(/\|/g,"\\|")} |`).join("\n")+"\n";
  }
  return {run,report};
})();
</script>
